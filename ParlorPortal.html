<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DORA-PARLOR ポータル</title>
    <style>
        /* 画面全体に隙間なくiframeをフィットさせる設定 */
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            background-color: #000;
            overflow: hidden;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            margin: 0;
            padding: 0;
            display: block;
        }
    </style>
</head>
<body>

    <!-- 初期状態ではホールアプリを読み込みます -->
    <iframe id="appFrame" src="PachinkoParlor.html" allow="autoplay"></iframe>

    <script>
        // 確実に要素を取得するため、IDやタグ名からiframeを取得
        const frame = document.getElementById('appFrame') || document.getElementById('mainFrame') || document.querySelector('iframe');

        window.addEventListener('message', (event) => {
            // 安全チェック：データが空、またはオブジェクトじゃない場合は何もしない
            if (!event.data || typeof event.data !== 'object') return;

            // 【修正ポイント】event.data から url も一緒に受け取るようにしました
            const { type, machineId, url } = event.data;

            // 1. ホールから台へ着席するとき
            if (type === 'SIT_DOWN') {
                console.log('[Portal] 台へ移動します。対象スキン:', machineId);
                const targetSkin = machineId ? machineId : 'default';
                
                // タップの権利を保持したままURLを切り替え
                frame.src = `PachinkoMachine.html?machine=${targetSkin}`;
            }

            // 2. 台からホールに戻るとき
            if (type === 'RETURN_HALL') {
                console.log('[Portal] ホールへ戻ります。');
                
                // 戻るボタンのタップ権利を生かしたまま、ホールのURLに切り替え
                frame.src = 'PachinkoParlor.html';
            }

            // 3. ポータルトップや大金庫など外部ページへ抜けるとき 【★イベントの中に正しく移動しました】
            if (type === 'NAVIGATE_TOP' && url) {
                console.log('[Portal] 外部ページへ遷移します:', url);
                window.top.location.href = url;
            }
        }); // ここで全てのイベント処理が正しく閉じます
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AIキラコメメーカー ✨</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        #previewChatContainer { scroll-behavior: smooth; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
    </style>
</head>
<body class="bg-pink-50 text-gray-800 font-sans min-h-screen pb-20">

    <header class="bg-white shadow-sm sticky top-0 z-40">
        <div class="max-w-md mx-auto px-4 py-3 flex justify-between items-center">
            <h1 class="font-bold text-lg text-pink-600 flex items-center gap-1">
                <span>✨</span> AIキラコメメーカー
            </h1>
            <button id="openSettingsBtn" class="p-2 text-gray-500 hover:text-pink-600 rounded-full bg-gray-100 transition font-bold text-sm">
                ⚙️設定
            </button>
        </div>
    </header>

    <main class="max-w-md mx-auto p-4 space-y-6">
        
        <div class="flex bg-white rounded-xl shadow-sm overflow-hidden text-sm font-medium">
            <button id="tabCreateBtn" class="flex-1 py-3 text-center bg-pink-100 text-pink-700 transition">📝 作成する</button>
            <button id="tabStockBtn" class="flex-1 py-3 text-center text-gray-500 hover:bg-gray-50 transition">⭐ ストック</button>
        </div>

        <div id="tabCreate" class="tab-content active space-y-4">
            <div class="bg-white p-4 rounded-xl shadow-sm border border-pink-100">
                <label for="inputText" class="block text-sm font-bold text-gray-700 mb-2">元になる文章・キーワードを入力</label>
                <textarea id="inputText" rows="3" class="w-full p-3 bg-gray-50 border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-pink-400 focus:border-transparent resize-none" placeholder="例：初見です、歌うま！、かわいい、応援してるよ など..."></textarea>
                
                <button id="generateBtn" class="w-full mt-3 bg-pink-500 hover:bg-pink-600 text-white font-bold py-3 px-4 rounded-lg shadow-md transition flex items-center justify-center gap-2">
                    <span>10件生成する</span>
                    <span id="loadingIcon" class="hidden animate-spin">⏳</span>
                </button>
            </div>

            <div id="resultsWrapper" class="hidden">
                <h2 class="text-sm font-bold text-gray-600 mb-2 flex flex-col sm:flex-row sm:justify-between sm:items-center gap-1">
                    <span>生成結果</span>
                    <span class="text-[10px] sm:text-xs font-bold text-white bg-gray-400 px-2 py-1 rounded w-fit" id="generationModeText"></span>
                </h2>
                <div id="resultsContainer" class="space-y-3">
                    <!-- JSで動的に追加 -->
                </div>
            </div>
        </div>

        <div id="tabStock" class="tab-content space-y-4">
            <div class="bg-white p-4 rounded-xl shadow-sm border border-pink-100">
                <h2 class="text-sm font-bold text-gray-700 mb-3">お気に入りキラコメ</h2>
                <div id="stockContainer" class="space-y-3">
                    <!-- JSで動的に追加 -->
                </div>
            </div>
        </div>

        <div class="bg-gray-900 rounded-xl overflow-hidden shadow-lg border-2 border-gray-800 relative flex flex-col">
            <div class="bg-gray-800 text-white text-xs px-3 py-2 flex justify-between items-center border-b border-gray-700">
                <span class="flex items-center gap-1.5"><span class="w-2 h-2 rounded-full bg-red-500 animate-ping"></span> 🔴 ライブ配信プレビュー</span>
                <div class="flex items-center gap-2">
                    <button id="toggleAutoChatBtn" class="bg-pink-600 hover:bg-pink-500 text-white px-2 py-0.5 rounded text-[10px] font-bold transition">▶️ 自動コメント流し</button>
                    <span class="text-gray-400">👤 1,234</span>
                </div>
            </div>
            
            <div id="previewChatContainer" class="h-52 p-3 overflow-y-auto flex flex-col justify-end space-y-2 font-sans">
                <div class="text-gray-500 text-xs text-center py-8">
                    「👁️ 配信に流す」ボタンを押すか、上部の自動コメントで<br>配信の雰囲気をテストできます！
                </div>
            </div>

            <div class="bg-gray-800 p-2 flex items-center gap-2 border-t border-gray-700">
                <div class="bg-gray-700 text-gray-400 text-xs px-3 py-1.5 rounded-full flex-1 truncate">コメントを入力...</div>
                <div class="w-7 h-7 bg-pink-500 rounded-full flex items-center justify-center text-white text-xs font-bold">💬</div>
            </div>
        </div>

    </main>

    <div id="settingsModal" class="fixed inset-0 bg-black bg-opacity-50 z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-xl shadow-xl w-full max-w-sm overflow-hidden">
            <div class="px-4 py-3 bg-gray-50 border-b flex justify-between items-center">
                <h3 class="font-bold text-gray-800">⚙️ 設定</h3>
                <button id="closeSettingsBtn" class="text-gray-500 hover:text-gray-800 font-bold text-xl">&times;</button>
            </div>
            <div class="p-4 space-y-4">
                <div>
                    <label for="apiKeyInput" class="block text-sm font-bold text-gray-700 mb-1">Gemini API キー</label>
                    <input type="password" id="apiKeyInput" class="w-full p-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-pink-400" placeholder="AIzaSy...">
                    <p class="text-xs text-gray-500 mt-2">
                        APIキーを設定すると高品質なAI生成が行われます。未設定の場合は簡易的なローカル生成になります。
                    </p>
                </div>
                <div class="text-center pt-2">
                    <a href="https://aistudio.google.com/app/apikey" target="_blank" rel="noopener noreferrer" class="inline-block bg-blue-50 hover:bg-blue-100 text-blue-600 text-sm font-semibold py-2 px-4 rounded-lg border border-blue-200 transition">
                        🔑 APIキー取得 (無料)
                    </a>
                </div>
                <button id="saveSettingsBtn" class="w-full bg-gray-800 hover:bg-gray-900 text-white font-bold py-2 px-4 rounded-lg transition">
                    保存して閉じる
                </button>
            </div>
        </div>
    </div>

    <div id="toast" class="fixed bottom-5 left-1/2 -translate-x-1/2 bg-gray-800 text-white text-sm px-4 py-2 rounded-full shadow-lg transition-opacity duration-300 opacity-0 pointer-events-none z-50 whitespace-nowrap">
        メッセージ
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const els = {
                inputText: document.getElementById('inputText'),
                generateBtn: document.getElementById('generateBtn'),
                loadingIcon: document.getElementById('loadingIcon'),
                resultsWrapper: document.getElementById('resultsWrapper'),
                resultsContainer: document.getElementById('resultsContainer'),
                generationModeText: document.getElementById('generationModeText'),
                stockContainer: document.getElementById('stockContainer'),
                tabCreateBtn: document.getElementById('tabCreateBtn'),
                tabStockBtn: document.getElementById('tabStockBtn'),
                tabCreate: document.getElementById('tabCreate'),
                tabStock: document.getElementById('tabStock'),
                previewChatContainer: document.getElementById('previewChatContainer'),
                toggleAutoChatBtn: document.getElementById('toggleAutoChatBtn'),
                openSettingsBtn: document.getElementById('openSettingsBtn'),
                closeSettingsBtn: document.getElementById('closeSettingsBtn'),
                saveSettingsBtn: document.getElementById('saveSettingsBtn'),
                settingsModal: document.getElementById('settingsModal'),
                apiKeyInput: document.getElementById('apiKeyInput'),
                toast: document.getElementById('toast')
            };

            for (const key in els) {
                if (!els[key]) return;
            }

            let stockItems = JSON.parse(localStorage.getItem('kirakome_stock')) || [];
            let autoChatTimer = null;

            els.tabCreateBtn.addEventListener('click', () => switchTab('create'));
            els.tabStockBtn.addEventListener('click', () => switchTab('stock'));

            els.openSettingsBtn.addEventListener('click', () => {
                els.apiKeyInput.value = localStorage.getItem('gemini_api_key') || '';
                els.settingsModal.classList.remove('hidden');
            });
            els.closeSettingsBtn.addEventListener('click', () => els.settingsModal.classList.add('hidden'));
            els.saveSettingsBtn.addEventListener('click', () => {
                localStorage.setItem('gemini_api_key', els.apiKeyInput.value.trim());
                els.settingsModal.classList.add('hidden');
                showToast('設定を保存しました');
            });

            els.generateBtn.addEventListener('click', handleGenerate);
            els.resultsContainer.addEventListener('click', handleListAction);
            els.stockContainer.addEventListener('click', handleListAction);
            els.toggleAutoChatBtn.addEventListener('click', toggleAutoChat);

            renderStock();

            function switchTab(tab) {
                if (tab === 'create') {
                    els.tabCreate.classList.add('active');
                    els.tabStock.classList.remove('active');
                    els.tabCreateBtn.className = 'flex-1 py-3 text-center bg-pink-100 text-pink-700 transition';
                    els.tabStockBtn.className = 'flex-1 py-3 text-center text-gray-500 hover:bg-gray-50 transition';
                } else {
                    els.tabCreate.classList.remove('active');
                    els.tabStock.classList.add('active');
                    els.tabCreateBtn.className = 'flex-1 py-3 text-center text-gray-500 hover:bg-gray-50 transition';
                    els.tabStockBtn.className = 'flex-1 py-3 text-center bg-pink-100 text-pink-700 transition';
                }
            }

            async function handleGenerate() {
                const text = els.inputText.value.trim();
                const savedApiKey = localStorage.getItem('gemini_api_key');

                els.generateBtn.disabled = true;
                els.generateBtn.classList.add('opacity-75');
                els.loadingIcon.classList.remove('hidden');
                els.resultsWrapper.classList.add('hidden');
                els.resultsContainer.innerHTML = '';
                
                els.generationModeText.className = "text-[10px] sm:text-xs font-bold text-white px-2 py-1 rounded w-fit";

                let generatedComments = [];

                if (!savedApiKey) {
                    els.generationModeText.textContent = "⚙️ 未設定: ローカル生成";
                    els.generationModeText.classList.add('bg-gray-400');
                    generatedComments = generateLocal(text);
                } else {
                    els.generationModeText.textContent = "⏳ API接続中...";
                    els.generationModeText.classList.add('bg-blue-400');
                    els.resultsWrapper.classList.remove('hidden');
                    
                    try {
                        const result = await generateViaAPI(text, savedApiKey);
                        generatedComments = result.comments;
                        els.generationModeText.textContent = `✨ AI生成 (${result.model})`;
                        els.generationModeText.classList.replace('bg-blue-400', 'bg-pink-500');
                    } catch (error) {
                        els.generationModeText.textContent = `⚠️ エラー発生: ローカル生成`;
                        els.generationModeText.classList.replace('bg-blue-400', 'bg-red-500');
                        generatedComments = generateLocal(text);
                    }
                }

                renderResults(generatedComments);

                els.generateBtn.disabled = false;
                els.generateBtn.classList.remove('opacity-75');
                els.loadingIcon.classList.add('hidden');
                els.resultsWrapper.classList.remove('hidden');
            }

            async function generateViaAPI(text, apiKey) {
                const prompt = `あなたはライブ配信アプリ（歌枠や雑談枠など）を盛り上げるための、可愛くて魅力的な「キラコメ（デコレーションコメント）」を作成する天才コピーライター兼デコレーターです。

ユーザーから入力された【キーワードや文章】をそのまま前後に記号で挟むだけ（例：✨キーワード✨）の単純な出力は【絶対に禁止】します。

以下のステップで、高品質なキラコメを10個作成してください。
1. 入力内容の意図、感情、情景を読み取り、配信者を褒めたり、応援したり、その場の空気を盛り上げるような「短くて魅力的な文章（またはフレーズ）」を新たに作成・アレンジしてください。
2. その文章に合うように、可愛い絵文字、顔文字、アスキーアートのような特殊記号をふんだんに使い、視覚的に目立つ華やかなデコレーションを施してください。

【バグ回避のための絶対ルール（厳守）】
1. 【単なる記号での挟み込み禁止】：入力された言葉をそのまま使うだけでなく、必ず前後の文脈を補って意味のある魅力的なフレーズに昇華させること。
2. 【名前の補完禁止】：「ハイミー」や特定のライバー名を勝手に入れない。誰の配信でも汎用的に使える文章にすること。
3. 【フォーマット】：1行につき1つのキラコメのみを出力。箇条書きの番号（1. 2. 等）、解説、挨拶などは一切含めないこと。必ず10行のテキストのみを出力してください。

入力内容: 「${text || "わいわい盛り上がっていこう"}」`;

                const modelList = ['gemini-1.5-flash', 'gemini-2.5-flash', 'gemini-3-flash-preview', 'gemini-2.5-flash-preview-09-2025'];

                for (const currentModel of modelList) {
                    const url = `https://generativelanguage.googleapis.com/v1beta/models/${currentModel}:generateContent?key=${apiKey}`;
                    try {
                        const controller = new AbortController();
                        const timeoutId = setTimeout(() => controller.abort(), 15000);

                        const response = await fetch(url, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            signal: controller.signal,
                            body: JSON.stringify({
                                contents: [{ parts: [{ text: prompt }] }],
                                generationConfig: { temperature: 0.9 }
                            })
                        });
                        
                        clearTimeout(timeoutId);
                        if (!response.ok) continue;

                        const data = await response.json();
                        const outputText = data.candidates?.[0]?.content?.parts?.[0]?.text;
                        if (!outputText) continue;
                        
                        const comments = outputText.split('\n')
                            .map(line => line.replace(/^[-\d\.\)\]\*]+\s*/, '').trim())
                            .filter(line => line.length > 0)
                            .slice(0, 10);
                            
                        if (comments.length > 0) return { comments: comments, model: currentModel };
                    } catch (err) {}
                }
                throw new Error("すべてのAPIモデルで通信に失敗しました");
            }

            function generateLocal(text) {
                const baseText = text || "わいわい";
                return [
                    `✨✨ すごい！${baseText}すぎるっ ✨✨`,
                    `*+:｡.｡ 最高！${baseText} ｡.｡:+*`,
                    `🌸･*:.｡. ${baseText}でテンション上がる！ .｡.:*･🌸`,
                    `🎶✧*｡ めっちゃ${baseText} ✧*｡🎶`,
                    `🎀𓂃 𓈒𓏸 かわいい〜！${baseText} 𓂃 𓈒𓏸🎀`,
                    `🌟.｡.:*･ﾟ ${baseText}、応援してるよ！ ﾟ･*:.｡.🌟`,
                    `💎 ⁺ ｡ ﾟ ${baseText}ってホント！？ ﾟ ｡ ⁺ 💎`,
                    `💖 ᕱ⑅ᕱ ${baseText} ᕱ⑅ᕱ 💖`,
                    `🎉( ﾉ*>∀<)ﾉ ${baseText}だぁぁぁ 🎉`,
                    `🌈 ♬*゜ ${baseText} ♬*゜🌈`
                ];
            }

            function renderResults(comments) {
                els.resultsContainer.innerHTML = '';
                comments.forEach(comment => els.resultsContainer.appendChild(createCommentElement(comment, false)));
            }

            function renderStock() {
                els.stockContainer.innerHTML = '';
                if (stockItems.length === 0) {
                    els.stockContainer.innerHTML = '<p class="text-sm text-gray-400 text-center py-4">お気に入りはまだありません。</p>';
                    return;
                }
                stockItems.forEach((comment, index) => els.stockContainer.appendChild(createCommentElement(comment, true, index)));
            }

            function createCommentElement(text, isStock, index = -1) {
                const div = document.createElement('div');
                div.className = "bg-white border border-gray-100 rounded-lg p-3 shadow-sm flex flex-col gap-2 relative group";
                
                const textP = document.createElement('p');
                textP.className = "text-sm text-gray-800 break-all select-all font-medium";
                textP.textContent = text;
                div.appendChild(textP);

                const actionsDiv = document.createElement('div');
                actionsDiv.className = "flex justify-end gap-2 mt-1";

                const previewBtn = document.createElement('button');
                previewBtn.className = "action-btn preview-btn text-xs bg-gray-100 hover:bg-gray-200 text-gray-600 py-1.5 px-3 rounded transition flex-1 sm:flex-none text-center font-bold";
                previewBtn.dataset.text = text;
                previewBtn.textContent = "👁️ 配信に流す";
                actionsDiv.appendChild(previewBtn);

                if (isStock) {
                    const deleteBtn = document.createElement('button');
                    deleteBtn.className = "action-btn delete-btn text-xs bg-red-50 hover:bg-red-100 text-red-500 py-1.5 px-3 rounded transition font-bold";
                    deleteBtn.dataset.index = index;
                    deleteBtn.textContent = "🗑️ 削除";
                    actionsDiv.appendChild(deleteBtn);
                } else {
                    const stockBtn = document.createElement('button');
                    stockBtn.className = "action-btn stock-btn text-xs bg-yellow-50 hover:bg-yellow-100 text-yellow-600 py-1.5 px-3 rounded transition font-bold";
                    stockBtn.dataset.text = text;
                    stockBtn.textContent = "⭐ ストック";
                    actionsDiv.appendChild(stockBtn);
                }

                const copyBtn = document.createElement('button');
                copyBtn.className = "action-btn copy-btn text-xs bg-pink-100 hover:bg-pink-200 text-pink-700 py-1.5 px-4 rounded font-bold transition";
                copyBtn.dataset.text = text;
                copyBtn.textContent = "📋 コピペする！";
                actionsDiv.appendChild(copyBtn);

                div.appendChild(actionsDiv);
                return div;
            }
            
            async function copyToClipboard(text) {
                if (navigator.clipboard && navigator.clipboard.writeText) {
                    try {
                        await navigator.clipboard.writeText(text);
                        return true;
                    } catch (err) {}
                }

                try {
                    const textArea = document.createElement("textarea");
                    textArea.value = text;
                    textArea.style.position = "fixed";
                    textArea.style.top = "0";
                    textArea.style.left = "0";
                    textArea.style.width = "2em";
                    textArea.style.height = "2em";
                    textArea.style.padding = "0";
                    textArea.style.border = "none";
                    textArea.style.outline = "none";
                    textArea.style.boxShadow = "none";
                    textArea.style.background = "transparent";
                    document.body.appendChild(textArea);
                    textArea.focus();
                    textArea.select();

                    const successful = document.execCommand('copy');
                    document.body.removeChild(textArea);
                    if (successful) return true;
                } catch (err) {}

                return false;
            }

            async function handleListAction(e) {
                const btn = e.target.closest('.action-btn');
                if (!btn) return;

                const text = btn.dataset.text;

                if (btn.classList.contains('copy-btn')) {
                    const success = await copyToClipboard(text);
                    if (success) {
                        showToast('コピーしました！');
                        const originalText = btn.textContent;
                        btn.textContent = "✅ コピー完了";
                        btn.classList.replace('bg-pink-100', 'bg-green-100');
                        btn.classList.replace('text-pink-700', 'text-green-700');
                        setTimeout(() => {
                            btn.textContent = originalText;
                            btn.classList.replace('bg-green-100', 'bg-pink-100');
                            btn.classList.replace('text-green-700', 'text-pink-700');
                        }, 2000);
                    } else {
                        showToast('コピーに失敗しました');
                    }
                }

                if (btn.classList.contains('stock-btn')) {
                    if (!stockItems.includes(text)) {
                        stockItems.push(text);
                        localStorage.setItem('kirakome_stock', JSON.stringify(stockItems));
                        showToast('⭐ お気に入りに追加しました');
                        renderStock();
                    } else {
                        showToast('すでにストックされています');
                    }
                }

                if (btn.classList.contains('delete-btn')) {
                    const idx = parseInt(btn.dataset.index, 10);
                    stockItems.splice(idx, 1);
                    localStorage.setItem('kirakome_stock', JSON.stringify(stockItems));
                    renderStock();
                    showToast('削除しました');
                }

                if (btn.classList.contains('preview-btn')) {
                    addChatComment(text, "リスナーA");
                }
            }

            function addChatComment(text, userName = "視聴者") {
                const placeholder = els.previewChatContainer.querySelector('.text-center');
                if (placeholder) placeholder.remove();

                const chatRow = document.createElement('div');
                chatRow.className = "flex items-start gap-2 bg-black bg-opacity-30 rounded-lg p-2 animate-fadeIn";

                const avatar = document.createElement('div');
                avatar.className = "w-6 h-6 rounded-full bg-pink-500 flex items-center justify-center text-white text-[10px] font-bold shrink-0 mt-0.5";
                avatar.textContent = userName.charAt(0);

                const contentDiv = document.createElement('div');
                contentDiv.className = "min-w-0 flex-1";

                const nameP = document.createElement('div');
                nameP.className = "text-[10px] text-gray-400 font-bold";
                nameP.textContent = userName;

                const textP = document.createElement('div');
                textP.className = "text-white text-xs break-words font-medium select-all";
                textP.textContent = text;

                contentDiv.appendChild(nameP);
                contentDiv.appendChild(textP);
                chatRow.appendChild(avatar);
                chatRow.appendChild(contentDiv);

                els.previewChatContainer.appendChild(chatRow);
                els.previewChatContainer.scrollTop = els.previewChatContainer.scrollHeight;

                if (els.previewChatContainer.children.length > 30) {
                    els.previewChatContainer.firstElementChild.remove();
                }
            }

            function toggleAutoChat() {
                if (autoChatTimer) {
                    clearInterval(autoChatTimer);
                    autoChatTimer = null;
                    els.toggleAutoChatBtn.textContent = "▶️ 自動コメント流し";
                    els.toggleAutoChatBtn.className = "bg-pink-600 hover:bg-pink-500 text-white px-2 py-0.5 rounded text-[10px] font-bold transition";
                    showToast("自動コメントを停止しました");
                } else {
                    const sampleComments = [
                        "✨✨ 歌声すてきすぎるよ〜！ ✨✨",
                        "💖 ᕱ⑅ᕱ 初見でおじゃまします ᕱ⑅ᕱ 💖",
                        "🌟.｡.:*･ﾟ めっちゃ可愛い歌声… ﾟ･*:.｡.🌟",
                        "🎉( ﾉ*>∀<)ﾉ 盛り上がってきたぁぁ 🎉",
                        "🎀𓂃 𓈒𓏸 ずっと聴いていたい癒やし 𓂃 𓈒𓏸🎀"
                    ];
                    const names = ["ゆきりん", "たろう", "みみ", "配信ハイパーファン", "ねこすけ"];
                    
                    els.toggleAutoChatBtn.textContent = "⏹️ 停止する";
                    els.toggleAutoChatBtn.className = "bg-red-600 hover:bg-red-500 text-white px-2 py-0.5 rounded text-[10px] font-bold transition";
                    showToast("自動コメント配信テストを開始しました！");

                    autoChatTimer = setInterval(() => {
                        addChatComment(sampleComments[Math.floor(Math.random() * sampleComments.length)], names[Math.floor(Math.random() * names.length)]);
                    }, 1800);
                }
            }

            function showToast(message) {
                els.toast.textContent = message;
                els.toast.classList.remove('opacity-0');
                els.toast.classList.add('opacity-100');
                
                if (window.toastTimer) clearTimeout(window.toastTimer);
                window.toastTimer = setTimeout(() => {
                    els.toast.classList.remove('opacity-100');
                    els.toast.classList.add('opacity-0');
                }, 2500);
            }
        });
    </script>
</body>
</html>

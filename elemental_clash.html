<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Elemental Clash - Streamer Card Game</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* 基本設定 */
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; touch-action: manipulation; }
        
        /* 画面全体のシェイク（着弾時） */
        @keyframes earthQuake {
            0% { transform: translate(0, 0); }
            10% { transform: translate(-10px, -10px); }
            20% { transform: translate(10px, -10px); }
            30% { transform: translate(-10px, 10px); }
            40% { transform: translate(10px, 10px); }
            50% { transform: translate(-5px, -5px); }
            60% { transform: translate(5px, -5px); }
            70% { transform: translate(-5px, 5px); }
            80% { transform: translate(5px, 5px); }
            90% { transform: translate(-2px, -2px); }
            100% { transform: translate(0, 0); }
        }
        .earthquake { animation: earthQuake 0.5s ease-out; }

        /* 画面フラッシュ（攻撃発動時） */
        @keyframes flash {
            0% { background-color: rgba(255, 255, 255, 0); }
            10% { background-color: rgba(255, 255, 255, 0.8); }
            100% { background-color: rgba(255, 255, 255, 0); }
        }
        .flash-bang { position: fixed; inset: 0; pointer-events: none; z-index: 9999; animation: flash 0.4s ease-out forwards; }

        /* 3Dカードフリップ */
        .card-container {
            perspective: 1000px;
            width: 50px;
            height: 70px;
        }
        .card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            text-align: center;
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            transform-style: preserve-3d;
        }
        .card-inner.is-flipped { transform: rotateY(180deg); }
        .card-front, .card-back {
            position: absolute;
            width: 100%; height: 100%;
            -webkit-backface-visibility: hidden; backface-visibility: hidden;
            border-radius: 0.3rem; box-shadow: 0 4px 8px rgba(0,0,0,0.5);
            display: flex; flex-direction: column; justify-content: center; align-items: center;
        }
        .card-back { background: linear-gradient(135deg, #1f2937, #111827); border: 1px solid #4b5563; }
        .card-front { transform: rotateY(180deg); background: #ffffff; color: #000; }
        .card-front .icon { font-size: 1.2rem; margin-bottom: 2px; }
        .card-front .power-val { font-size: 1.5rem; font-weight: 900; line-height: 1; }
        
        /* 手札用カード */
        .hand-card {
            position: relative;
            width: 54px; height: 76px;
            background: white; border-radius: 0.3rem;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            cursor: pointer; transition: all 0.2s; box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .hand-card.selected { transform: translateY(-8px); box-shadow: 0 0 20px rgba(255, 255, 255, 0.6); }

        /* 属性別スタイル */
        .element-FIRE { border: 3px solid #ef4444; }
        .element-THUNDER { border: 3px solid #eab308; }
        .element-WATER { border: 3px solid #3b82f6; }

        /* 発光アニメーション(カード枠用) */
        @keyframes glowBuff {
            0% { box-shadow: 0 0 5px currentColor; }
            50% { box-shadow: 0 0 25px 10px currentColor; transform: scale(1.1); }
            100% { box-shadow: 0 0 5px currentColor; transform: scale(1); }
        }
        .glow-buff { animation: glowBuff 0.8s ease-in-out; }

        /* ダメージ揺れ */
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-5px) rotate(-5deg); }
            40%, 80% { transform: translateX(5px) rotate(5deg); }
        }
        .shake { animation: shake 0.4s; border-color: red !important; }

        /* 全体レイアウト */
        .app-container { height: 100dvh; display: flex; flex-direction: column; overflow: hidden; background-color: #111827; }
    </style>
</head>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, onSnapshot, getDoc, updateDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        let firebaseConfig = {
            apiKey: "AIzaSyB0WCtYTz2ychi5K7WaE1iXjN65VpLwWac",
            authDomain: "voice-chat-streamer.firebaseapp.com",
            projectId: "voice-chat-streamer",
            storageBucket: "voice-chat-streamer.firebasestorage.app",
            messagingSenderId: "403894004803",
            appId: "1:403894004803:web:c75b2d63b57f5f4ab978f6"
        };
        const appIdStr = typeof __app_id !== 'undefined' ? __app_id : 'streamer-card-game';
        if (typeof __firebase_config !== 'undefined' && __firebase_config) {
            try { firebaseConfig = JSON.parse(__firebase_config); } catch (e) {}
        }
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // バグ回避のため、コレクション名を変更して過去データを無視
        const ROOM_COLLECTION = 'rooms_v4';

        let currentUser = null;
        let isHost = false;
        let currentRoomId = null;
        let isAnimating = false;
        let myHand = [];
        let selectedIndices = []; 
        const MAX_HP = 50; 
        let myPlayerInfo = { name: '', iconData: null };

        const ELEMENTS = [
            { id: 'FIRE', icon: '🔥', color: '#ef4444', shadow: '#f97316' },
            { id: 'THUNDER', icon: '⚡', color: '#eab308', shadow: '#fef08a' },
            { id: 'WATER', icon: '💧', color: '#3b82f6', shadow: '#60a5fa' }
        ];

        const ui = {
            mainContainer: document.getElementById('main-container'),
            battleArea: document.getElementById('battle-area'),
            btnGreenback: document.getElementById('btn-greenback'),
            lobbyUi: document.getElementById('lobby-ui'),
            battleField: document.getElementById('battle-field'),
            handUi: document.getElementById('hand-ui'),
            waitingOverlay: document.getElementById('waiting-overlay'),
            btnCreate: document.getElementById('btn-create'),
            btnJoin: document.getElementById('btn-join'),
            inputId: document.getElementById('input-room'),
            inputName: document.getElementById('input-name'),
            inputIcon: document.getElementById('input-icon'),
            iconPreviewImg: document.getElementById('icon-preview-img'),
            iconPreviewText: document.getElementById('icon-preview-text'),
            roomDisplay: document.getElementById('room-display'),
            roomIdText: document.getElementById('room-id-text'),
            handCards: document.getElementById('hand-cards'),
            btnConfirm: document.getElementById('btn-confirm'),
            btnRestart: document.getElementById('btn-restart'),
            waitRestartText: document.getElementById('wait-restart-text'),
            p1Slots: [document.getElementById('p1-slot-0'), document.getElementById('p1-slot-1'), document.getElementById('p1-slot-2')],
            p2Slots: [document.getElementById('p2-slot-0'), document.getElementById('p2-slot-1'), document.getElementById('p2-slot-2')],
            p1HpBar: document.getElementById('p1-hp-bar'),
            p2HpBar: document.getElementById('p2-hp-bar'),
            p1HpBox: document.getElementById('p1-hp-box'),
            p2HpBox: document.getElementById('p2-hp-box'),
            p1Total: document.getElementById('p1-total'),
            p2Total: document.getElementById('p2-total'),
            p1Name: document.getElementById('p1-name'),
            p2Name: document.getElementById('p2-name'),
            resultMessage: document.getElementById('result-message')
        };

        // --------------------------------------------------------
        // 超強化版 Canvas エフェクトシステム
        // --------------------------------------------------------
        const canvas = document.getElementById('effect-canvas');
        const ctx = canvas.getContext('2d');
        let activeEffects = [];

        function resizeCanvas() { canvas.width = canvas.clientWidth; canvas.height = canvas.clientHeight; }
        window.addEventListener('resize', resizeCanvas); resizeCanvas();

        function animateEffects(time) {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            for(let i = activeEffects.length - 1; i >= 0; i--) {
                const effect = activeEffects[i];
                effect.update(time); effect.draw(ctx);
                if(effect.isDead) activeEffects.splice(i, 1);
            }
            requestAnimationFrame(animateEffects);
        }
        requestAnimationFrame(animateEffects);

        class PopUpText {
            constructor(x, y, text, color, scaleBase = 1) {
                this.x = x; this.y = y; this.text = text; this.color = color;
                this.startTime = performance.now(); this.duration = 1500;
                this.isDead = false; this.progress = 0; this.scaleBase = scaleBase;
            }
            update(time) { this.progress = (time - this.startTime) / this.duration; if(this.progress >= 1) this.isDead = true; }
            draw(ctx) {
                let alpha = 1, dy = 0, scale = 1;
                if (this.progress < 0.2) {
                    let t = this.progress / 0.2; alpha = t; dy = -30 * t; scale = 0.5 + 1.0 * t;
                } else if (this.progress < 0.8) {
                    let t = (this.progress - 0.2) / 0.6; dy = -30 - 15 * t; scale = 1.5 - 0.5 * t;
                } else {
                    let t = (this.progress - 0.8) / 0.2; alpha = 1 - t; dy = -45 - 15 * t; scale = 1;
                }
                scale *= this.scaleBase;
                ctx.save();
                ctx.globalAlpha = alpha; ctx.translate(this.x, this.y + dy); ctx.scale(scale, scale);
                ctx.font = "900 40px 'Segoe UI', sans-serif"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
                ctx.lineWidth = 6; ctx.strokeStyle = '#000'; ctx.strokeText(this.text, 0, 0);
                ctx.shadowColor = this.color; ctx.shadowBlur = 25; ctx.fillStyle = this.color; ctx.fillText(this.text, 0, 0);
                ctx.restore();
            }
        }

        // 巨大な火と水の弾
        class Projectile {
            constructor(sx, sy, ex, ey, elData, diff, onComplete) {
                this.sx = sx; this.sy = sy; this.ex = ex; this.ey = ey;
                this.elData = elData; this.onComplete = onComplete;
                this.duration = 500; this.startTime = performance.now();
                this.size = 50; // 巨大化
                this.isDead = false; this.angle = Math.atan2(ey - sy, ex - sx);
            }
            update(time) {
                let p = (time - this.startTime) / this.duration; p = p * p; // 徐々に加速
                if(p >= 1) { p = 1; this.isDead = true; this.onComplete(); }
                this.x = this.sx + (this.ex - this.sx) * p; this.y = this.sy + (this.ey - this.sy) * p;
            }
            draw(ctx) {
                ctx.save(); ctx.translate(this.x, this.y);
                if (this.elData.id === 'FIRE') {
                    ctx.shadowColor = this.elData.shadow; ctx.shadowBlur = 50;
                    ctx.fillStyle = this.elData.color; ctx.beginPath(); ctx.arc(0, 0, this.size, 0, Math.PI*2); ctx.fill();
                    ctx.fillStyle = '#fef08a'; ctx.beginPath(); ctx.arc(0, 0, this.size*0.6, 0, Math.PI*2); ctx.fill();
                    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(0, 0, this.size*0.3, 0, Math.PI*2); ctx.fill();
                } else if (this.elData.id === 'WATER') {
                    ctx.rotate(this.angle);
                    ctx.shadowColor = this.elData.shadow; ctx.shadowBlur = 40;
                    ctx.fillStyle = this.elData.color; ctx.beginPath();
                    ctx.arc(0, 0, this.size*0.8, Math.PI/2, Math.PI*1.5); ctx.lineTo(this.size*1.5, 0);
                    ctx.closePath(); ctx.fill();
                }
                ctx.restore();
            }
        }

        // 巨大な稲妻（一瞬で描画）
        class LightningStrike {
            constructor(sx, sy, ex, ey, onComplete) {
                this.onComplete = onComplete;
                this.startTime = performance.now(); this.duration = 400; this.isDead = false;
                this.path = [{x: sx, y: sy}];
                const segs = 15;
                for(let i=1; i<segs; i++) {
                    this.path.push({
                        x: sx + (ex-sx)*(i/segs) + (Math.random()-0.5)*80,
                        y: sy + (ey-sy)*(i/segs) + (Math.random()-0.5)*80
                    });
                }
                this.path.push({x: ex, y: ey});
            }
            update(time) { if (time - this.startTime > this.duration) { this.isDead = true; this.onComplete(); } }
            draw(ctx) {
                const alpha = 1 - ((performance.now() - this.startTime) / this.duration);
                ctx.save(); ctx.globalAlpha = alpha;
                ctx.beginPath(); ctx.moveTo(this.path[0].x, this.path[0].y);
                for(let i=1; i<this.path.length; i++) ctx.lineTo(this.path[i].x, this.path[i].y);
                
                ctx.strokeStyle = '#fff'; ctx.lineWidth = 10; ctx.lineJoin = 'miter';
                ctx.shadowColor = '#eab308'; ctx.shadowBlur = 40; ctx.stroke();
                ctx.strokeStyle = '#fef08a'; ctx.lineWidth = 20; ctx.shadowBlur = 60; ctx.stroke();
                ctx.restore();
            }
        }

        class Particle {
            constructor(x, y, elData) {
                this.sx = x; this.sy = y; this.elData = elData;
                const dist = 60 + Math.random()*80; // 大量に拡散
                const angle = Math.random() * Math.PI * 2;
                this.size = 10 + Math.random()*15; // でかく
                
                if (elData.id === 'FIRE') {
                    this.vx = Math.cos(angle) * dist * 0.8; this.vy = -Math.abs(Math.sin(angle) * dist) - 30; // 上へ
                    this.duration = 500 + Math.random()*300;
                } else if (elData.id === 'WATER') {
                    this.vx = Math.cos(angle) * dist * 0.8; this.vy = Math.abs(Math.sin(angle) * dist) + 30; // 下へ
                    this.duration = 500 + Math.random()*300;
                } else {
                    this.vx = Math.cos(angle) * dist * 1.5; this.vy = Math.sin(angle) * dist * 1.5; // 四方八方
                    this.duration = 300 + Math.random()*200;
                }
                this.startTime = performance.now(); this.isDead = false;
                this.rot = Math.random() * Math.PI * 2; this.rotSpeed = (Math.random() - 0.5) * 15;
            }
            update(time) {
                let p = (time - this.startTime) / this.duration;
                let pEase = this.elData.id === 'THUNDER' ? p : 1 - (1 - p) * (1 - p);
                if(p >= 1) { this.isDead = true; pEase = 1; }
                this.x = this.sx + this.vx * pEase; this.y = this.sy + this.vy * pEase;
                this.alpha = 1 - p; this.scale = 1 - pEase;
            }
            draw(ctx) {
                ctx.save();
                ctx.globalAlpha = this.alpha; ctx.translate(this.x, this.y); ctx.scale(this.scale, this.scale);
                ctx.shadowColor = this.elData.shadow; ctx.shadowBlur = 20; ctx.fillStyle = this.elData.color;
                
                if(this.elData.id === 'THUNDER') {
                    ctx.rotate(this.rot + this.rotSpeed * (1-this.alpha));
                    ctx.fillRect(-this.size, -this.size/4, this.size*2, this.size/2);
                } else {
                    ctx.beginPath(); ctx.arc(0,0,this.size/2,0,Math.PI*2); ctx.fill();
                }
                ctx.restore();
            }
        }

        // --------------------------------------------------------
        // Firebase 認証・ルームロジック
        // --------------------------------------------------------
        async function initAuth() {
            try { 
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else { await signInAnonymously(auth); }
            } catch (e) { console.error("Auth failed:", e); }
        }
        onAuthStateChanged(auth, (user) => { if (user) currentUser = user; });

        const sleep = ms => new Promise(r => setTimeout(r, ms));
        const generateRoomId = () => Math.floor(1000 + Math.random() * 9000).toString();
        const getRandomCard = () => {
            const el = ELEMENTS[Math.floor(Math.random() * ELEMENTS.length)];
            return { element: el.id, power: Math.floor(Math.random() * 9) + 1 };
        };

        function resizeImage(file) {
            return new Promise(resolve => {
                const reader = new FileReader();
                reader.onload = e => {
                    const img = new Image();
                    img.onload = () => {
                        const c = document.createElement('canvas');
                        let w = img.width, h = img.height;
                        if(w>h) { if(w>100) { h*=100/w; w=100; } } else { if(h>100) { w*=100/h; h=100; } }
                        c.width = w; c.height = h;
                        c.getContext('2d').drawImage(img, 0, 0, w, h);
                        resolve(c.toDataURL('image/jpeg', 0.7));
                    };
                    img.src = e.target.result;
                };
                reader.readAsDataURL(file);
            });
        }

        ui.inputIcon.addEventListener('change', async e => {
            if (e.target.files[0]) {
                myPlayerInfo.iconData = await resizeImage(e.target.files[0]);
                ui.iconPreviewImg.src = myPlayerInfo.iconData;
                ui.iconPreviewImg.classList.remove('hidden'); ui.iconPreviewText.classList.add('hidden');
            }
        });
        ui.inputName.addEventListener('input', e => {
            if(!myPlayerInfo.iconData) {
                const n = e.target.value.trim();
                ui.iconPreviewText.textContent = n ? n.charAt(0).toUpperCase() : '?';
            }
        });

        ui.btnGreenback.addEventListener('click', () => {
            // 緑の同化を防ぐため、OBS用背景色をマゼンタ(#FF00FF)に変更
            if (ui.battleArea.classList.contains('bg-gray-800')) {
                ui.battleArea.classList.replace('bg-gray-800', 'bg-[#FF00FF]');
            } else {
                ui.battleArea.classList.replace('bg-[#FF00FF]', 'bg-gray-800');
            }
        });

        function showWaiting(show) {
            if (show) ui.waitingOverlay.classList.remove('hidden');
            else ui.waitingOverlay.classList.add('hidden');
        }

        function switchView(view) {
            ui.lobbyUi.classList.add('hidden');
            ui.battleField.classList.add('hidden');
            ui.handUi.classList.add('hidden');
            
            if(view === 'lobby') { ui.lobbyUi.classList.remove('hidden'); showWaiting(false); }
            else if (view === 'hand') { ui.battleField.classList.remove('hidden'); ui.handUi.classList.remove('hidden'); showWaiting(false); }
        }

        function preparePlayerInfo() { myPlayerInfo.name = ui.inputName.value.trim() || "PLAYER"; }

        function updateProfile(pNum, info) {
            const nameEl = pNum === 1 ? ui.p1Name : ui.p2Name;
            const container = document.getElementById(`p${pNum}-icon`);
            if (info) {
                nameEl.textContent = info.name;
                container.innerHTML = info.iconData 
                    ? `<img src="${info.iconData}" class="w-full h-full object-cover">`
                    : `<span class="text-[10px] font-bold text-white">${info.name.charAt(0).toUpperCase()}</span>`;
            }
        }

        function resetFieldUI() {
            ui.p1Total.textContent = "0"; ui.p2Total.textContent = "0";
            for(let i=0; i<3; i++) { ui.p1Slots[i].innerHTML = ''; ui.p2Slots[i].innerHTML = ''; }
        }

        ui.btnCreate.addEventListener('click', async () => {
            if(!currentUser) return;
            preparePlayerInfo();
            const roomId = generateRoomId();
            isHost = true; currentRoomId = roomId;
            ui.roomIdText.textContent = roomId;
            ui.roomDisplay.classList.remove('hidden');

            const ref = doc(db, 'artifacts', appIdStr, 'public', 'data', ROOM_COLLECTION, roomId);
            await setDoc(ref, { hostId: currentUser.uid, guestId: null, p1Info: myPlayerInfo, p2Info: null, p1Hp: MAX_HP, p2Hp: MAX_HP, p1Cards: null, p2Cards: null, phase: 'waiting' });
            
            document.getElementById('p1-status').textContent = "YOU"; document.getElementById('p2-status').textContent = "OPPONENT";
            document.getElementById('p1-status').classList.remove('opacity-0'); document.getElementById('p2-status').classList.remove('opacity-0');

            startRoomListener(roomId);
            drawInitialHand();
            switchView('hand'); // 背景の枠を見せるためにhandにする
            showWaiting(true); // 待機オーバーレイを出す
        });

        ui.btnJoin.addEventListener('click', async () => {
            if(!currentUser) return;
            const roomId = ui.inputId.value.trim();
            if(!roomId) return;
            preparePlayerInfo();

            const ref = doc(db, 'artifacts', appIdStr, 'public', 'data', ROOM_COLLECTION, roomId);
            const snap = await getDoc(ref);
            
            if(snap.exists() && !snap.data().guestId) {
                isHost = false; currentRoomId = roomId;
                ui.roomIdText.textContent = roomId;
                ui.roomDisplay.classList.remove('hidden');
                
                document.getElementById('p1-status').textContent = "OPPONENT"; document.getElementById('p2-status').textContent = "YOU";
                document.getElementById('p1-status').classList.remove('opacity-0'); document.getElementById('p2-status').classList.remove('opacity-0');

                await updateDoc(ref, { guestId: currentUser.uid, p2Info: myPlayerInfo });
                startRoomListener(roomId);
                drawInitialHand();
                switchView('hand');
            } else alert("ルームが見つからないか満員です");
        });

        // --------------------------------------------------------
        // 同期ロジックの強化 (永遠に終わらないバグ修正)
        // --------------------------------------------------------
        function startRoomListener(roomId) {
            const ref = doc(db, 'artifacts', appIdStr, 'public', 'data', ROOM_COLLECTION, roomId);
            onSnapshot(ref, async snap => {
                const data = snap.data();
                if(!data) return;

                if(data.p1Info) updateProfile(1, data.p1Info);
                if(data.p2Info) updateProfile(2, data.p2Info);

                // ゲスト参加時、ホストの待機を解除
                if(isHost && data.guestId && data.phase === 'waiting' && !isAnimating && ui.resultMessage.classList.contains('hidden')) {
                    showWaiting(false);
                }

                if(!isAnimating) {
                    updateHpUI(data.p1Hp, data.p2Hp);
                    
                    // 【重要】phaseがwaitingになり、かつリザルト画面が出ている場合 = 再戦の開始
                    if (data.phase === 'waiting' && !ui.resultMessage.classList.contains('hidden')) {
                        ui.resultMessage.classList.add('hidden', 'opacity-0');
                        ui.btnRestart.classList.add('hidden');
                        ui.waitRestartText.classList.add('hidden');
                        resetFieldUI();
                        drawInitialHand(); // 両者引き直し
                        switchView('hand'); // 手札へ
                        return; // 以降の処理をスキップ
                    }

                    // 相手のセット状況を裏向きで反映
                    if (data.p1Cards) {
                        for(let i=0; i<3; i++) if(!ui.p1Slots[i].innerHTML.includes('card-inner')) ui.p1Slots[i].innerHTML = createHiddenCard(i+1);
                    }
                    if (data.p2Cards) {
                        for(let i=0; i<3; i++) if(!ui.p2Slots[i].innerHTML.includes('card-inner')) ui.p2Slots[i].innerHTML = createHiddenCard(i+1);
                    }
                }

                // 両者3枚セット完了でバトル開始
                if(data.p1Cards && data.p2Cards && data.phase === 'action' && !isAnimating) {
                    isAnimating = true;
                    showWaiting(false);
                    await runBattle(data.p1Cards, data.p2Cards, data.p1Hp, data.p2Hp);
                    isAnimating = false;
                    
                    if(data.p1Hp <= 0 || data.p2Hp <= 0) {
                        // 決着がついたのでリザルト表示を強制
                        if (isHost) await updateDoc(ref, { phase: 'result' });
                        return;
                    }

                    // 決着つかず、次のターンへ
                    if(isHost) await updateDoc(ref, { p1Cards: null, p2Cards: null, phase: 'waiting' });
                    resetFieldUI();
                    drawInitialHand();
                    switchView('hand');
                }

                // 決着フェーズ（ここで両者画面にリザルトを出す）
                if(data.phase === 'result' && !isAnimating) {
                    if (ui.resultMessage.classList.contains('hidden')) {
                        showResult(data.p1Hp, data.p2Hp);
                    }
                }
            });
        }

        // --- 手札（5枚から3枚選択） ---
        function drawInitialHand() { 
            myHand = [getRandomCard(), getRandomCard(), getRandomCard(), getRandomCard(), getRandomCard()]; 
            selectedIndices = [];
            renderHand(); 
        }

        function renderHand() {
            ui.handCards.innerHTML = '';
            myHand.forEach((card, i) => {
                const el = ELEMENTS.find(e => e.id === card.element);
                const div = document.createElement('div');
                div.className = `hand-card element-${card.element}`;
                
                const orderIdx = selectedIndices.indexOf(i);
                if (orderIdx !== -1) {
                    div.classList.add('selected');
                    // 選択バッジを目立たせる
                    div.innerHTML = `<div class="absolute -top-3 -right-3 bg-red-600 text-white font-black rounded-full w-6 h-6 flex items-center justify-center text-xs shadow-lg border-2 border-white z-10">${orderIdx + 1}</div>`;
                }

                div.innerHTML += `<div class="text-2xl mb-0">${el.icon}</div><div class="text-3xl font-black text-gray-800 leading-none">${card.power}</div>`;
                
                div.onclick = () => {
                    if (orderIdx !== -1) {
                        selectedIndices.splice(orderIdx, 1);
                    } else {
                        if (selectedIndices.length < 3) selectedIndices.push(i);
                    }
                    renderHand(); updateBtn();
                };
                ui.handCards.appendChild(div);
            });
        }

        function updateBtn() {
            if(selectedIndices.length === 3) {
                ui.btnConfirm.disabled = false;
                ui.btnConfirm.className = "w-full max-w-sm bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 rounded-lg shadow-[0_0_15px_rgba(59,130,246,0.8)] cursor-pointer text-sm tracking-widest border border-blue-400";
                ui.btnConfirm.textContent = "CONFIRM 3 CARDS";
            } else {
                ui.btnConfirm.disabled = true;
                ui.btnConfirm.className = "w-full max-w-sm bg-gray-800 text-gray-500 font-bold py-3 rounded-lg shadow-inner cursor-not-allowed transition-all duration-200 text-sm border border-gray-700 tracking-widest";
                ui.btnConfirm.textContent = `SELECT CARDS (${selectedIndices.length}/3)`;
            }
        }

        ui.btnConfirm.addEventListener('click', async () => {
            if(selectedIndices.length !== 3 || isAnimating) return;
            
            const selectedCards = selectedIndices.map(idx => myHand[idx]);
            
            const mySlots = isHost ? ui.p1Slots : ui.p2Slots;
            for(let i=0; i<3; i++) mySlots[i].innerHTML = createHiddenCard(i+1);

            showWaiting(true); // セット完了で待機画面
            ui.btnConfirm.textContent = "SET COMPLETED";
            
            const ref = doc(db, 'artifacts', appIdStr, 'public', 'data', ROOM_COLLECTION, currentRoomId);
            await updateDoc(ref, isHost ? { p1Cards: selectedCards } : { p2Cards: selectedCards });
            const snap = await getDoc(ref);
            if(snap.data().p1Cards && snap.data().p2Cards) await updateDoc(ref, { phase: 'action' });
        });

        // --- 再戦処理 (バグ修正済) ---
        ui.btnRestart.addEventListener('click', async () => {
            if (!isHost) return;
            // ボタンを消して連打防止
            ui.btnRestart.classList.add('hidden');
            
            const ref = doc(db, 'artifacts', appIdStr, 'public', 'data', ROOM_COLLECTION, currentRoomId);
            // phaseをwaitingに戻すことで、Snapshot側で全員の画面が初期化される
            await updateDoc(ref, { p1Hp: MAX_HP, p2Hp: MAX_HP, p1Cards: null, p2Cards: null, phase: 'waiting' });
        });

        function createHiddenCard(num) {
            return `<div class="card-inner"><div class="card-back flex items-center justify-center"><div class="text-gray-500 font-black text-xs opacity-50 tracking-widest rotate-[-45deg]">#${num}</div></div></div>`;
        }
        function createCard(c) {
            const el = ELEMENTS.find(e => e.id === c.element);
            return `<div class="card-inner"><div class="card-back flex items-center justify-center"></div><div class="card-front element-${c.element}"><div class="icon">${el.icon}</div><div class="power-val">${c.power}</div></div></div>`;
        }

        // --- バトルアニメーション (3連オープン -> ド派手攻撃) ---
        async function runBattle(c1Arr, c2Arr, hp1, hp2) {
            let p1Tot = 0, p2Tot = 0;
            ui.p1Total.textContent = "0"; ui.p2Total.textContent = "0";
            
            for(let i=0; i<3; i++) {
                ui.p1Slots[i].innerHTML = createCard(c1Arr[i]);
                ui.p2Slots[i].innerHTML = createCard(c2Arr[i]);
            }
            ui.p1Slots[0].offsetWidth; 
            await sleep(500);

            let max1 = c1Arr[0], max2 = c2Arr[0];

            // 1枚ずつめくる
            for(let i=0; i<3; i++) {
                ui.p1Slots[i].querySelector('.card-inner').classList.add('is-flipped');
                ui.p2Slots[i].querySelector('.card-inner').classList.add('is-flipped');
                await sleep(600);
                
                let adv = (c1Arr[i].element==='FIRE'&&c2Arr[i].element==='THUNDER')||(c1Arr[i].element==='THUNDER'&&c2Arr[i].element==='WATER')||(c1Arr[i].element==='WATER'&&c2Arr[i].element==='FIRE') ? 1 : (c1Arr[i].element===c2Arr[i].element ? 0 : -1);
                let p1 = c1Arr[i].power, p2 = c2Arr[i].power;
                
                if (adv === 1) { p1 += 3; await playBuff(ui.p1Slots[i], p1, c1Arr[i].element); }
                else if (adv === -1) { p2 += 3; await playBuff(ui.p2Slots[i], p2, c2Arr[i].element); }
                
                p1Tot += p1; p2Tot += p2;
                if (p1 > max1.power) max1 = {element: c1Arr[i].element, power: p1};
                if (p2 > max2.power) max2 = {element: c2Arr[i].element, power: p2};
                
                ui.p1Total.textContent = p1Tot; ui.p2Total.textContent = p2Tot;
                ui.p1Total.classList.add('scale-150', 'text-white'); ui.p2Total.classList.add('scale-150', 'text-white');
                setTimeout(() => { ui.p1Total.classList.remove('scale-150', 'text-white'); ui.p2Total.classList.remove('scale-150', 'text-white'); }, 200);

                await sleep(600);
            }
            await sleep(800);

            // 攻撃
            let nhp1 = hp1, nhp2 = hp2;
            if (p1Tot > p2Tot) {
                let diff = p1Tot - p2Tot;
                await playAttack('p1-slot-1', 'p2-slot-1', max1.element, diff);
                nhp2 = Math.max(0, hp2 - diff);
                ui.p2HpBox.classList.add('shake'); setTimeout(() => ui.p2HpBox.classList.remove('shake'), 400);
                popDamage('p2-hp-box', diff);
            } else if (p2Tot > p1Tot) {
                let diff = p2Tot - p1Tot;
                await playAttack('p2-slot-1', 'p1-slot-1', max2.element, diff);
                nhp1 = Math.max(0, hp1 - diff);
                ui.p1HpBox.classList.add('shake'); setTimeout(() => ui.p1HpBox.classList.remove('shake'), 400);
                popDamage('p1-hp-box', diff);
            } else {
                const cRect = canvas.getBoundingClientRect();
                activeEffects.push(new PopUpText(cRect.width/2, cRect.height/2, 'DRAW!', '#6b7280', 2));
            }

            updateHpUI(nhp1, nhp2);
            if (isHost) await updateDoc(doc(db, 'artifacts', appIdStr, 'public', 'data', ROOM_COLLECTION, currentRoomId), { p1Hp: nhp1, p2Hp: nhp2 });
            await sleep(2000);
        }

        async function playBuff(slotEl, pwr, el) {
            const front = slotEl.querySelector('.card-front');
            const elData = ELEMENTS.find(e => e.id === el);
            front.style.color = elData.color; front.classList.add('glow-buff');
            
            const rect = slotEl.getBoundingClientRect(), cRect = canvas.getBoundingClientRect();
            activeEffects.push(new PopUpText(rect.left - cRect.left + rect.width/2, rect.top - cRect.top - 10, '+3', elData.color, 1));
            
            setTimeout(() => {
                slotEl.querySelector('.power-val').textContent = pwr;
                slotEl.querySelector('.power-val').style.color = elData.color;
            }, 400);
            await sleep(800);
        }

        // 画面フラッシュ＆シェイク付き攻撃
        function playAttack(sId, eId, el, diff) {
            return new Promise(resolve => {
                const s = document.getElementById(sId).getBoundingClientRect();
                const e = document.getElementById(eId).getBoundingClientRect();
                const c = canvas.getBoundingClientRect();
                const sx = s.left+s.width/2-c.left, sy = s.top+s.height/2-c.top;
                const ex = e.left+e.width/2-c.left, ey = e.top+e.height/2-c.top;
                const elData = ELEMENTS.find(x => x.id === el);
                
                // 発射時に一瞬フラッシュ
                const flash = document.createElement('div');
                flash.className = 'flash-bang';
                document.body.appendChild(flash);
                setTimeout(() => flash.remove(), 400);

                if (el === 'THUNDER') {
                    // 雷は即着弾
                    activeEffects.push(new LightningStrike(sx, sy, ex, ey, () => {
                        triggerEarthquake();
                        for(let i=0; i<30; i++) activeEffects.push(new Particle(ex, ey, elData));
                        resolve();
                    }));
                } else {
                    // 炎・水は飛んでいく
                    activeEffects.push(new Projectile(sx, sy, ex, ey, elData, diff, () => {
                        triggerEarthquake();
                        for(let i=0; i<40; i++) activeEffects.push(new Particle(ex, ey, elData));
                        resolve();
                    }));
                }
            });
        }

        function triggerEarthquake() {
            document.body.classList.add('earthquake');
            setTimeout(() => document.body.classList.remove('earthquake'), 500);
        }

        function popDamage(boxId, dmg) {
            const e = document.getElementById(boxId).getBoundingClientRect();
            const c = canvas.getBoundingClientRect();
            activeEffects.push(new PopUpText(e.left-c.left+e.width/2, e.top-c.top-30, `-${dmg}`, '#ef4444', 1.8));
        }

        function updateHpUI(hp1, hp2) {
            const p1 = Math.max(0, (hp1 / MAX_HP) * 100), p2 = Math.max(0, (hp2 / MAX_HP) * 100);
            ui.p1HpBar.style.width = `${p1}%`; ui.p2HpBar.style.width = `${p2}%`;
            [ui.p1HpBar, ui.p2HpBar].forEach((b, i) => {
                const pt = i === 0 ? p1 : p2;
                b.className = pt > 50 ? "transition-all duration-500 w-full h-full bg-gradient-to-r from-green-600 to-green-400" :
                             pt > 20 ? "transition-all duration-500 w-full h-full bg-gradient-to-r from-yellow-600 to-yellow-400" :
                                       "transition-all duration-500 w-full h-full bg-gradient-to-r from-red-600 to-red-400 animate-pulse";
            });
        }

        function showResult(hp1, hp2) {
            const msg = document.getElementById('result-message'), m = document.getElementById('result-text-main'), s = document.getElementById('result-text-sub');
            msg.classList.remove('hidden');
            let isWin = isHost ? hp1 > 0 : hp2 > 0;
            
            setTimeout(() => {
                msg.classList.remove('opacity-0');
                if(isWin) { m.textContent = "WIN!"; m.className = "text-7xl font-black text-yellow-400 drop-shadow-[0_0_30px_rgba(250,204,21,1)]"; s.textContent = "完全勝利！"; } 
                else { m.textContent = "LOSE..."; m.className = "text-7xl font-black text-blue-400 drop-shadow-[0_0_30px_rgba(96,165,250,1)]"; s.textContent = "敗北..."; }
                
                if (isHost) {
                    ui.btnRestart.classList.remove('hidden');
                } else {
                    ui.waitRestartText.classList.remove('hidden');
                }
            }, 100);
        }

        initAuth();
    </script>

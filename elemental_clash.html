<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ELEMENTAL CLASH</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Helvetica Neue', Arial, sans-serif; background-color: #0f172a; color: white; user-select: none; -webkit-user-select: none; }
        .card-bg { background: linear-gradient(145deg, #1e293b, #0f172a); border: 1px solid #334155; }
        .ur-glow { box-shadow: 0 0 15px 2px rgba(234, 179, 8, 0.6); border-color: #eab308; }
        .ssr-glow { box-shadow: 0 0 15px 2px rgba(168, 85, 247, 0.6); border-color: #a855f7; }
        .sr-glow { box-shadow: 0 0 15px 2px rgba(59, 130, 246, 0.6); border-color: #3b82f6; }
        .r-glow { box-shadow: 0 0 10px 1px rgba(34, 197, 94, 0.6); border-color: #22c55e; }
        .n-glow { box-shadow: 0 0 5px 1px rgba(156, 163, 175, 0.6); border-color: #9ca3af; }
        .fade-in { animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
        /* スクロールバー非表示 */
        ::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="min-h-screen flex flex-col relative overflow-hidden">

    <!-- ヘッダー -->
    <header class="p-4 flex justify-between items-center bg-slate-900 border-b border-slate-700 z-10">
        <div class="flex flex-col">
            <h1 class="text-2xl font-black bg-clip-text text-transparent bg-gradient-to-r from-orange-500 to-yellow-500 tracking-wider">ELEMENTAL CLASH</h1>
            <span id="header-room-id" class="text-xs text-gray-400 font-mono hidden">ROOM: <span id="display-room-id" class="text-white font-bold"></span></span>
        </div>
        <div class="flex space-x-4 items-center">
            <button onclick="openAiStudio()" class="text-sm font-bold bg-gradient-to-r from-purple-600 to-indigo-600 px-3 py-1.5 rounded-full shadow-lg shadow-purple-900/50 hover:scale-105 transition">
                <i class="fa-solid fa-wand-magic-sparkles mr-1"></i> AI STUDIO
            </button>
            <button onclick="checkAdmin()" class="text-gray-400 hover:text-white transition"><i class="fa-solid fa-gear text-xl"></i></button>
        </div>
    </header>

    <!-- メインコンテンツ領域 -->
    <main class="flex-grow relative flex flex-col items-center justify-center p-4">
        
        <!-- ロビー画面 -->
        <div id="lobby-screen" class="w-full max-w-md flex flex-col items-center space-y-6 fade-in">
            <!-- プレイヤープロフィール -->
            <div class="card-bg w-full rounded-2xl p-4 flex flex-col items-center relative">
                <div class="absolute top-2 right-3 text-xs text-gray-400">覚醒P: <span id="lobby-bp" class="text-yellow-400 font-bold">0</span></div>
                <h2 id="lobby-player-name" class="text-lg font-bold mb-3">Player</h2>
                <div id="lobby-profile-card" class="w-40 h-56 bg-slate-800 rounded-xl border-2 border-slate-600 flex items-center justify-center overflow-hidden relative cursor-pointer" onclick="openAiStudio()">
                    <span class="text-slate-500 text-sm"><i class="fa-solid fa-plus block text-2xl mb-1 text-center"></i>セット未完了</span>
                </div>
                <button onclick="openAiStudio()" class="mt-4 text-xs bg-slate-700 px-3 py-1 rounded-full text-slate-300 hover:bg-slate-600"><i class="fa-solid fa-paintbrush mr-1"></i> AIでカードを作成する</button>
            </div>

            <!-- ルーム操作 -->
            <div class="w-full flex flex-col space-y-4">
                <button onclick="createRoom()" class="w-full py-4 bg-red-600 hover:bg-red-500 text-white font-black text-xl rounded-xl shadow-lg shadow-red-900/50 transition transform hover:scale-[1.02]">
                    CREATE NEW ROOM
                </button>
                <div class="flex space-x-2">
                    <input type="number" id="room-id-input" placeholder="ROOM ID" class="flex-grow bg-slate-800 border border-slate-600 rounded-xl px-4 py-3 text-center text-xl font-mono focus:outline-none focus:border-blue-500">
                    <button onclick="joinRoom()" class="px-6 bg-blue-600 hover:bg-blue-500 text-white font-bold text-lg rounded-xl shadow-lg shadow-blue-900/50 transition">
                        JOIN
                    </button>
                </div>
            </div>
        </div>

        <!-- 待機画面 -->
        <div id="waiting-screen" class="w-full max-w-md hidden flex-col items-center space-y-6 fade-in">
            <div class="text-center">
                <h2 class="text-2xl font-bold text-blue-400 mb-2">対戦相手を待っています...</h2>
                <p class="text-gray-400">ROOM ID を共有してください</p>
                <div class="text-4xl font-mono font-black text-white mt-4 tracking-widest bg-slate-800 py-3 px-6 rounded-xl border border-slate-700" id="wait-room-id">0000</div>
            </div>
            <!-- ルームからの退出 -->
            <button onclick="exitRoom()" class="px-4 py-2 bg-slate-700 rounded-lg text-sm hover:bg-slate-600"><i class="fa-solid fa-right-from-bracket mr-1"></i> 部屋を解散する</button>
        </div>

        <!-- バトル画面 -->
        <div id="battle-screen" class="w-full max-w-lg hidden flex-col h-full fade-in justify-between pb-20">
            <!-- 上部: 相手情報 -->
            <div class="flex justify-between items-start w-full bg-slate-800/80 p-3 rounded-b-2xl border-b border-slate-600">
                <div class="flex items-center space-x-3">
                    <div id="enemy-img" class="w-16 h-16 bg-slate-700 rounded-lg bg-cover bg-center border border-slate-500"></div>
                    <div>
                        <div id="enemy-name" class="font-bold text-sm">Enemy</div>
                        <div class="w-32 h-3 bg-gray-900 rounded-full mt-1 overflow-hidden border border-gray-700">
                            <div id="enemy-hp-bar" class="h-full bg-red-500 transition-all duration-500" style="width: 100%"></div>
                        </div>
                        <div class="text-xs text-right text-gray-300 mt-0.5"><span id="enemy-hp-val">0</span> / <span id="enemy-hp-max">0</span></div>
                    </div>
                </div>
                <!-- 途中退出ボタン -->
                <button onclick="surrender()" class="text-gray-400 hover:text-red-400 text-xs px-2 py-1 bg-slate-900 rounded"><i class="fa-solid fa-flag"></i> 退出</button>
            </div>

            <!-- 中央: バトル演出エリア -->
            <div class="flex-grow flex flex-col justify-center items-center relative my-4">
                <div id="battle-log" class="absolute top-0 w-full text-center text-sm font-bold text-yellow-300 drop-shadow-md h-6"></div>
                
                <div class="flex justify-between w-full px-4 items-center mt-4">
                    <!-- 自分の提出カード -->
                    <div id="my-submit-card" class="w-32 h-48 card-bg rounded-xl flex items-center justify-center transform transition duration-500 scale-95 opacity-50 relative overflow-hidden">
                        <span class="text-xs text-gray-500">WAITING</span>
                    </div>
                    
                    <div class="text-3xl font-black text-red-500 italic px-2 drop-shadow-[0_0_10px_rgba(239,68,68,0.8)]">VS</div>
                    
                    <!-- 相手の提出カード -->
                    <div id="enemy-submit-card" class="w-32 h-48 card-bg rounded-xl flex items-center justify-center transform transition duration-500 scale-95 opacity-50 relative overflow-hidden">
                        <span class="text-xs text-gray-500">WAITING</span>
                    </div>
                </div>
            </div>

            <!-- 下部: 自分情報と手札 -->
            <div class="w-full flex flex-col space-y-3">
                <div class="flex justify-between items-end px-2">
                    <div class="flex flex-col">
                        <div id="my-name" class="font-bold text-sm">You</div>
                        <div class="w-40 h-4 bg-gray-900 rounded-full mt-1 overflow-hidden border border-gray-700">
                            <div id="my-hp-bar" class="h-full bg-green-500 transition-all duration-500" style="width: 100%"></div>
                        </div>
                        <div class="text-xs text-gray-300 mt-0.5"><span id="my-hp-val">0</span> / <span id="my-hp-max">0</span></div>
                    </div>
                    <div id="turn-display" class="font-black text-xl text-blue-400 bg-blue-900/30 px-3 py-1 rounded-lg border border-blue-800/50">TURN 1</div>
                </div>

                <!-- 手札選択エリア -->
                <div class="bg-slate-800 p-3 rounded-t-2xl border-t border-slate-600 shadow-[0_-10px_20px_rgba(0,0,0,0.5)]">
                    <div class="flex justify-between items-center mb-2">
                        <div class="text-xs text-gray-400 font-bold">SELECT 3 CARDS</div>
                        <!-- プレゼントボタン -->
                        <button onclick="sendGift()" class="text-xs bg-pink-600/20 text-pink-400 border border-pink-600/50 px-2 py-1 rounded hover:bg-pink-600/40 transition">
                            <i class="fa-solid fa-gift mr-1"></i> カードを送る
                        </button>
                    </div>
                    <div class="flex justify-between space-x-2" id="hand-cards-container">
                        <!-- 手札がJSで生成される -->
                    </div>
                </div>
            </div>
        </div>

    </main>

    <!-- AI STUDIO (モーダル) -->
    <div id="ai-studio-modal" class="fixed inset-0 bg-slate-900/95 z-40 hidden flex-col">
        <div class="p-4 border-b border-slate-700 flex justify-between items-center bg-slate-900">
            <h2 id="studio-title" class="font-black text-xl bg-clip-text text-transparent bg-gradient-to-r from-purple-400 to-indigo-400"><i class="fa-solid fa-wand-magic-sparkles mr-2"></i>AI CARD STUDIO</h2>
            <div class="space-x-3">
                <button onclick="openBinder()" class="text-sm bg-slate-700 px-3 py-1 rounded-full hover:bg-slate-600"><i class="fa-solid fa-book mr-1"></i> 図鑑</button>
                <button onclick="closeAiStudio()" class="text-gray-400 hover:text-white"><i class="fa-solid fa-xmark text-xl"></i></button>
            </div>
        </div>
        
        <div class="flex-grow overflow-y-auto p-4 flex flex-col space-y-4">
            <!-- API Key 入力 -->
            <div class="bg-slate-800 p-3 rounded-lg border border-slate-700 text-xs">
                <div class="flex justify-between items-center mb-1">
                    <label class="text-gray-400 font-bold">Google AI Studio API Key</label>
                    <label class="flex items-center space-x-1 cursor-pointer">
                        <input type="checkbox" id="test-mode-toggle" class="form-checkbox h-3 w-3 text-blue-500 bg-slate-900 border-slate-600 rounded">
                        <span class="text-gray-500">テスト</span>
                    </label>
                </div>
                <div class="flex space-x-2">
                    <input type="password" id="api-key-input" placeholder="AIの利用に必要です" class="flex-grow bg-slate-900 border border-slate-600 rounded px-2 py-1 text-white focus:border-purple-500 outline-none">
                    <button onclick="saveApiKey()" class="bg-purple-600 px-3 rounded hover:bg-purple-500 transition">保存</button>
                </div>
            </div>

            <!-- プレビューエリア -->
            <div class="flex justify-center">
                <div id="studio-preview-card" class="w-48 h-64 bg-slate-800 rounded-xl border-2 border-slate-600 flex flex-col items-center justify-center overflow-hidden relative shadow-2xl">
                    <i class="fa-regular fa-image text-4xl text-slate-600 mb-2"></i>
                    <span class="text-slate-500 text-sm">NO IMAGE</span>
                </div>
            </div>

            <!-- 操作パネル -->
            <div class="bg-slate-800 rounded-xl p-4 border border-slate-700 space-y-3">
                <div>
                    <label class="text-xs text-gray-400 font-bold block mb-1">ベース画像 (空欄の場合は図鑑で選択中のカードを使用)</label>
                    <input type="file" id="image-upload" accept="image/*" class="text-xs text-gray-300 w-full file:mr-2 file:py-1 file:px-2 file:rounded-full file:border-0 file:text-xs file:font-semibold file:bg-slate-700 file:text-white hover:file:bg-slate-600">
                </div>
                <div>
                    <label class="text-xs text-gray-400 font-bold block mb-1">追加テーマ / 属性 (生成・進化の要望)</label>
                    <input type="text" id="prompt-input" placeholder="例: 炎の剣士、サイバーパンク風、闇落ち覚醒" class="w-full bg-slate-900 border border-slate-600 rounded-lg px-3 py-2 text-sm text-white focus:border-purple-500 outline-none">
                </div>
                
                <div class="text-center">
                    <button onclick="analyzeImage()" class="w-full py-2 bg-slate-700 hover:bg-slate-600 rounded-lg text-sm font-bold border border-slate-500 mb-2">
                        <i class="fa-solid fa-magnifying-glass mr-1"></i> 画像からステータスを解析抽出
                    </button>
                </div>

                <div class="grid grid-cols-2 gap-2">
                    <button onclick="generateCard('new')" class="py-3 bg-gradient-to-r from-blue-600 to-blue-500 rounded-lg text-sm font-bold shadow-lg shadow-blue-900/50 hover:brightness-110 flex flex-col items-center justify-center">
                        <span>✨ 新規画像生成</span>
                        <span class="text-[10px] text-blue-200 font-normal">(1日10回制限)</span>
                    </button>
                    <button id="btn-awaken" onclick="generateCard('awaken')" class="py-3 bg-gradient-to-r from-purple-600 to-pink-600 rounded-lg text-sm font-bold shadow-lg shadow-purple-900/50 hover:brightness-110 flex flex-col items-center justify-center relative overflow-hidden">
                        <span id="awaken-text">🔥 上位進化生成</span>
                        <span id="awaken-cost" class="text-[10px] text-purple-200 font-normal">コスト: 10 BP</span>
                    </button>
                </div>
                
                <div class="flex space-x-2 pt-2 border-t border-slate-700">
                    <button onclick="saveToBinder()" class="flex-1 py-2 bg-slate-700 hover:bg-slate-600 rounded-lg text-sm"><i class="fa-solid fa-floppy-disk mr-1"></i> 保存</button>
                    <button onclick="setAsProfile()" class="flex-1 py-2 bg-green-600 hover:bg-green-500 font-bold rounded-lg text-sm shadow-lg shadow-green-900/50"><i class="fa-solid fa-check mr-1"></i> プロフ設定</button>
                </div>
            </div>
            
            <div id="studio-loading" class="hidden absolute inset-0 bg-slate-900/80 flex flex-col items-center justify-center z-10 backdrop-blur-sm">
                <i class="fa-solid fa-circle-notch fa-spin text-4xl text-purple-500 mb-4"></i>
                <div class="text-sm font-bold text-purple-200 animate-pulse">AIがカードを具現化中...</div>
                <div class="text-xs text-gray-400 mt-2">※画像生成には10〜20秒かかります</div>
            </div>
        </div>
    </div>

    <!-- バインダー (図鑑) モーダル -->
    <div id="binder-modal" class="fixed inset-0 bg-slate-900/95 z-50 hidden flex-col">
        <div class="p-4 border-b border-slate-700 flex justify-between items-center bg-slate-900">
            <h2 class="font-bold text-lg text-blue-400"><i class="fa-solid fa-book-open mr-2"></i>MY COLLECTION</h2>
            <button onclick="closeBinder()" class="text-gray-400 hover:text-white"><i class="fa-solid fa-xmark text-xl"></i> 戻る</button>
        </div>
        <div class="flex-grow overflow-y-auto p-4">
            <div id="binder-grid" class="grid grid-cols-2 gap-4">
                <!-- カードがここにJSで生成される -->
            </div>
            <div id="binder-empty" class="hidden text-center text-gray-500 mt-10 text-sm">
                カードがありません。<br>AI STUDIOで作成して保存しましょう！
            </div>
        </div>
    </div>

    <!-- カスタム メッセージ ダイアログ -->
    <div id="custom-dialog" class="fixed inset-0 bg-black/80 z-[100] hidden flex items-center justify-center p-4 backdrop-blur-sm">
        <div class="bg-slate-800 border border-slate-600 rounded-2xl p-6 max-w-sm w-full shadow-2xl flex flex-col items-center text-center">
            <div id="dialog-icon" class="text-4xl mb-3 text-blue-400"><i class="fa-solid fa-circle-info"></i></div>
            <h3 id="dialog-title" class="text-lg font-bold mb-2">通知</h3>
            <p id="dialog-msg" class="text-sm text-gray-300 mb-6"></p>
            <div id="dialog-buttons" class="w-full flex space-x-3">
                <!-- JSでボタン注入 -->
            </div>
        </div>
    </div>

    <!-- Firebase SDK & メインロジック -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        // ==========================================
        // ⚠️ 【重要】Firebaseの設定情報 ⚠️
        // ==========================================
        const firebaseConfig = {
            apiKey: "AIzaSyB0WCtYTz2ychi5K7WaE1iXjN65VpLwWac",
            authDomain: "voice-chat-streamer.firebaseapp.com",
            projectId: "voice-chat-streamer",
            storageBucket: "voice-chat-streamer.firebasestorage.app",
            messagingSenderId: "403894004803",
            appId: "1:403894004803:web:c75b2d63b57f5f4ab978f6"
        };

        // --- カスタムダイアログ ユーティリティ ---
        window.showMsg = function(msg, title = "通知", type = "info") {
            return new Promise(resolve => {
                const dlg = document.getElementById('custom-dialog');
                const titleEl = document.getElementById('dialog-title');
                const msgEl = document.getElementById('dialog-msg');
                const iconEl = document.getElementById('dialog-icon');
                const btnContainer = document.getElementById('dialog-buttons');
                
                titleEl.textContent = title;
                msgEl.innerHTML = msg;
                
                if (type === 'error') iconEl.innerHTML = '<i class="fa-solid fa-triangle-exclamation text-red-500"></i>';
                else if (type === 'success') iconEl.innerHTML = '<i class="fa-solid fa-circle-check text-green-500"></i>';
                else if (type === 'gift') iconEl.innerHTML = '<i class="fa-solid fa-gift text-pink-500 animate-bounce"></i>';
                else iconEl.innerHTML = '<i class="fa-solid fa-circle-info text-blue-400"></i>';

                btnContainer.innerHTML = `<button id="dlg-btn-ok" class="w-full py-2 bg-blue-600 hover:bg-blue-500 font-bold rounded-lg transition">OK</button>`;
                
                dlg.classList.remove('hidden');
                
                document.getElementById('dlg-btn-ok').onclick = () => {
                    dlg.classList.add('hidden');
                    resolve(true);
                };
            });
        };

        window.showConfirm = function(msg, title = "確認", type = "warning") {
            return new Promise(resolve => {
                const dlg = document.getElementById('custom-dialog');
                const titleEl = document.getElementById('dialog-title');
                const msgEl = document.getElementById('dialog-msg');
                const iconEl = document.getElementById('dialog-icon');
                const btnContainer = document.getElementById('dialog-buttons');
                
                titleEl.textContent = title;
                msgEl.innerHTML = msg;
                
                if (type === 'warning') iconEl.innerHTML = '<i class="fa-solid fa-triangle-exclamation text-yellow-500"></i>';
                else iconEl.innerHTML = '<i class="fa-regular fa-circle-question text-blue-400"></i>';

                btnContainer.innerHTML = `
                    <button id="dlg-btn-cancel" class="flex-1 py-2 bg-slate-700 hover:bg-slate-600 font-bold rounded-lg transition">キャンセル</button>
                    <button id="dlg-btn-ok" class="flex-1 py-2 bg-red-600 hover:bg-red-500 font-bold rounded-lg transition">OK</button>
                `;
                
                dlg.classList.remove('hidden');
                
                document.getElementById('dlg-btn-ok').onclick = () => { dlg.classList.add('hidden'); resolve(true); };
                document.getElementById('dlg-btn-cancel').onclick = () => { dlg.classList.add('hidden'); resolve(false); };
            });
        };

        window.showPrompt = function(msg, title = "入力", type = "info", isPassword = false) {
            return new Promise(resolve => {
                const dlg = document.getElementById('custom-dialog');
                const titleEl = document.getElementById('dialog-title');
                const msgEl = document.getElementById('dialog-msg');
                const iconEl = document.getElementById('dialog-icon');
                const btnContainer = document.getElementById('dialog-buttons');
                
                titleEl.textContent = title;
                iconEl.innerHTML = '<i class="fa-solid fa-keyboard text-purple-400"></i>';
                
                msgEl.innerHTML = `
                    <p class="mb-3">${msg}</p>
                    <input type="${isPassword ? 'password' : 'text'}" id="dlg-input" class="w-full bg-slate-900 border border-slate-600 rounded px-3 py-2 text-white outline-none focus:border-blue-500 text-center">
                `;

                btnContainer.innerHTML = `
                    <button id="dlg-btn-cancel" class="flex-1 py-2 bg-slate-700 hover:bg-slate-600 font-bold rounded-lg transition text-sm">キャンセル</button>
                    <button id="dlg-btn-ok" class="flex-1 py-2 bg-blue-600 hover:bg-blue-500 font-bold rounded-lg transition text-sm">決定</button>
                `;
                
                dlg.classList.remove('hidden');
                setTimeout(() => document.getElementById('dlg-input').focus(), 100);
                
                document.getElementById('dlg-btn-ok').onclick = () => { 
                    const val = document.getElementById('dlg-input').value;
                    dlg.classList.add('hidden'); 
                    resolve(val); 
                };
                document.getElementById('dlg-btn-cancel').onclick = () => { dlg.classList.add('hidden'); resolve(null); };
            });
        };

        // --- データサニタイズ（undefined除去フィルター） ---
        const cleanData = (obj) => {
            if (obj === undefined) return null;
            if (obj === null || typeof obj !== 'object') return obj;
            return JSON.parse(JSON.stringify(obj)); // undefinedを安全に消去
        };

        // 変数定義
        let app, auth, db;
        let userId = null;
        window.currentRoomId = null;
        let unsubscribeRoom = null;
        
        let playerCard = null; // 自分のプロフィールカード
        let isHost = false;
        let bp = parseInt(localStorage.getItem('battlePoints') || '0');
        let isAdminMode = false;
        let studioSelectedCard = null;

        // 初期化処理
        async function init() {
            try {
                app = initializeApp(firebaseConfig);
                auth = getAuth(app);
                db = getFirestore(app);

                onAuthStateChanged(auth, async (user) => {
                    if (user) {
                        userId = user.uid;
                        loadProfile();
                        updateBpDisplay();
                        
                        // ゴーストルーム（以前の部屋の残像）のチェックと確実なリセット
                        const savedRoomId = localStorage.getItem('currentRoomId');
                        if (savedRoomId) {
                            try {
                                const snap = await getDoc(doc(db, "rooms", savedRoomId));
                                if (snap.exists() && (snap.data().host?.id === userId || snap.data().guest?.id === userId)) {
                                    window.currentRoomId = savedRoomId;
                                    listenRoom();
                                } else {
                                    // 自分がいない部屋の残像は完全に消去する
                                    localStorage.removeItem('currentRoomId');
                                    window.currentRoomId = null;
                                    document.getElementById('header-room-id').classList.add('hidden');
                                }
                            } catch(e) {
                                localStorage.removeItem('currentRoomId');
                                window.currentRoomId = null;
                                document.getElementById('header-room-id').classList.add('hidden');
                            }
                        } else {
                            // そもそも部屋IDが保存されていなければヘッダーは確実に隠す

        // --- プロフィール・BP管理 ---
        function loadProfile() {
            // 新旧両方のキーを確認
            let saved = localStorage.getItem('playerCard') || localStorage.getItem('elem_clash_ai_profile_v2');
            if (saved) {
                try {
                    let parsedData = JSON.parse(saved);
                    
                    // 古いバージョン(elem_clash_ai_profile_v2)のデータ形式だった場合、新しい形式に変換
                    if (parsedData.stats && parsedData.cardData) {
                         playerCard = {
                             id: "card_" + Date.now(),
                             name: parsedData.name || parsedData.stats.name || "Unknown",
                             rarity: parsedData.stats.rarity || "N",
                             hp: parsedData.stats.hp || 2000,
                             atk: parsedData.stats.atk || 300,
                             def: parsedData.stats.def || 300,
                             spd: parsedData.stats.spd || 300,
                             img: parsedData.cardData
                         };
                    } else {
                         playerCard = cleanData(parsedData);
                    }
                    renderProfileCard(playerCard, 'lobby-profile-card');
                } catch(e) {
                    console.error("プロフィール読み込みエラー:", e);
                }
            }
            
            const savedName = localStorage.getItem('playerName') || (playerCard ? playerCard.name : null);
            if (savedName) document.getElementById('lobby-player-name').textContent = savedName;
            else {
                const name = "Player_" + Math.floor(Math.random() * 10000);
                localStorage.setItem('playerName', name);
                document.getElementById('lobby-player-name').textContent = name;
            }

        function updateBpDisplay() {
            document.getElementById('lobby-bp').textContent = bp;
        }
        function addBp(amount) {
            if (isAdminMode) return;
            bp += amount;
            localStorage.setItem('battlePoints', bp.toString());
            updateBpDisplay();
        }

        function renderProfileCard(card, elementId) {
            const el = document.getElementById(elementId);
            if (!el || !card) return;
            
            const rarityColors = { 'UR': 'ur-glow', 'SSR': 'ssr-glow', 'SR': 'sr-glow', 'R': 'r-glow', 'N': 'n-glow' };

            el.className = `w-40 h-56 rounded-xl border-2 flex flex-col relative overflow-hidden bg-cover bg-center cursor-pointer ${glowClass}`;

            el.innerHTML = `

                <div class="absolute bottom-0 w-full bg-black/80 p-2 text-[10px] space-y-0.5 backdrop-blur-sm border-t border-slate-700/50">

                    <div class="flex justify-between"><span class="text-gray-400">DEF:</span> <span class="text-blue-400 font-bold">${card.def || 0}</span></div>

        // --- ルーム管理 (ロビー) ---
        let isProcessing = false;

        window.createRoom = async function() {
            if (isProcessing) return;
            if (!userId) { await showMsg("ログイン処理中です..."); return; }
            if (!playerCard) {
                await showMsg("先にAI STUDIOでカードを作成して<br>プロフィールにセットしてください！", "準備未完了", "warning");
                openAiStudio();
                return;
            }
            
            isProcessing = true;
            try {
                const roomId = Math.floor(1000 + Math.random() * 9000).toString();
                const roomRef = doc(db, "rooms", roomId);
                
                // サニタイズ処理
                const cleanPlayerCard = cleanData(playerCard);
                
                await setDoc(roomRef, {
                    host: {
                        id: userId,
                        name: document.getElementById('lobby-player-name').textContent,
                        card: cleanPlayerCard,
                        hp: cleanPlayerCard.hp || 0,
                        maxHp: cleanPlayerCard.hp || 0
                    },
                    guest: null,
                    status: "waiting",
                    turn: 1,
                    hostSubmit: null,
                    guestSubmit: null,
                    createdAt: new Date().getTime()
                });
                
                isHost = true;
                window.hostId = userId;
                window.currentRoomId = roomId;
                localStorage.setItem('currentRoomId', roomId);
                
                showWaitingScreen(roomId);
                listenRoom();
            } catch (e) {
                console.error(e);
                await showMsg("部屋の作成に失敗しました。<br>エラー: " + e.message, "エラー", "error");
            } finally {
                isProcessing = false;
            }
        };

        window.joinRoom = async function() {
            if (isProcessing) return;
            const roomId = document.getElementById('room-id-input').value.trim();
            if (!roomId) { await showMsg("ROOM IDを入力してください"); return; }
            if (!playerCard) {
                await showMsg("先にAI STUDIOでカードを作成して<br>プロフィールにセットしてください！", "準備未完了", "warning");
                return;
            }
            
            isProcessing = true;
            try {
                const roomRef = doc(db, "rooms", roomId);
                const snap = await getDoc(roomRef);
                
                if (!snap.exists()) {
                    await showMsg("部屋が見つかりません。IDを確認してください。", "エラー", "error");
                    return;
                }
                
                const roomData = snap.data();
                if (roomData.guest && roomData.guest.id !== userId) {
                    await showMsg("この部屋はすでに満室です。", "エラー", "error");
                    return;
                }
                
                // サニタイズ処理
                const cleanPlayerCard = cleanData(playerCard);

                await updateDoc(roomRef, {
                    guest: {
                        id: userId,
                        name: document.getElementById('lobby-player-name').textContent,
                        card: cleanPlayerCard,
                        hp: cleanPlayerCard.hp || 0,
                        maxHp: cleanPlayerCard.hp || 0
                    },
                    status: "playing"
                });
                
                isHost = false;
                window.hostId = roomData.host.id;
                window.currentRoomId = roomId;
                localStorage.setItem('currentRoomId', roomId);
                listenRoom();
                
            } catch (e) {
                console.error(e);
                await showMsg("入室に失敗しました。<br>エラー: " + e.message, "エラー", "error");
            } finally {
                isProcessing = false;
            }
        };

        window.exitRoom = async function() {
            if (!window.currentRoomId) return;
            const confirm = await showConfirm("本当に部屋を解散・退出しますか？");
            if (!confirm) return;

            if (unsubscribeRoom) { unsubscribeRoom(); unsubscribeRoom = null; }
            
            if (isHost) {
                try {
                    await deleteDoc(doc(db, "rooms", window.currentRoomId));
                } catch(e){}
            }
            
            window.currentRoomId = null;
            localStorage.removeItem('currentRoomId');
            document.getElementById('header-room-id').classList.add('hidden');
            showLobby();
        };

        window.surrender = async function() {
             const confirm = await showConfirm("バトルから退出（降伏）しますか？<br>※相手の勝利となります。", "降伏確認");
             if (!confirm) return;
             
             try {
                await updateDoc(doc(db, "rooms", window.currentRoomId), {
                    status: "finished",
                    winner: isHost ? "guest" : "host",
                    surrendered: true
                });
             } catch(e) {
                exitRoom();
             }
        };

        function showLobby() {
            document.getElementById('lobby-screen').classList.remove('hidden');
            document.getElementById('lobby-screen').classList.add('flex');
            document.getElementById('waiting-screen').classList.add('hidden');
            document.getElementById('waiting-screen').classList.remove('flex');
            document.getElementById('battle-screen').classList.add('hidden');
            document.getElementById('battle-screen').classList.remove('flex');
            // ロビーに戻ったら必ずヘッダーの残像を消す
            document.getElementById('header-room-id').classList.add('hidden');
        }

        function showWaitingScreen(roomId) {
            document.getElementById('lobby-screen').classList.add('hidden');
            document.getElementById('lobby-screen').classList.remove('flex');
            document.getElementById('waiting-screen').classList.remove('hidden');
            document.getElementById('waiting-screen').classList.add('flex');
            document.getElementById('wait-room-id').textContent = roomId;
            document.getElementById('header-room-id').classList.remove('hidden');
            document.getElementById('display-room-id').textContent = roomId;
        }

        function showBattleScreen() {
            document.getElementById('lobby-screen').classList.add('hidden');
            document.getElementById('lobby-screen').classList.remove('flex');
            document.getElementById('waiting-screen').classList.add('hidden');
            document.getElementById('waiting-screen').classList.remove('flex');
            document.getElementById('battle-screen').classList.remove('hidden');
            document.getElementById('battle-screen').classList.add('flex');
            document.getElementById('header-room-id').classList.remove('hidden');
            generateHandCards(); 
        }

        // --- バトルロジック同期 ---
        let battleState = null;
        let isAnimating = false;

        function listenRoom() {
            if (unsubscribeRoom) unsubscribeRoom();
            
            const roomRef = doc(db, "rooms", window.currentRoomId);
            unsubscribeRoom = onSnapshot(roomRef, async (snap) => {
                if (!snap.exists()) {
                    await showMsg("部屋が解散されました", "通知");
                    window.currentRoomId = null;
                    localStorage.removeItem('currentRoomId');
                    showLobby();
                    return;
                }
                
                const data = snap.data();
                battleState = data;
                
                if (data.status === "playing" && document.getElementById('battle-screen').classList.contains('hidden')) {
                    setupBattleUI(data);
                    showBattleScreen();
                }

                if (data.status === "playing" && !isAnimating) {
                    syncBattleUI(data);
                    checkTurnProgress(data);
                }

                if (data.status === "finished") {
                    handleGameEnd(data);
                }
                
                if (data.gift && data.gift.to === userId && !data.gift.received) {
                    receiveGift(data.gift.card);
                    if (isHost) updateDoc(roomRef, { "gift.received": true });
                    else updateDoc(roomRef, { "gift.received": true });
                }
            }, (error) => {
                console.error("Snapshot error:", error);
                showMsg("通信エラーが発生しました: " + error.message, "エラー", "error");
            });
        }

        function setupBattleUI(data) {
            const me = isHost ? data.host : data.guest;
            const enemy = isHost ? data.guest : data.host;
            
            document.getElementById('my-name').textContent = me.name || 'Player';
            document.getElementById('enemy-name').textContent = enemy.name || 'Enemy';
            document.getElementById('enemy-img').style.backgroundImage = `url('${enemy.card?.img || ''}')`;
        }

        function syncBattleUI(data) {
            const me = isHost ? data.host : data.guest;
            const enemy = isHost ? data.guest : data.host;
            
            document.getElementById('my-hp-val').textContent = Math.max(0, me.hp || 0);
            document.getElementById('my-hp-max').textContent = me.maxHp || 0;
            document.getElementById('my-hp-bar').style.width = `${Math.max(0, ((me.hp || 0) / (me.maxHp || 1)) * 100)}%`;
            
            document.getElementById('enemy-hp-val').textContent = Math.max(0, enemy.hp || 0);
            document.getElementById('enemy-hp-max').textContent = enemy.maxHp || 0;
            document.getElementById('enemy-hp-bar').style.width = `${Math.max(0, ((enemy.hp || 0) / (enemy.maxHp || 1)) * 100)}%`;
            
            document.getElementById('turn-display').textContent = `TURN ${data.turn}`;
            
            if (!data.hostSubmit && !data.guestSubmit && !isAnimating) {
                resetSubmitCardsUI();
                enableHandCards();
            }
        }

        function generateHandCards() {
            const container = document.getElementById('hand-cards-container');
            container.innerHTML = '';
            const types = [
                { type: 'fire', icon: 'fa-fire', color: 'text-red-500', bg: 'bg-red-900/40', border: 'border-red-600' },
                { type: 'water', icon: 'fa-droplet', color: 'text-blue-500', bg: 'bg-blue-900/40', border: 'border-blue-600' },
                { type: 'leaf', icon: 'fa-leaf', color: 'text-green-500', bg: 'bg-green-900/40', border: 'border-green-600' }
            ];
            
            types.forEach((t, i) => {
                const btn = document.createElement('button');
                btn.className = `hand-card flex-1 h-20 ${t.bg} border ${t.border} rounded-xl flex flex-col items-center justify-center transform transition hover:-translate-y-2 hover:shadow-lg focus:outline-none`;
                btn.innerHTML = `<i class="fa-solid ${t.icon} ${t.color} text-2xl mb-1"></i>`;
                btn.onclick = () => submitCard(t.type, btn);
                container.appendChild(btn);
            });
        }

        function enableHandCards() { document.querySelectorAll('.hand-card').forEach(btn => btn.classList.remove('opacity-50', 'pointer-events-none', 'scale-90')); }
        function disableHandCards() { document.querySelectorAll('.hand-card').forEach(btn => btn.classList.add('opacity-50', 'pointer-events-none', 'scale-90')); }

        async function submitCard(type, btnElement) {
            if (!window.currentRoomId || isAnimating) return;
            
            document.querySelectorAll('.hand-card').forEach(b => { if (b !== btnElement) b.classList.add('opacity-50', 'scale-90'); });
            btnElement.classList.add('ring-2', 'ring-white', 'scale-105');
            disableHandCards(); 
            
            const mySubmitEl = document.getElementById('my-submit-card');
            mySubmitEl.innerHTML = `<i class="fa-solid ${getTypeIcon(type)} text-4xl"></i>`;
            mySubmitEl.className = `w-32 h-48 rounded-xl flex items-center justify-center transform transition duration-500 opacity-100 ${getTypeBgClass(type)} shadow-[0_0_20px_rgba(255,255,255,0.2)]`;
            
            const roomRef = doc(db, "rooms", window.currentRoomId);
            const updateKey = isHost ? "hostSubmit" : "guestSubmit";
            
            try { await updateDoc(roomRef, { [updateKey]: type }); } 
            catch(e) { console.error(e); await showMsg("通信エラー", "エラー", "error"); enableHandCards(); }
        }

        async function checkTurnProgress(data) {
            if (data.hostSubmit && data.guestSubmit && !isAnimating) {
                isAnimating = true;
                await playBattleAnimation(data);
                if (isHost && window.currentRoomId) processTurnEnd(data);
            }
        }

        async function playBattleAnimation(data) {
            const logEl = document.getElementById('battle-log');
            const mySubmitEl = document.getElementById('my-submit-card');
            const enemySubmitEl = document.getElementById('enemy-submit-card');
            
            const myType = isHost ? data.hostSubmit : data.guestSubmit;
            const enemyType = isHost ? data.guestSubmit : data.hostSubmit;
            
            logEl.textContent = "BATTLE!!";
            enemySubmitEl.innerHTML = `<i class="fa-solid ${getTypeIcon(enemyType)} text-4xl"></i>`;
            enemySubmitEl.className = `w-32 h-48 rounded-xl flex items-center justify-center transform transition duration-500 opacity-100 ${getTypeBgClass(enemyType)} shadow-[0_0_20px_rgba(255,255,255,0.2)]`;
            
            await new Promise(r => setTimeout(r, 1000));
            
            let result = "draw";
            if ((myType === 'fire' && enemyType === 'leaf') || (myType === 'leaf' && enemyType === 'water') || (myType === 'water' && enemyType === 'fire')) result = "win";
            else if (myType !== enemyType) result = "lose";
            
            if (result === "win") {
                logEl.textContent = "WIN! 相手にダメージ！"; logEl.className = "absolute top-0 w-full text-center text-xl font-black text-red-400 drop-shadow-[0_0_5px_rgba(255,0,0,0.8)] z-10 animate-pulse";
                enemySubmitEl.classList.add('grayscale', 'scale-90', 'opacity-50'); mySubmitEl.classList.add('scale-110', 'z-10');
            } else if (result === "lose") {
                logEl.textContent = "LOSE... ダメージを受けた！"; logEl.className = "absolute top-0 w-full text-center text-xl font-black text-blue-400 drop-shadow-[0_0_5px_rgba(0,0,255,0.8)] z-10";
                mySubmitEl.classList.add('grayscale', 'scale-90', 'opacity-50'); enemySubmitEl.classList.add('scale-110', 'z-10');
            } else {
                logEl.textContent = "DRAW! 引き分け"; logEl.className = "absolute top-0 w-full text-center text-lg font-bold text-gray-300 z-10";
            }
            
            await new Promise(r => setTimeout(r, 1500));
            logEl.textContent = ""; logEl.className = "absolute top-0 w-full text-center text-sm font-bold text-yellow-300 drop-shadow-md h-6";
        }

        async function processTurnEnd(data) {
            const hType = data.hostSubmit; const gType = data.guestSubmit; let hDmg = 0; let gDmg = 0;
            const calcDmg = (atk, def) => Math.max(500, Math.floor((atk||0) * 1.5 - (def||0) * 0.8) * (1 + Math.random()*0.2));
            
            let winner = "draw";
            if ((hType === 'fire' && gType === 'leaf') || (hType === 'leaf' && gType === 'water') || (hType === 'water' && gType === 'fire')) winner = "host";
            else if (hType !== gType) winner = "guest";
            
            if (winner === "host") gDmg = calcDmg(data.host.card?.atk, data.guest.card?.def);
            else if (winner === "guest") hDmg = calcDmg(data.guest.card?.atk, data.host.card?.def);
            
            const newHostHp = Math.max(0, data.host.hp - hDmg); const newGuestHp = Math.max(0, data.guest.hp - gDmg);
            const updateData = { "host.hp": newHostHp, "guest.hp": newGuestHp, "hostSubmit": null, "guestSubmit": null, "turn": data.turn + 1 };
            
            if (newHostHp <= 0 || newGuestHp <= 0) {
                updateData.status = "finished"; updateData.winner = newHostHp > 0 ? "host" : (newGuestHp > 0 ? "guest" : "draw");
            }
            
            try { await updateDoc(doc(db, "rooms", window.currentRoomId), updateData); } catch(e) { console.error("Turn End Error:", e); }
            finally { setTimeout(() => { isAnimating = false; }, 200); }
        }

        function resetSubmitCardsUI() {
            const mySubmitEl = document.getElementById('my-submit-card'); const enemySubmitEl = document.getElementById('enemy-submit-card');
            [mySubmitEl, enemySubmitEl].forEach(el => { el.innerHTML = '<span class="text-xs text-gray-500">WAITING</span>'; el.className = 'w-32 h-48 card-bg rounded-xl flex items-center justify-center transform transition duration-500 scale-95 opacity-50 relative overflow-hidden'; });
            document.querySelectorAll('.hand-card').forEach(btn => btn.classList.remove('ring-2', 'ring-white', 'scale-105'));
        }

        async function handleGameEnd(data) {
            isAnimating = false; let msg = ""; let isWin = false;
            if (data.surrendered) {
                if (data.winner === (isHost ? "host" : "guest")) { msg = "相手が降伏しました！<br>YOU WIN!!"; isWin = true; } 
                else { msg = "降伏しました。<br>YOU LOSE..."; }
            } else {
                if (data.winner === "draw") { msg = "相打ち！<br>DRAW"; } 
                else if (data.winner === (isHost ? "host" : "guest")) { msg = "勝利！！<br>YOU WIN!!"; isWin = true; } 
                else { msg = "敗北...<br>YOU LOSE..."; }
            }
            
            await new Promise(r => setTimeout(r, 1000));
            if (!isAdminMode) addBp(1);
            
            await showMsg(msg + "<br><br><span class='text-xs text-yellow-400'>+1 BP 獲得！</span>", "バトル終了", isWin ? "success" : "info");
            exitRoom();
        }

        function getTypeIcon(type) { if(type === 'fire') return 'fa-fire text-red-500'; if(type === 'water') return 'fa-droplet text-blue-500'; if(type === 'leaf') return 'fa-leaf text-green-500'; return 'fa-question'; }
        function getTypeBgClass(type) { if(type === 'fire') return 'bg-gradient-to-b from-red-900 to-slate-900 border-2 border-red-500'; if(type === 'water') return 'bg-gradient-to-b from-blue-900 to-slate-900 border-2 border-blue-500'; if(type === 'leaf') return 'bg-gradient-to-b from-green-900 to-slate-900 border-2 border-green-500'; return 'card-bg'; }

        // --- トレード機能 ---

            const cleanGiftCard = cleanData(playerCard);

        window.saveApiKey = async function() {
            const key = document.getElementById('api-key-input').value.trim(); localStorage.setItem('geminiApiKey', key); await showMsg("API Keyを保存しました。");
        }
        
        window.generateCard = async function(type = 'new') {
            const isTest = document.getElementById('test-mode-toggle').checked;
            if (type === 'awaken') {
                if (!isAdminMode) {
                    if (bp < 10) { await showMsg("覚醒P(BP)が足りません。<br>バトルをして貯めてください！(現在: "+bp+")", "BP不足", "warning"); return; }
                    addBp(-10);
                }
                if (!studioSelectedCard && !document.getElementById('image-upload').files[0]) {
                    await showMsg("ベースとなるカードを選択、<br>または画像をアップロードしてください。", "エラー", "warning");
                    if (!isAdminMode) addBp(10);
                    return;
                }
            }
            document.getElementById('studio-loading').classList.remove('hidden');
            
            try {
                // デモ生成
                await new Promise(r => setTimeout(r, 2000));
                let newRarity = "SR", hp = 4000, atk = 1000, def = 800, spd = 900;
                
                if (type === 'awaken') {
                    if (isAdminMode) { newRarity = "UR"; hp = 9999; atk = 2000; def = 2000; spd = 2000; } 
                    else {
                        const r = Math.random();
                        if (r < 0.2) { newRarity = "R"; hp = 2000; atk=500; def=400; spd=450; } 
                        else if (r < 0.8) { newRarity = "SSR"; hp = 6000; atk=1500; def=1200; spd=1300; } 
                        else { newRarity = "UR"; hp = 8800; atk=1800; def=1500; spd=1600; } 
                    }
                } else {
                    const r = Math.random();
                    if(r < 0.4) newRarity = "N"; else if(r < 0.7) newRarity = "R"; else if(r < 0.9) newRarity = "SR"; else if(r < 0.98) newRarity = "SSR"; else newRarity = "UR";
                    hp = newRarity==="N"?1500:newRarity==="R"?2500:newRarity==="SR"?3500:newRarity==="SSR"?5500:8000;
                }
                
                const dummyImg = `https://picsum.photos/seed/${Math.random()}/300/400`;
                studioSelectedCard = { id: "card_" + Date.now(), name: "AI Gen Card", rarity: newRarity, hp: hp, atk: atk, def: def, spd: spd, img: dummyImg, desc: "AIによって生み出された存在" };
                renderProfileCard(studioSelectedCard, 'studio-preview-card');
                
                if (type === 'awaken' && !isAdminMode && newRarity === "R") await showMsg("覚醒失敗...<br>力が暴走しステータスがダウンしてしまった...", "失敗", "warning");
                
            } catch(e) { console.error(e); await showMsg(e.message, "エラー", "error"); } 
            finally { document.getElementById('studio-loading').classList.add('hidden'); }
        };

        window.analyzeImage = async function() { await showMsg("現在画像解析機能は準備中です。", "情報"); }

        // --- 保存・プロフ設定 ---
        window.saveToBinder = async function() {
            if (!studioSelectedCard) { await showMsg("保存するカードがありません。"); return; }
            saveCardToCollection(studioSelectedCard); await showMsg("図鑑に保存しました！", "保存成功", "success");
        }

        window.setAsProfile = async function() {
            if (!studioSelectedCard) { await showMsg("セットするカードがありません。"); return; }
            
            // サニタイズ
            playerCard = cleanData(studioSelectedCard);
            localStorage.setItem('playerCard', JSON.stringify(playerCard));
            renderProfileCard(playerCard, 'lobby-profile-card');
            
            if (window.currentRoomId) {
                try {
                    const roomRef = doc(db, "rooms", window.currentRoomId);
                    const updateKey = isHost ? "host" : "guest";
                    const cleanForSync = cleanData(playerCard);
                    
                    await updateDoc(roomRef, {
                        [`${updateKey}.card`]: cleanForSync,
                        [`${updateKey}.hp`]: cleanForSync.hp || 0,
                        [`${updateKey}.maxHp`]: cleanForSync.hp || 0
                    });
                } catch(e) { console.error(e); }
            }
            await showMsg("プロフィールにカードをセットしました！", "設定完了", "success");
        }

        // --- 図鑑機能 (Collection) ---
        function getCollection() {
            // 新旧両方のデータを読み込む試み
            let data = localStorage.getItem('myCollection');
            let col = data ? JSON.parse(data) : [];
            
            // 旧バージョンのデータ(elem_clash_ai_col_v1)があれば結合してフォーマット変換
            let oldData = localStorage.getItem('elem_clash_ai_col_v1');
            if (oldData) {
                try {
                    let oldCol = JSON.parse(oldData);
                    oldCol.forEach(item => {
                         if (item.stats && item.origImage) {
                             // ID重複チェック (簡易的に画像URLで)
                             if(!col.find(c => c.img === item.origImage)) {
                                 col.push({
                                     id: item.id || "card_" + Date.now(),
                                     name: item.stats.name || "Unknown",
                                     rarity: item.stats.rarity || "N",
                                     hp: item.stats.hp || 2000,
                                     atk: item.stats.atk || 300,
                                     def: item.stats.def || 300,
                                     spd: item.stats.spd || 300,
                                     img: item.origImage,
                                     jobClass: item.stats.jobClass
                                 });
                             }
                         }
                    });
                } catch(e) { console.error("旧コレクション読み込みエラー:", e); }
            }
            return col;
        }
        
        function saveCardToCollection(card) {
            let collection = getCollection();
            // 重複チェックは簡易的にIDで
            if (!collection.find(c => c.id === card.id)) {
                collection.unshift(cleanData(card)); // 新しいものを先頭に
                if (collection.length > 30) collection.pop(); // 上限30枚
                localStorage.setItem('myCollection', JSON.stringify(collection));
                
                // 旧バージョンとの互換性のためにも保存しておく(安全策)
                try {
                     let oldFormatCard = {
                         id: card.id,
                         origImage: card.img,
                         stats: {
                             name: card.name,
                             rarity: card.rarity,
                             hp: card.hp, atk: card.atk, def: card.def, spd: card.spd,
                             jobClass: card.jobClass || "FIGHTER"
                         }
                     };
                     let oldCol = localStorage.getItem('elem_clash_ai_col_v1') ? JSON.parse(localStorage.getItem('elem_clash_ai_col_v1')) : [];
                     if(!oldCol.find(c => c.id === card.id)){
                         oldCol.unshift(oldFormatCard);
                         if(oldCol.length > 30) oldCol.pop();
                         localStorage.setItem('elem_clash_ai_col_v1', JSON.stringify(oldCol));
                     }
                } catch(e){}
            }
        }
        window.analyzeImage = async function() {
            const file = document.getElementById('image-upload').files[0];
            const theme = document.getElementById('prompt-input').value.trim();
            const key = document.getElementById('api-key-input').value.trim();
            
            // 図鑑から選択済みのカードがあり、新規ファイルが選択されていない場合はその画像を使う
            let b64 = null;
            if (file) {
                b64 = await new Promise(r => {
                    const reader = new FileReader();
                    reader.onload = () => r(reader.result);
                    reader.readAsDataURL(file);
                });
            } else if (studioSelectedCard && studioSelectedCard.img) {
                b64 = studioSelectedCard.img;
            }

            if (!b64) {
                await showMsg("画像をアップロードするか、図鑑からカードを選択してください。", "エラー", "warning");
                return;
            }

            if (!key) {
                await showMsg("API Keyが設定されていないため、デモデータを適用します。", "デモモード");
                // デモデータ適用
                studioSelectedCard = {
                    id: "card_" + Date.now(),
                    name: "解析された剣士",
                    rarity: "SR",
                    hp: 3500, atk: 800, def: 500, spd: 400,
                    img: b64,
                    jobClass: "戦士"
                };
                renderProfileCard(studioSelectedCard, 'studio-preview-card');
                return;
            }

            document.getElementById('studio-loading').classList.remove('hidden');

            try {
                // Gemini API 呼び出し (Text Model for Vision)
                const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${key}`;
                
                let instructions = `あなたはカードゲームの熟練データメイカーです。
提供された画像とテーマを解析し、ファンタジー風のステータスを出力してください。
レアリティの基準: N(HP2000未満), R(HP3000未満), SR(HP4500未満), SSR(HP7000未満), UR(HP9999未満)。
必ず以下のJSONフォーマットのみを出力してください。余計なテキストは含めないでください。
{"name":"キャラ名","jobClass":"通り名","rarity":"N,R,SR,SSR,UR","hp":数値,"atk":数値,"def":数値,"spd":数値}`;

                let promptText = "画像を解析してステータスを生成してください。";
                if (theme) promptText += ` 追加テーマ: ${theme}`;

                const mimeType = b64.split(';')[0].split(':')[1];
                const base64Data = b64.split(',')[1];

                const payload = {
                    contents: [{
                        parts: [
                            { text: promptText },
                            { inlineData: { mimeType: mimeType, data: base64Data } }
                        ]
                    }],
                    systemInstruction: { parts: [{ text: instructions }] },
                    generationConfig: { responseMimeType: "application/json" }
                };

                const response = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (!response.ok) {
                    const err = await response.json();
                    throw new Error(err.error?.message || "API request failed");
                }

                const resData = await response.json();
                const jsonText = resData.candidates[0].content.parts[0].text;
                const stats = JSON.parse(jsonText);

                // 解析結果を適用
                studioSelectedCard = {
                    id: "card_" + Date.now(),
                    name: stats.name || "Unknown",
                    rarity: stats.rarity || "N",
                    hp: stats.hp || 2000,
                    atk: stats.atk || 300,
                    def: stats.def || 300,
                    spd: stats.spd || 300,
                    img: b64,
                    jobClass: stats.jobClass
                };
                
                renderProfileCard(studioSelectedCard, 'studio-preview-card');
                await showMsg("画像の解析が完了しました！", "解析完了", "success");

            } catch(e) {
                console.error(e);
                await showMsg("解析エラー: " + e.message, "エラー", "error");
            } finally {
                document.getElementById('studio-loading').classList.add('hidden');
            }
        }

        // 初期化実行
        window.onload = init;

    </script>

name: note-feed

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/note-feed.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch note RSS and build note-feed.json
        run: |
          curl -sL -A "Mozilla/5.0 (Linux; Android 14) AppleWebKit/537.36" "https://note.com/dorayakiwalk/rss" -o /tmp/note-rss.xml
          python3 - << 'PYEOF'
          import sys, json, xml.etree.ElementTree as ET
          from email.utils import parsedate_to_datetime
          from datetime import timezone, timedelta, datetime
          JST = timezone(timedelta(hours=9))
          raw = open('/tmp/note-rss.xml', 'rb').read()
          if b'<item>' not in raw:
              print('RSS fetch failed or empty; keeping existing JSON')
              sys.exit(1)
          root = ET.fromstring(raw)
          items = []
          for it in root.iter('item'):
              title = (it.findtext('title') or '').strip()
              link = (it.findtext('link') or '').strip()
              pub = (it.findtext('pubDate') or '').strip()
              if not title or not link:
                  continue
              date = ''
              try:
                  date = parsedate_to_datetime(pub).astimezone(JST).strftime('%Y-%m-%d')
              except Exception:
                  pass
              items.append({'title': title, 'link': link, 'date': date})
              if len(items) >= 5:
                  break
          if not items:
              print('No items extracted; keeping existing JSON')
              sys.exit(1)
          out = {'generated_at': datetime.now(JST).isoformat(timespec='seconds'), 'items': items}
          open('note-feed.json', 'w', encoding='utf-8').write(json.dumps(out, ensure_ascii=False, indent=2) + '\n')
          print('items:', len(items))
          PYEOF

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add note-feed.json
          if git diff --cached --quiet; then
            echo "note-feed.json is already up to date"
          else
            git commit -m "note-feed.json を更新（note RSSから自動生成）"
            git push
          fi

<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Elemental Clash - Streamer Card Game</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* カスタムアニメーションとエフェクト */
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; touch-action: manipulation; }
        
        /* 3Dカードフリップ */
        .card-container {
            perspective: 1000px;
            width: 80px;
            height: 110px;
        }
        .card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            text-align: center;
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            transform-style: preserve-3d;
        }
        .card-inner.is-flipped {
            transform: rotateY(180deg);
        }
        .card-front, .card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            -webkit-backface-visibility: hidden;
            backface-visibility: hidden;
            border-radius: 0.5rem;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        .card-back {
            background: linear-gradient(135deg, #1f2937, #111827);
            border: 2px solid #4b5563;
        }
        .card-front {
            transform: rotateY(180deg);
            background: #ffffff;
            color: #000;
        }
        
        /* 手札用カード（ホバーエフェクト） */
        .hand-card {
            width: 70px; height: 100px;
            background: white; border-radius: 0.5rem;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .hand-card.selected {
            transform: translateY(-10px) scale(1.1);
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.5);
        }

        /* 属性別スタイル */
        .element-FIRE { border: 4px solid #ef4444; }
        .element-THUNDER { border: 4px solid #eab308; }
        .element-WATER { border: 4px solid #3b82f6; }
        .text-FIRE { color: #ef4444; }
        .text-THUNDER { color: #eab308; }
        .text-WATER { color: #3b82f6; }

        /* 有利時の発光アニメーション */
        @keyframes glowBuff {
            0% { box-shadow: 0 0 10px currentColor; }
            50% { box-shadow: 0 0 40px 15px currentColor; transform: scale(1.05); }
            100% { box-shadow: 0 0 10px currentColor; transform: scale(1); }
        }
        .glow-buff { animation: glowBuff 1s ease-in-out; }

        /* ダメージ揺れアニメーション */
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-5px) rotate(-2deg); }
            40%, 80% { transform: translateX(5px) rotate(2deg); }
        }
        .shake { animation: shake 0.4s; border-color: red !important; }

        /* 攻撃の弾エフェクト (スマホ対応強化) */
        .projectile {
            position: absolute;
            width: 20px; height: 20px;
            border-radius: 50%;
            z-index: 9999; /* 確実に最前面へ */
            margin-left: -10px; margin-top: -10px;
            pointer-events: none;
            /* transformはJSで動的に適用 */
            transition: transform 0.4s cubic-bezier(0.5, 0, 1, 0.5);
        }
        
        .damage-orb {
            position: absolute;
            width: 14px; height: 14px;
            background: #fff;
            box-shadow: 0 0 15px 8px #fffaaa;
            border-radius: 50%;
            z-index: 9999;
            margin-left: -7px; margin-top: -7px;
            pointer-events: none;
            transition: transform 0.6s cubic-bezier(0.2, 0.8, 0.4, 1);
        }

        /* +3 のポップアップテキスト */
        @keyframes popUpText {
            0% { opacity: 0; transform: translateY(0) scale(0.5); }
            20% { opacity: 1; transform: translateY(-20px) scale(1.5); }
            80% { opacity: 1; transform: translateY(-30px) scale(1); }
            100% { opacity: 0; transform: translateY(-40px) scale(1); }
        }
        .popup-text {
            position: absolute;
            font-size: 2rem;
            font-weight: 900;
            text-shadow: 2px 2px 0 #000, -2px -2px 0 #000, 2px -2px 0 #000, -2px 2px 0 #000, 0 0 20px currentColor;
            animation: popUpText 1.5s forwards;
            pointer-events: none;
            z-index: 9999;
        }

        /* パーティクル */
        .particle {
            position: absolute;
            border-radius: 50%;
            pointer-events: none;
            z-index: 9998;
        }

        /* HPバーのアニメーション */
        .hp-bar-transition {
            transition: width 0.5s ease-out, background-color 0.5s ease-out;
        }

        /* 全体のレイアウト (スマホの高さ対応) */
        .app-container {
            height: 100dvh; /* スマホのUIバーを除いた正確な高さ */
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background-color: #111827; /* bg-gray-900 */
        }
    </style>
</head>
<body class="text-white m-0 p-0 overflow-hidden">

    <!-- Firebase Scripts -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, onSnapshot, getDoc, updateDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // 環境切り替え対応Firebase設定
        let firebaseConfig = {
            apiKey: "AIzaSyB0WCtYTz2ychi5K7WaE1iXjN65VpLwWac",
            authDomain: "voice-chat-streamer.firebaseapp.com",
            projectId: "voice-chat-streamer",
            storageBucket: "voice-chat-streamer.firebasestorage.app",
            messagingSenderId: "403894004803",
            appId: "1:403894004803:web:c75b2d63b57f5f4ab978f6"
        };
        const appIdStr = typeof __app_id !== 'undefined' ? __app_id : 'streamer-card-game';
        if (typeof __firebase_config !== 'undefined' && __firebase_config) {
            try { firebaseConfig = JSON.parse(__firebase_config); } catch (e) { console.error(e); }
        }

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // ゲームステート
        let currentUser = null;
        let isHost = false;
        let currentRoomId = null;
        let roomUnsubscribe = null;
        let isAnimating = false;
        let myHand = [];
        let selectedCardIndex = null;
        const MAX_HP = 30;
        let myPlayerInfo = { name: '', iconData: null };

        const ELEMENTS = [
            { id: 'FIRE', icon: '🔥', color: '#ef4444' },
            { id: 'THUNDER', icon: '⚡', color: '#eab308' },
            { id: 'WATER', icon: '💧', color: '#3b82f6' }
        ];

        // --- UI要素 ---
        const ui = {
            battleArea: document.getElementById('battle-area'),
            btnGreenback: document.getElementById('btn-greenback'),
            lobbyUi: document.getElementById('lobby-ui'),
            battleField: document.getElementById('battle-field'),
            handUi: document.getElementById('hand-ui'),
            waitingUi: document.getElementById('waiting-ui'),
            btnCreate: document.getElementById('btn-create'),
            btnJoin: document.getElementById('btn-join'),
            inputId: document.getElementById('input-room'),
            inputName: document.getElementById('input-name'),
            inputIcon: document.getElementById('input-icon'),
            iconPreviewImg: document.getElementById('icon-preview-img'),
            iconPreviewText: document.getElementById('icon-preview-text'),
            roomDisplay: document.getElementById('room-display'),
            roomIdText: document.getElementById('room-id-text'),
            handCards: document.getElementById('hand-cards'),
            btnConfirm: document.getElementById('btn-confirm'),
            p1Slot: document.getElementById('p1-slot'),
            p2Slot: document.getElementById('p2-slot'),
            p1HpBar: document.getElementById('p1-hp-bar'),
            p2HpBar: document.getElementById('p2-hp-bar'),
            p1HpText: document.getElementById('p1-hp-text'),
            p2HpText: document.getElementById('p2-hp-text'),
            p1HpBox: document.getElementById('p1-hp-box'),
            p2HpBox: document.getElementById('p2-hp-box'),
            p1Name: document.getElementById('p1-name'),
            p2Name: document.getElementById('p2-name'),
            p1IconImg: document.createElement('img'),
            p2IconImg: document.createElement('img'),
            p1IconText: document.querySelector('.p1-icon-text'),
            p2IconText: document.querySelector('.p2-icon-text'),
            p1Status: document.getElementById('p1-status'),
            p2Status: document.getElementById('p2-status'),
            effectContainer: document.getElementById('effect-container'),
            resultMessage: document.getElementById('result-message'),
            resultMain: document.getElementById('result-text-main'),
            resultSub: document.getElementById('result-text-sub'),
        };

        // --- 認証 ---
        async function initAuth() {
            try {
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    await signInAnonymously(auth);
                }
            } catch (error) {
                console.error("Auth failed:", error);
            }
        }
        onAuthStateChanged(auth, (user) => { if (user) currentUser = user; });

        // --- ユーティリティ ---
        const sleep = ms => new Promise(r => setTimeout(r, ms));
        const generateRoomId = () => Math.floor(1000 + Math.random() * 9000).toString();
        const getRandomCard = () => {
            const el = ELEMENTS[Math.floor(Math.random() * ELEMENTS.length)];
            return { element: el.id, power: Math.floor(Math.random() * 9) + 1 };
        };

        // --- アイコン画像リサイズ (ブラウザ内で軽量化) ---
        function resizeImageAndGetDataUrl(file, maxWidth, maxHeight) {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const img = new Image();
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        let width = img.width;
                        let height = img.height;
                        if (width > height) {
                            if (width > maxWidth) { height = Math.round((height *= maxWidth / width)); width = maxWidth; }
                        } else {
                            if (height > maxHeight) { width = Math.round((width *= maxHeight / height)); height = maxHeight; }
                        }
                        canvas.width = width; canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);
                        resolve(canvas.toDataURL('image/jpeg', 0.7)); // 品質を落として軽量化
                    };
                    img.src = e.target.result;
                };
                reader.readAsDataURL(file);
            });
        }

        // ホーム画面のプレビュー処理
        ui.inputIcon.addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (file) {
                const dataUrl = await resizeImageAndGetDataUrl(file, 100, 100);
                myPlayerInfo.iconData = dataUrl;
                ui.iconPreviewImg.src = dataUrl;
                ui.iconPreviewImg.classList.remove('hidden');
                ui.iconPreviewText.classList.add('hidden');
            }
        });
        ui.inputName.addEventListener('input', (e) => {
            if(!myPlayerInfo.iconData) {
                const name = e.target.value.trim();
                ui.iconPreviewText.textContent = name ? name.charAt(0).toUpperCase() : '?';
            }
        });

        // --- UI操作 ---
        ui.btnGreenback.addEventListener('click', () => {
            if(ui.battleArea.classList.contains('bg-gray-800')) {
                ui.battleArea.classList.replace('bg-gray-800', 'bg-[#00FF00]');
            } else {
                ui.battleArea.classList.replace('bg-[#00FF00]', 'bg-gray-800');
            }
        });

        function switchView(view) {
            ui.lobbyUi.classList.add('hidden');
            ui.battleField.classList.add('hidden');
            ui.handUi.classList.add('hidden');
            ui.waitingUi.classList.add('hidden');

            if(view === 'lobby') {
                ui.lobbyUi.classList.remove('hidden');
            } else if (view === 'hand') {
                ui.battleField.classList.remove('hidden');
                ui.handUi.classList.remove('hidden');
            } else if (view === 'waiting') {
                ui.battleField.classList.remove('hidden');
                ui.waitingUi.classList.remove('hidden');
            }
        }

        // プレイヤー情報取得
        function preparePlayerInfo() {
            let name = ui.inputName.value.trim();
            if(!name) name = "PLAYER";
            myPlayerInfo.name = name;
        }

        function updatePlayerProfileUI(playerNum, info) {
            const nameEl = playerNum === 1 ? ui.p1Name : ui.p2Name;
            const iconTextEl = playerNum === 1 ? ui.p1IconText : ui.p2IconText;
            const iconContainer = playerNum === 1 ? document.getElementById('p1-icon') : document.getElementById('p2-icon');
            const imgEl = playerNum === 1 ? ui.p1IconImg : ui.p2IconImg;

            if (info) {
                nameEl.textContent = info.name;
                if (info.iconData) {
                    imgEl.src = info.iconData;
                    imgEl.className = "w-full h-full object-cover";
                    iconContainer.innerHTML = '';
                    iconContainer.appendChild(imgEl);
                } else {
                    iconContainer.innerHTML = '';
                    iconTextEl.textContent = info.name.charAt(0).toUpperCase();
                    iconContainer.appendChild(iconTextEl);
                }
            }
        }

        // --- ゲーム開始ロジック ---
        ui.btnCreate.addEventListener('click', async () => {
            if(!currentUser) return;
            preparePlayerInfo();
            const roomId = generateRoomId();
            isHost = true;
            currentRoomId = roomId;
            ui.roomIdText.textContent = roomId;
            ui.roomDisplay.classList.remove('hidden');

            const roomRef = doc(db, 'artifacts', appIdStr, 'public', 'data', 'rooms', roomId);
            await setDoc(roomRef, {
                hostId: currentUser.uid,
                guestId: null,
                p1Info: myPlayerInfo,
                p2Info: null,
                p1Hp: MAX_HP,
                p2Hp: MAX_HP,
                p1Card: null,
                p2Card: null,
                phase: 'waiting'
            });

            // 自分のラベル設定
            ui.p1Status.textContent = "YOU";
            ui.p2Status.textContent = "OPPONENT";
            ui.p1Status.classList.remove('opacity-0');
            ui.p2Status.classList.remove('opacity-0');

            startRoomListener(roomId);
            drawInitialHand();
            switchView('waiting');
        });

        ui.btnJoin.addEventListener('click', async () => {
            if(!currentUser) return;
            const roomId = ui.inputId.value.trim();
            if(!roomId) return;
            preparePlayerInfo();

            const roomRef = doc(db, 'artifacts', appIdStr, 'public', 'data', 'rooms', roomId);
            const docSnap = await getDoc(roomRef);
            
            if(docSnap.exists() && !docSnap.data().guestId) {
                isHost = false;
                currentRoomId = roomId;
                ui.roomIdText.textContent = roomId;
                ui.roomDisplay.classList.remove('hidden');

                // 自分のラベル設定
                ui.p1Status.textContent = "OPPONENT";
                ui.p2Status.textContent = "YOU";
                ui.p1Status.classList.remove('opacity-0');
                ui.p2Status.classList.remove('opacity-0');

                await updateDoc(roomRef, { 
                    guestId: currentUser.uid,
                    p2Info: myPlayerInfo
                });
                startRoomListener(roomId);
                drawInitialHand();
                switchView('hand');
            } else {
                alert("ルームが見つからないか、既に満員です");
            }
        });

        // --- リスナー ---
        function startRoomListener(roomId) {
            const roomRef = doc(db, 'artifacts', appIdStr, 'public', 'data', 'rooms', roomId);
            roomUnsubscribe = onSnapshot(roomRef, async (snapshot) => {
                const data = snapshot.data();
                if(!data) return;

                // プロフィール更新
                if(data.p1Info) updatePlayerProfileUI(1, data.p1Info);
                if(data.p2Info) updatePlayerProfileUI(2, data.p2Info);

                // ゲストが参加したらホストの画面を手札選択へ
                if(isHost && data.guestId && data.phase === 'waiting' && !isAnimating) {
                    if(ui.handUi.classList.contains('hidden') && ui.waitingUi.classList.contains('hidden') === false) {
                       switchView('hand');
                    }
                }

                if(!isAnimating) {
                    updateHpUI(data.p1Hp, data.p2Hp);
                    
                    // 相手がカードをセットしたら裏向きで表示
                    if (data.p1Card && !ui.p1Slot.innerHTML.includes('card-inner')) {
                        ui.p1Slot.innerHTML = createHiddenCardDOM();
                    }
                    if (data.p2Card && !ui.p2Slot.innerHTML.includes('card-inner')) {
                        ui.p2Slot.innerHTML = createHiddenCardDOM();
                    }
                }

                // 両者カードセット完了でバトルアニメーション開始
                if(data.p1Card && data.p2Card && data.phase === 'action' && !isAnimating) {
                    isAnimating = true;
                    switchView('waiting');
                    
                    await runBattleAnimation(data.p1Card, data.p2Card, data.p1Hp, data.p2Hp);
                    
                    isAnimating = false;
                    
                    if(data.p1Hp <= 0 || data.p2Hp <= 0) {
                        showResult(data.p1Hp, data.p2Hp);
                        return;
                    }

                    if(isHost) {
                        await updateDoc(roomRef, { p1Card: null, p2Card: null, phase: 'waiting' });
                    }
                    
                    ui.p1Slot.innerHTML = '';
                    ui.p2Slot.innerHTML = '';
                    switchView('hand');
                }
            }, (error) => { console.error("Snapshot error:", error); });
        }

        // --- 手札と選択ロジック ---
        function drawInitialHand() {
            myHand = [getRandomCard(), getRandomCard(), getRandomCard()];
            renderHand();
        }

        function renderHand() {
            ui.handCards.innerHTML = '';
            selectedCardIndex = null;
            updateConfirmButton();

            myHand.forEach((card, index) => {
                const el = ELEMENTS.find(e => e.id === card.element);
                const div = document.createElement('div');
                div.className = `hand-card element-${card.element}`;
                div.innerHTML = `
                    <div class="text-2xl mb-1">${el.icon}</div>
                    <div class="text-3xl font-black text-gray-800">${card.power}</div>
                `;
                div.onclick = () => {
                    document.querySelectorAll('.hand-card').forEach(c => c.classList.remove('selected'));
                    div.classList.add('selected');
                    selectedCardIndex = index;
                    updateConfirmButton();
                };
                ui.handCards.appendChild(div);
            });
        }

        function updateConfirmButton() {
            if(selectedCardIndex !== null) {
                ui.btnConfirm.disabled = false;
                // 有効時のデザイン
                ui.btnConfirm.className = "w-full max-w-sm bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 rounded-lg shadow-[0_0_15px_rgba(59,130,246,0.5)] cursor-pointer text-sm tracking-widest border border-blue-400";
                ui.btnConfirm.textContent = "CONFIRM SET";
            } else {
                ui.btnConfirm.disabled = true;
                // 無効時のデザイン
                ui.btnConfirm.className = "w-full max-w-sm bg-gray-800 text-gray-500 font-bold py-3 rounded-lg shadow-inner cursor-not-allowed transition-all duration-200 text-sm border border-gray-700 tracking-widest";
                ui.btnConfirm.textContent = "SELECT A CARD";
            }
        }

        ui.btnConfirm.addEventListener('click', async () => {
            if(selectedCardIndex === null || isAnimating) return;
            
            const selectedCard = myHand[selectedCardIndex];
            myHand[selectedCardIndex] = getRandomCard(); // 補充
            
            // 自分のスロットに裏向きカードを即座に表示
            if(isHost) {
                ui.p1Slot.innerHTML = createHiddenCardDOM();
            } else {
                ui.p2Slot.innerHTML = createHiddenCardDOM();
            }

            switchView('waiting');
            ui.btnConfirm.textContent = "SET COMPLETED";
            
            const roomRef = doc(db, 'artifacts', appIdStr, 'public', 'data', 'rooms', currentRoomId);
            const updateData = isHost ? { p1Card: selectedCard } : { p2Card: selectedCard };
            await updateDoc(roomRef, updateData);
            
            const snap = await getDoc(roomRef);
            const data = snap.data();
            if(data.p1Card && data.p2Card) {
                await updateDoc(roomRef, { phase: 'action' });
            }
        });

        // --- アニメーション ---
        function checkAdvantage(e1, e2) {
            if(e1 === 'FIRE' && e2 === 'THUNDER') return 1;
            if(e1 === 'THUNDER' && e2 === 'WATER') return 1;
            if(e1 === 'WATER' && e2 === 'FIRE') return 1;
            if(e1 === e2) return 0;
            return -1;
        }

        function createHiddenCardDOM() {
            return `
                <div class="card-inner">
                    <div class="card-back flex items-center justify-center">
                        <div class="text-gray-600 font-bold text-xs opacity-50 tracking-widest rotate-[-45deg]">SET</div>
                    </div>
                </div>
            `;
        }

        function createCardDOM(cardData) {
            const el = ELEMENTS.find(e => e.id === cardData.element);
            return `
                <div class="card-inner">
                    <div class="card-back flex items-center justify-center">
                        <div class="text-gray-600 font-bold text-xs opacity-50 tracking-widest rotate-[-45deg]">SET</div>
                    </div>
                    <div class="card-front element-${cardData.element}">
                        <div class="text-2xl mb-1">${el.icon}</div>
                        <div class="text-4xl font-black text-gray-800 power-val leading-none">${cardData.power}</div>
                    </div>
                </div>
            `;
        }

        async function runBattleAnimation(p1Card, p2Card, currentP1Hp, currentP2Hp) {
            // DOM更新と同時に中身を表のデータに差し替え（最初は裏向きクラス）
            ui.p1Slot.innerHTML = createCardDOM(p1Card);
            ui.p2Slot.innerHTML = createCardDOM(p2Card);
            
            // Reflow強制して初期状態を確定させる
            ui.p1Slot.offsetWidth; 
            
            await sleep(500);
            
            // クルッとオープン
            ui.p1Slot.querySelector('.card-inner').classList.add('is-flipped');
            ui.p2Slot.querySelector('.card-inner').classList.add('is-flipped');
            
            await sleep(1000);

            const adv = checkAdvantage(p1Card.element, p2Card.element);
            let p1FinalPower = p1Card.power;
            let p2FinalPower = p2Card.power;

            if (adv === 1) {
                p1FinalPower += 3;
                await playBuffEffect('p1-slot', p1FinalPower, p1Card.element);
            } else if (adv === -1) {
                p2FinalPower += 3;
                await playBuffEffect('p2-slot', p2FinalPower, p2Card.element);
            }

            await sleep(800);

            let p1NewHp = currentP1Hp;
            let p2NewHp = currentP2Hp;

            if (p1FinalPower > p2FinalPower) {
                const dmg = p1FinalPower - p2FinalPower;
                await playAttackEffect('p1-slot', 'p2-slot', p1Card.element, dmg);
                await playDamageToHpEffect('p2-slot', 'p2-hp-box');
                p2NewHp = Math.max(0, currentP2Hp - p1FinalPower);
                ui.p2HpBox.classList.add('shake');
                setTimeout(() => ui.p2HpBox.classList.remove('shake'), 400);
            } else if (p2FinalPower > p1FinalPower) {
                const dmg = p2FinalPower - p1FinalPower;
                await playAttackEffect('p2-slot', 'p1-slot', p2Card.element, dmg);
                await playDamageToHpEffect('p1-slot', 'p1-hp-box');
                p1NewHp = Math.max(0, currentP1Hp - p2FinalPower);
                ui.p1HpBox.classList.add('shake');
                setTimeout(() => ui.p1HpBox.classList.remove('shake'), 400);
            } else {
                const drawText = document.createElement('div');
                drawText.className = "absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 text-2xl font-black text-gray-400 z-50 shadow-black text-shadow";
                drawText.textContent = "DRAW";
                ui.battleField.appendChild(drawText);
                await sleep(1000);
                drawText.remove();
            }

            updateHpUI(p1NewHp, p2NewHp);
            
            if (isHost) {
                const roomRef = doc(db, 'artifacts', appIdStr, 'public', 'data', 'rooms', currentRoomId);
                await updateDoc(roomRef, { p1Hp: p1NewHp, p2Hp: p2NewHp });
            }

            await sleep(1500);
        }

        // --- エフェクト関数 (スマホ座標対応強化版) ---
        async function playBuffEffect(slotId, newPower, element) {
            const slot = document.getElementById(slotId);
            const front = slot.querySelector('.card-front');
            const elData = ELEMENTS.find(e => e.id === element);
            
            front.style.color = elData.color;
            front.classList.add('glow-buff');
            
            const rect = slot.getBoundingClientRect();
            const containerRect = ui.effectContainer.getBoundingClientRect();
            const pop = document.createElement('div');
            pop.className = `popup-text text-${element}`;
            pop.textContent = '+3';
            pop.style.left = `${rect.left - containerRect.left + rect.width/2 - 15}px`;
            pop.style.top = `${rect.top - containerRect.top}px`;
            ui.effectContainer.appendChild(pop);
            
            setTimeout(() => {
                slot.querySelector('.power-val').textContent = newPower;
                slot.querySelector('.power-val').style.color = elData.color;
            }, 500);

            await sleep(1500);
            pop.remove();
        }

        function playAttackEffect(startId, endId, element, damageDiff) {
            return new Promise(resolve => {
                const startEl = document.getElementById(startId);
                const endEl = document.getElementById(endId);
                const elData = ELEMENTS.find(e => e.id === element);
                
                // DOM描画待ちと絶対座標の取得
                requestAnimationFrame(() => {
                    const sRect = startEl.getBoundingClientRect();
                    const eRect = endEl.getBoundingClientRect();
                    const cRect = ui.effectContainer.getBoundingClientRect();
                    
                    const startX = sRect.left + sRect.width/2 - cRect.left;
                    const startY = sRect.top + sRect.height/2 - cRect.top;
                    const endX = eRect.left + eRect.width/2 - cRect.left;
                    const endY = eRect.top + eRect.height/2 - cRect.top;
                    
                    // ダメージ差によるエフェクトの変化
                    let size = 20;
                    if(damageDiff >= 3 && damageDiff <= 5) size = 30;
                    if(damageDiff >= 6) size = 50;

                    const projectile = document.createElement('div');
                    projectile.className = 'projectile';
                    projectile.style.backgroundColor = elData.color;
                    projectile.style.width = `${size}px`;
                    projectile.style.height = `${size}px`;
                    projectile.style.marginLeft = `-${size/2}px`;
                    projectile.style.marginTop = `-${size/2}px`;
                    projectile.style.boxShadow = `0 0 ${size}px ${size/2}px ${elData.color}`;
                    
                    // 初期位置セット
                    projectile.style.left = `${startX}px`;
                    projectile.style.top = `${startY}px`;
                    
                    ui.effectContainer.appendChild(projectile);
                    
                    // 強制Reflow（スマホでのアニメーション適用に必須）
                    projectile.offsetHeight;
                    
                    // 終点へ移動
                    projectile.style.transform = `translate(${endX - startX}px, ${endY - startY}px)`;
                    
                    setTimeout(() => {
                        projectile.remove();
                        createExplosion(endX, endY, elData.color, damageDiff);
                        endEl.querySelector('.card-front').classList.add('shake');
                        setTimeout(() => endEl.querySelector('.card-front').classList.remove('shake'), 400);
                        resolve();
                    }, 400);
                });
            });
        }

        function createExplosion(x, y, color, damageDiff) {
            let pCount = 8;
            let distMult = 1;
            if(damageDiff >= 3) { pCount = 12; distMult = 1.5; }
            if(damageDiff >= 6) { pCount = 20; distMult = 3.0; } // 大技

            for(let i=0; i<pCount; i++) {
                const p = document.createElement('div');
                p.className = 'particle';
                p.style.backgroundColor = color;
                const pSize = 6 + Math.random()*6;
                p.style.width = `${pSize}px`; p.style.height = `${pSize}px`;
                p.style.left = `${x - pSize/2}px`; p.style.top = `${y - pSize/2}px`;
                ui.effectContainer.appendChild(p);
                
                const angle = (Math.PI * 2 / pCount) * i;
                const dist = (40 + Math.random()*30) * distMult;
                const tx = Math.cos(angle) * dist;
                const ty = Math.sin(angle) * dist;
                
                p.animate([
                    { transform: 'translate(0,0) scale(1)', opacity: 1 },
                    { transform: `translate(${tx}px, ${ty}px) scale(0)`, opacity: 0 }
                ], { duration: 400 + Math.random()*200, easing: 'ease-out' });
                
                setTimeout(() => p.remove(), 600);
            }
        }

        function playDamageToHpEffect(cardId, hpBoxId) {
            return new Promise(resolve => {
                requestAnimationFrame(() => {
                    const startEl = document.getElementById(cardId);
                    const endEl = document.getElementById(hpBoxId);
                    
                    const sRect = startEl.getBoundingClientRect();
                    const eRect = endEl.getBoundingClientRect();
                    const cRect = ui.effectContainer.getBoundingClientRect();
                    
                    const startX = sRect.left + sRect.width/2 - cRect.left;
                    const startY = sRect.top + sRect.height/2 - cRect.top;
                    const endX = eRect.left + eRect.width/2 - cRect.left;
                    const endY = eRect.top + eRect.height/2 - cRect.top;
                    
                    const orb = document.createElement('div');
                    orb.className = 'damage-orb';
                    orb.style.left = `${startX}px`;
                    orb.style.top = `${startY}px`;
                    ui.effectContainer.appendChild(orb);
                    
                    orb.offsetHeight;
                    orb.style.transform = `translate(${endX - startX}px, ${endY - startY}px)`;
                    
                    setTimeout(() => {
                        orb.remove();
                        resolve();
                    }, 600);
                });
            });
        }

        // --- HP更新と結果 ---
        function updateHpUI(p1Hp, p2Hp) {
            const p1Pct = Math.max(0, (p1Hp / MAX_HP) * 100);
            const p2Pct = Math.max(0, (p2Hp / MAX_HP) * 100);
            
            ui.p1HpBar.style.width = `${p1Pct}%`;
            ui.p2HpBar.style.width = `${p2Pct}%`;
            ui.p1HpText.textContent = Math.max(0, p1Hp);
            ui.p2HpText.textContent = Math.max(0, p2Hp);

            [ui.p1HpBar, ui.p2HpBar].forEach((bar, idx) => {
                const pct = idx === 0 ? p1Pct : p2Pct;
                if(pct > 50) bar.className = "hp-bar-transition w-full h-full bg-gradient-to-r from-green-600 to-green-400";
                else if(pct > 20) bar.className = "hp-bar-transition w-full h-full bg-gradient-to-r from-yellow-600 to-yellow-400";
                else bar.className = "hp-bar-transition w-full h-full bg-gradient-to-r from-red-600 to-red-400 animate-pulse";
            });
        }

        function showResult(p1Hp, p2Hp) {
            ui.resultMessage.classList.remove('hidden');
            let isWin = false;
            
            if (isHost) {
                isWin = p1Hp > 0;
            } else {
                isWin = p2Hp > 0;
            }

            setTimeout(() => {
                ui.resultMessage.classList.remove('opacity-0');
                if(isWin) {
                    ui.resultMain.textContent = "WIN!";
                    ui.resultMain.className = "text-5xl font-black text-yellow-400 drop-shadow-[0_0_20px_rgba(250,204,21,0.8)]";
                    ui.resultSub.textContent = "見事な勝利！";
                } else {
                    ui.resultMain.textContent = "LOSE...";
                    ui.resultMain.className = "text-5xl font-black text-blue-400 drop-shadow-[0_0_20px_rgba(96,165,250,0.8)]";
                    ui.resultSub.textContent = "残念...";
                }
            }, 100);
        }

        initAuth();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DORA-PARLOR ポータル</title>
    <style>
        /* 画面全体に隙間なくiframeをフィットさせる設定 */
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            background-color: #000;
            overflow: hidden;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            margin: 0;
            padding: 0;
            display: block;
        }
    </style>
</head>
<body>

    <!-- 初期状態ではホールアプリを読み込みます -->
    <iframe id="appFrame" src="PachinkoParlor.html" allow="autoplay"></iframe>

    <script>
        const frame = document.getElementById('appFrame');

        // 【最重要】親画面で1つだけAudioContextを初期化して使い回す
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        const globalAudioCtx = AudioContextClass ? new AudioContextClass() : null;

        window.addEventListener('message', (event) => {
            if (!event.data || typeof event.data !== 'object') return;

            const { type, machineId, url } = event.data;

            // 1. ホールから台へ着席するとき
            if (type === 'SIT_DOWN') {
                if (globalAudioCtx) {
                    // タップされた瞬間の権利でオーディオ空間をアクティブにする
                    globalAudioCtx.resume().then(() => {
                        console.log('[Portal] 台着席時のオーディオ空間アクティブ化成功');
                        const targetSkin = machineId ? machineId : 'default';
                        frame.src = `PachinkoMachine.html?machine=${targetSkin}`;
                    }).catch(err => {
                        frame.src = `PachinkoMachine.html?machine=${machineId || 'default'}`;
                    });
                } else {
                    frame.src = `PachinkoMachine.html?machine=${machineId || 'default'}`;
                }
            }

            // 2. 台からホールに戻るとき
            if (type === 'RETURN_HALL') {
                console.log('[Portal] ホールへ戻る処理を開始します');
                
                if (globalAudioCtx) {
                    // プレイ台で「戻る」をタップした瞬間の権利を使い、親画面のオーディオ空間を再アクティブ化
                    globalAudioCtx.resume().then(() => {
                        console.log('[Portal] ホール帰還時のオーディオ空間アクティブ化成功');
                        frame.src = 'PachinkoParlor.html';
                    }).catch(err => {
                        console.error('[Portal] 再アクティブ化失敗:', err);
                        frame.src = 'PachinkoParlor.html';
                    });
                } else {
                    frame.src = 'PachinkoParlor.html';
                }
            }

            // 3. ポータルトップや大金庫など外部ページへ抜けるとき（構文位置をイベント内に修正）
            if (type === 'NAVIGATE_TOP' && url) {
                window.top.location.href = url;
            }
        });
    </script>
</body>
</html>

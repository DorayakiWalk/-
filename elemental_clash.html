<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Elemental Clash - Streamer Card Game</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; touch-action: manipulation; }
        @keyframes earthQuake { 0%, 100% { transform: translate(0, 0); } 20%, 60% { transform: translate(-8px, -8px); } 40%, 80% { transform: translate(8px, 8px); } }
        .earthquake { animation: earthQuake 0.4s ease-out; }
        @keyframes flash { 0%, 100% { opacity: 0; } 50% { opacity: 0.8; } }
        .flash-bang { position: fixed; inset: 0; background: white; pointer-events: none; z-index: 9999; animation: flash 0.3s ease-out forwards; }
        .card-container { perspective: 1000px; width: 48px; height: 68px; }
        .card-inner { position: relative; width: 100%; height: 100%; text-align: center; transition: transform 0.6s; transform-style: preserve-3d; }
        .card-inner.is-flipped { transform: rotateY(180deg); }
        .card-front, .card-back { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; border-radius: 0.3rem; box-shadow: 0 4px 8px rgba(0,0,0,0.5); display: flex; flex-direction: column; justify-content: center; align-items: center; }
        .card-back { background: linear-gradient(135deg, #1f2937, #111827); border: 1px solid #4b5563; }
        .card-front { transform: rotateY(180deg); background: #ffffff; color: #111827; }
        .hand-card { position: relative; width: 56px; height: 80px; background: white; border-radius: 0.3rem; display: flex; flex-direction: column; justify-content: center; align-items: center; cursor: pointer; transition: all 0.2s; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        .hand-card.selected { transform: translateY(-8px); box-shadow: 0 0 15px rgba(255, 255, 255, 0.8); border: 2px solid white; }
        .element-FIRE { border: 3px solid #ef4444; } .element-THUNDER { border: 3px solid #eab308; } .element-WATER { border: 3px solid #3b82f6; }
        @keyframes glowBuff { 0%, 100% { box-shadow: 0 0 5px currentColor; transform: scale(1); } 50% { box-shadow: 0 0 20px 10px currentColor; transform: scale(1.1); } }
        .glow-buff { animation: glowBuff 0.8s ease-in-out; }
        @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-5px) rotate(-5deg); } 75% { transform: translateX(5px) rotate(5deg); } }
        .shake { animation: shake 0.4s; border-color: red !important; }
        .app-container { height: 100dvh; display: flex; flex-direction: column; overflow: hidden; background-color: #111827; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #1f2937; border-radius: 4px; }
        ::-webkit-scrollbar-thumb { background: #4b5563; border-radius: 4px; }
    </style>
</head>

                🏆 <span class="hidden sm:inline">ランキング</span>

            <button id="btn-share-app" class="bg-gray-800/80 hover:bg-gray-700 text-white p-2.5 rounded-full border border-gray-600 shadow-lg backdrop-blur-sm transition-colors" title="アプリを共有">

            </div>
        </div>
    </div>

        class PopUpText { constructor(x, y, text, color, scale = 1) { this.x = x; this.y = y; this.text = text; this.color = color; this.scaleBase = scale; this.startTime = performance.now(); this.isDead = false; } update(time) { this.p = (time - this.startTime) / 1200; if(this.p >= 1) this.isDead = true; } draw(ctx) { let a = 1, dy = -30 * this.p, s = this.scaleBase * (this.p < 0.2 ? 0.5 + 2.5*this.p : (this.p > 0.8 ? 1 - (this.p-0.8)*5 : 1)); if (this.p > 0.8) a = 1 - (this.p - 0.8)*5; ctx.save(); ctx.globalAlpha = a; ctx.translate(this.x, this.y + dy); ctx.scale(s, s); ctx.font = "900 36px sans-serif"; ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.lineWidth = 5; ctx.strokeStyle = '#000'; ctx.strokeText(this.text, 0, 0); ctx.fillStyle = this.color; ctx.shadowColor = this.color; ctx.shadowBlur = 15; ctx.fillText(this.text, 0, 0); ctx.restore(); } }
        class FlashBang { constructor() { this.startTime = performance.now(); this.isDead = false; } update(t) { this.p = (t - this.startTime) / 300; if (this.p >= 1) this.isDead = true; } draw(ctx) { ctx.save(); ctx.fillStyle = `rgba(255,255,255,${this.p < 0.5 ? this.p*2 : 1 - (this.p-0.5)*2})`; ctx.fillRect(0,0,canvas.width,canvas.height); ctx.restore(); } }
        class Projectile { constructor(sx, sy, ex, ey, el, onDone) { this.sx = sx; this.sy = sy; this.ex = ex; this.ey = ey; this.el = el; this.onDone = onDone; this.st = performance.now(); this.isDead = false; this.ang = Math.atan2(ey-sy, ex-sx); } update(t) { this.p = (t - this.st) / 400; this.p *= this.p; if(this.p >= 1) { this.p=1; this.isDead=true; this.onDone(); } this.x = this.sx + (this.ex-this.sx)*this.p; this.y = this.sy + (this.ey-this.sy)*this.p; } draw(ctx) { ctx.save(); ctx.translate(this.x, this.y); ctx.fillStyle = this.el.color; ctx.shadowColor = this.el.shadow; ctx.shadowBlur = 30; if (this.el.id === 'FIRE') { ctx.beginPath(); ctx.arc(0,0,30,0,Math.PI*2); ctx.fill(); } else if (this.el.id === 'WATER') { ctx.rotate(this.ang); ctx.beginPath(); ctx.arc(0,0,20,Math.PI/2,Math.PI*1.5); ctx.lineTo(35,0); ctx.closePath(); ctx.fill(); } ctx.restore(); } }
        class Lightning { constructor(sx, sy, ex, ey, onDone) { this.st = performance.now(); this.isDead = false; this.onDone = onDone; this.pts = [{x:sx,y:sy}]; for(let i=1;i<10;i++) this.pts.push({x:sx+(ex-sx)*i/10+(Math.random()-0.5)*60, y:sy+(ey-sy)*i/10+(Math.random()-0.5)*60}); this.pts.push({x:ex,y:ey}); } update(t) { if(t-this.st > 300) { this.isDead = true; this.onDone(); } } draw(ctx) { let a = 1 - (performance.now()-this.st)/300; ctx.save(); ctx.globalAlpha = a; ctx.beginPath(); ctx.moveTo(this.pts[0].x, this.pts[0].y); for(let i=1;i<this.pts.length;i++) ctx.lineTo(this.pts[i].x, this.pts[i].y); ctx.strokeStyle='#fff'; ctx.lineWidth=8; ctx.stroke(); ctx.strokeStyle='#fef08a'; ctx.lineWidth=16; ctx.shadowColor='#eab308'; ctx.shadowBlur=30; ctx.stroke(); ctx.restore(); } }
        class Particle { constructor(x, y, el) { this.sx = x; this.sy = y; this.el = el; this.st = performance.now(); this.isDead = false; let a = Math.random()*Math.PI*2, d = 40+Math.random()*60; this.sz = 5+Math.random()*10; if(el.id==='FIRE'){ this.vx=Math.cos(a)*d*0.8; this.vy=-Math.abs(Math.sin(a)*d)-20; this.dur=600;} else if(el.id==='WATER'){ this.vx=Math.cos(a)*d*0.8; this.vy=Math.abs(Math.sin(a)*d)+20; this.dur=600;} else { this.vx=Math.cos(a)*d*1.5; this.vy=Math.sin(a)*d*1.5; this.dur=300;} } update(t) { this.p = (t - this.st) / this.dur; if(this.p>=1){this.p=1; this.isDead=true;} this.x=this.sx+this.vx*(this.el.id==='THUNDER'?this.p:1-(1-this.p)*(1-this.p)); this.y=this.sy+this.vy*(this.el.id==='THUNDER'?this.p:1-(1-this.p)*(1-this.p)); } draw(ctx) { ctx.save(); ctx.globalAlpha = 1-this.p; ctx.translate(this.x, this.y); ctx.fillStyle=this.el.color; ctx.shadowColor=this.el.shadow; ctx.shadowBlur=10; ctx.beginPath(); ctx.arc(0,0,this.sz,0,Math.PI*2); ctx.fill(); ctx.restore(); } }

                if(d.p1Cards && d.p2Cards && d.phase === 'action' && !isAnimating) {

        // --- 勝負結果のランキング登録 (ホストのみ実行) ---
        async function updateRanking(p1Hp, p2Hp) {
            if(!currentRoomData || !currentRoomData.guestId) return;
            const rankRef = doc(db, 'artifacts', appIdStr, 'public', 'data', 'global', RANKING_DOC);
            const snap = await getDoc(rankRef);
            let players = snap.exists() ? (snap.data().players || {}) : {};
            
            // P1 (Host)
            let hId = currentRoomData.hostId;
            if(!players[hId]) players[hId] = { wins: 0, matches: 0 };
            players[hId].name = currentRoomData.p1Info.name; players[hId].icon = currentRoomData.p1Info.iconData;
            players[hId].matches++; if(p1Hp > 0) players[hId].wins++;
            
            // P2 (Guest)
            let gId = currentRoomData.guestId;
            if(!players[gId]) players[gId] = { wins: 0, matches: 0 };
            players[gId].name = currentRoomData.p2Info.name; players[gId].icon = currentRoomData.p2Info.iconData;
            players[gId].matches++; if(p2Hp > 0) players[gId].wins++;
            
            await setDoc(rankRef, { players: players }, { merge: true });
        }

        function drawHand() { myHand = [rndCard(), rndCard(), rndCard(), rndCard(), rndCard()]; selectedIndices = []; renderHand(); }
        function renderHand() {
            ui.handCards.innerHTML = '';
            myHand.forEach((c, i) => {
                const el = ELEMENTS.find(e => e.id === c.element); const d = document.createElement('div');
                d.className = `hand-card element-${c.element}`; let idx = selectedIndices.indexOf(i);
                d.innerHTML = `<div class="text-2xl leading-none mb-1">${el.icon}</div><div class="text-3xl font-black text-gray-900 leading-none">${c.power}</div>`;
                if(idx !== -1) { d.classList.add('selected'); d.innerHTML += `<div class="absolute -top-2 -right-2 bg-red-600 text-white font-black rounded-full w-6 h-6 flex items-center justify-center text-xs shadow-lg border-2 border-white z-10">${idx + 1}</div>`; }
                d.onclick = () => { playSound('click'); if(idx !== -1) selectedIndices.splice(idx,1); else if(selectedIndices.length<3) selectedIndices.push(i); renderHand(); };
                ui.handCards.appendChild(d);
            });
            if(selectedIndices.length === 3) { ui.btnConfirm.disabled = false; ui.btnConfirm.className = "w-full max-w-sm bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 rounded-lg shadow-[0_0_15px_rgba(59,130,246,0.8)] transition-all tracking-widest"; ui.btnConfirm.textContent = "CONFIRM 3 CARDS"; }
            else { ui.btnConfirm.disabled = true; ui.btnConfirm.className = "w-full max-w-sm bg-gray-800 text-gray-500 font-bold py-3 rounded-lg cursor-not-allowed tracking-widest"; ui.btnConfirm.textContent = `SELECT CARDS (${selectedIndices.length}/3)`; }
        }

        ui.btnConfirm.addEventListener('click', async () => {
            playSound('click'); if(selectedIndices.length !== 3 || isAnimating) return;
            const sCards = selectedIndices.map(i => myHand[i]);
            for(let i=0;i<3;i++) (isHost?ui.p1Slots:ui.p2Slots)[i].innerHTML = `<div class="card-inner"><div class="card-back flex justify-center items-center"><span class="text-gray-500 opacity-50 text-[10px] font-bold rotate-[-45deg] tracking-widest">SET</span></div></div>`;
            showWaiting(true); ui.btnConfirm.textContent = "SET COMPLETED";
            const ref = doc(db, 'artifacts', appIdStr, 'public', 'data', ROOM_COL, currentRoomId);
            await updateDoc(ref, isHost ? { p1Cards: sCards } : { p2Cards: sCards });
            if((await getDoc(ref)).data().p1Cards && (await getDoc(ref)).data().p2Cards) await updateDoc(ref, { phase: 'action' });
        });

        ui.btnRestart.addEventListener('click', async () => {
            playSound('click'); if (!isHost) return; ui.btnRestart.classList.add('hidden');
            await updateDoc(doc(db, 'artifacts', appIdStr, 'public', 'data', ROOM_COL, currentRoomId), { p1Hp: MAX_HP, p2Hp: MAX_HP, p1Cards: null, p2Cards: null, phase: 'waiting' });
        });

        async function runBattle(c1A, c2A, hp1, hp2) {
            let p1Tot = 0, p2Tot = 0, m1=c1A[0], m2=c2A[0];
            const mk = c => { const e=ELEMENTS.find(x=>x.id===c.element); return `<div class="card-inner"><div class="card-back flex justify-center items-center"><span class="text-gray-500 opacity-50 text-[10px] font-bold rotate-[-45deg] tracking-widest">SET</span></div><div class="card-front element-${c.element}"><div class="text-xl mb-1">${e.icon}</div><div class="text-2xl font-black text-gray-900 power-val">${c.power}</div></div></div>`; };
            for(let i=0;i<3;i++){ ui.p1Slots[i].innerHTML=mk(c1A[i]); ui.p2Slots[i].innerHTML=mk(c2A[i]); }
            ui.p1Slots[0].offsetWidth; await sleep(300);

            for(let i=0; i<3; i++) {
                playSound('cardFlip'); ui.p1Slots[i].querySelector('.card-inner').classList.add('is-flipped'); ui.p2Slots[i].querySelector('.card-inner').classList.add('is-flipped'); await sleep(500);
                let adv = (c1A[i].element==='FIRE'&&c2A[i].element==='THUNDER')||(c1A[i].element==='THUNDER'&&c2A[i].element==='WATER')||(c1A[i].element==='WATER'&&c2A[i].element==='FIRE')?1:(c1A[i].element===c2A[i].element?0:-1);
                let p1=c1A[i].power, p2=c2A[i].power;
                const buff = async (sl, pw, el) => { playSound('buff'); const f=sl.querySelector('.card-front'); const ed=ELEMENTS.find(e=>e.id===el); f.style.color=ed.color; f.classList.add('glow-buff'); const r=sl.getBoundingClientRect(), c=canvas.getBoundingClientRect(); activeEffects.push(new PopUpText(r.left-c.left+r.width/2, r.top-c.top-10, '+3', ed.color, 0.7)); setTimeout(()=>{f.querySelector('.power-val').textContent=pw;f.querySelector('.power-val').style.color=ed.color;},200); await sleep(600); };
                if (adv===1) { p1+=3; await buff(ui.p1Slots[i], p1, c1A[i].element); } else if (adv===-1) { p2+=3; await buff(ui.p2Slots[i], p2, c2A[i].element); }
                p1Tot+=p1; p2Tot+=p2; if(p1>m1.power) m1={element:c1A[i].element,power:p1}; if(p2>m2.power) m2={element:c2A[i].element,power:p2};
                ui.p1Total.textContent=p1Tot; ui.p2Total.textContent=p2Tot; await sleep(300);
            }
            await sleep(500);

            const atk = (sId, eId, el) => new Promise(res => {
                playSound(el === 'THUNDER' ? 'magicThunder' : 'magicFire');
                const s = document.getElementById(sId).getBoundingClientRect(), e = document.getElementById(eId).getBoundingClientRect(), c = canvas.getBoundingClientRect();
                const sx=s.left+s.width/2-c.left, sy=s.top+s.height/2-c.top, ex=e.left+e.width/2-c.left, ey=e.top+e.height/2-c.top;
                const ed=ELEMENTS.find(x=>x.id===el); activeEffects.push(new FlashBang());
                const onHit = () => { document.body.classList.add('earthquake'); setTimeout(()=>document.body.classList.remove('earthquake'), 400); for(let i=0;i<30;i++) activeEffects.push(new Particle(ex, ey, ed)); res(); };
                if(el==='THUNDER') activeEffects.push(new Lightning(sx,sy,ex,ey,onHit)); else activeEffects.push(new Projectile(sx,sy,ex,ey,ed,onHit));
            });

            if (p1Tot !== p2Tot) {
                let p1Win = p1Tot > p2Tot; let diff = Math.abs(p1Tot - p2Tot);
                await atk(p1Win?'p1-slot-1':'p2-slot-1', p1Win?'p2-slot-1':'p1-slot-1', p1Win?m1.element:m2.element);
                const hb = document.getElementById(p1Win?'p2-hp-box':'p1-hp-box'); hb.classList.add('shake'); setTimeout(()=>hb.classList.remove('shake'), 400);
                const r=hb.getBoundingClientRect(), c=canvas.getBoundingClientRect(); activeEffects.push(new PopUpText(r.left-c.left+r.width/2, r.top-c.top-20, `-${diff}`, '#ef4444', 1.5));
                if(p1Win) hp2=Math.max(0,hp2-diff); else hp1=Math.max(0,hp1-diff);
            } else { const c=canvas.getBoundingClientRect(); activeEffects.push(new PopUpText(c.width/2, c.height/2, 'DRAW!', '#9ca3af', 1.5)); }

            updateHpUI(hp1, hp2);
            if (isHost) await updateDoc(doc(db, 'artifacts', appIdStr, 'public', 'data', ROOM_COL, currentRoomId), { p1Hp: hp1, p2Hp: hp2 });
            await sleep(1500);
        }

        function updateHpUI(hp1, hp2) {
            const p1 = Math.max(0, (hp1 / MAX_HP) * 100), p2 = Math.max(0, (hp2 / MAX_HP) * 100);
            ui.p1HpBar.style.width = `${p1}%`; ui.p2HpBar.style.width = `${p2}%`;
            [ui.p1HpBar, ui.p2HpBar].forEach((b, i) => {
                const pt = i === 0 ? p1 : p2;
                b.className = pt > 50 ? "transition-all duration-300 w-full h-full bg-gradient-to-r from-blue-600 to-cyan-400 shadow-inner" :
                             pt > 20 ? "transition-all duration-300 w-full h-full bg-gradient-to-r from-yellow-500 to-yellow-300 shadow-inner" :
                                       "transition-all duration-300 w-full h-full bg-gradient-to-r from-red-600 to-red-400 animate-pulse shadow-inner";
            });
        }

        initAuth();
    </script>
</body>
</html>

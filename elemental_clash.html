<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Elemental Clash - Streamer Card Game</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; touch-action: manipulation; }
        
        /* 画面シェイク＆フラッシュ */
        @keyframes earthQuake {
            0%, 100% { transform: translate(0, 0); }
            20%, 60% { transform: translate(-8px, -8px); }
            40%, 80% { transform: translate(8px, 8px); }
        }
        .earthquake { animation: earthQuake 0.4s ease-out; }
        @keyframes flash { 0%, 100% { opacity: 0; } 50% { opacity: 0.8; } }
        .flash-bang { position: fixed; inset: 0; background: white; pointer-events: none; z-index: 9999; animation: flash 0.3s ease-out forwards; }

        /* 3Dカード */
        .card-container { perspective: 1000px; width: 48px; height: 68px; }
        .card-inner { position: relative; width: 100%; height: 100%; text-align: center; transition: transform 0.6s; transform-style: preserve-3d; }
        .card-inner.is-flipped { transform: rotateY(180deg); }
        .card-front, .card-back { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; border-radius: 0.3rem; box-shadow: 0 4px 8px rgba(0,0,0,0.5); display: flex; flex-direction: column; justify-content: center; align-items: center; }
        .card-back { background: linear-gradient(135deg, #1f2937, #111827); border: 1px solid #4b5563; }
        .card-front { transform: rotateY(180deg); background: #ffffff; color: #111827; }
        
        /* 手札 */
        .hand-card { position: relative; width: 56px; height: 80px; background: white; border-radius: 0.3rem; display: flex; flex-direction: column; justify-content: center; align-items: center; cursor: pointer; transition: all 0.2s; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        .hand-card.selected { transform: translateY(-8px); box-shadow: 0 0 15px rgba(255, 255, 255, 0.8); border: 2px solid white; }

        /* 属性色 */
        .element-FIRE { border: 3px solid #ef4444; }
        .element-THUNDER { border: 3px solid #eab308; }
        .element-WATER { border: 3px solid #3b82f6; }

        /* 発光・揺れ */
        @keyframes glowBuff { 0%, 100% { box-shadow: 0 0 5px currentColor; transform: scale(1); } 50% { box-shadow: 0 0 20px 10px currentColor; transform: scale(1.1); } }
        .glow-buff { animation: glowBuff 0.8s ease-in-out; }
        @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-5px) rotate(-5deg); } 75% { transform: translateX(5px) rotate(5deg); } }
        .shake { animation: shake 0.4s; border-color: red !important; }

        .app-container { height: 100dvh; display: flex; flex-direction: column; overflow: hidden; background-color: #111827; }
        
        /* カスタムスクロールバー */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #1f2937; }
        ::-webkit-scrollbar-thumb { background: #4b5563; border-radius: 3px; }
    </style>
</head>
<body class="text-white m-0 p-0 overflow-hidden">
    <div class="app-container">
        <!-- Canvas (エフェクト用) -->
        <canvas id="effect-canvas" class="absolute inset-0 pointer-events-none z-[100] w-full h-full"></canvas>

        <!-- 上部：バトルエリア (OBS用) -->
        <div id="battle-area" class="relative flex-1 bg-gray-900 transition-colors duration-300 overflow-hidden flex flex-col justify-center items-center pb-2">
            
            <!-- ROOM ID -->
            <div id="room-display" class="absolute top-4 left-4 font-black tracking-widest text-white bg-black/60 px-4 py-2 rounded-full border border-gray-500 shadow-xl hidden z-[110] backdrop-blur-sm">
                ROOM: <span id="room-id-text" class="text-yellow-400 text-xl ml-1 drop-shadow-md">----</span>
            </div>

            <!-- ロビー -->
            <div id="lobby-ui" class="absolute inset-0 flex flex-col items-center justify-center bg-gray-900/95 z-50 p-4">
                <h1 class="text-4xl font-black mb-1 text-transparent bg-clip-text bg-gradient-to-r from-red-500 via-yellow-400 to-blue-500">ELEMENTAL CLASH</h1>
                <p class="text-gray-400 mb-6 font-bold text-xs">STREAMER CARD BATTLE</p>
                
                <div class="bg-gray-800 p-4 rounded-xl border border-gray-700 w-full max-w-sm flex flex-col gap-3 relative">
                    <!-- トップボタン群 -->
                    <div class="absolute -top-12 right-0 flex gap-2">
                        <button id="btn-show-qr" class="bg-blue-600 hover:bg-blue-500 p-2 rounded-lg text-xs font-bold shadow">📱 共有</button>
                        <button id="btn-show-ranking" class="bg-yellow-600 hover:bg-yellow-500 p-2 rounded-lg text-xs font-bold shadow">🏆 ランク</button>
                        <button id="btn-show-admin" class="bg-gray-700 hover:bg-gray-600 p-2 rounded-lg text-xs font-bold shadow hidden">⚙️ 管理</button>
                    </div>

                    <input type="text" id="input-name" placeholder="プレイヤー名" class="bg-gray-900 text-white px-3 py-2 rounded text-center font-bold outline-none w-full text-sm">
                    <div class="flex items-center gap-2">
                        <div id="icon-preview-container" class="w-10 h-10 rounded-full bg-gray-700 flex items-center justify-center shrink-0 overflow-hidden"><span id="icon-preview-text" class="text-sm">?</span><img id="icon-preview-img" src="" class="w-full h-full object-cover hidden"></div>
                        <input type="file" id="input-icon" accept="image/*" class="text-xs text-gray-400 w-full">
                    </div>
                    <button id="btn-create" class="bg-red-600 hover:bg-red-500 text-white font-bold py-3 rounded-lg mt-2 shadow-lg hover:scale-105 transition-transform">CREATE NEW ROOM</button>
                    <div class="flex items-center gap-2">
                        <input type="text" id="input-room" placeholder="ROOM ID" class="bg-gray-900 text-white px-3 py-3 rounded text-center font-bold w-full text-sm">
                        <button id="btn-join" class="bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 px-4 rounded-lg transition-colors">JOIN</button>
                    </div>
                </div>
            </div>

            <!-- バトルフィールド -->
            <div id="battle-field" class="w-full max-w-lg px-2 flex justify-between items-center hidden relative z-10 pt-6">
                <!-- P1 -->
                <div class="flex flex-col items-center relative w-[42%]">
                    <div class="flex items-center gap-1 mb-1 w-full justify-center">
                        <div id="p1-icon" class="w-6 h-6 rounded-full bg-gray-700 flex items-center justify-center overflow-hidden border border-gray-600"><span class="text-[10px] text-white font-bold p1-icon-text">P1</span></div>
                        <div class="text-[11px] font-bold text-gray-300 truncate max-w-[80px]" id="p1-name">HOST</div>
                    </div>
                    <div id="p1-hp-box" class="w-full h-4 bg-gray-900 rounded-full border border-gray-600 overflow-hidden mb-1 relative"><div id="p1-hp-bar" class="h-full bg-gradient-to-r from-blue-600 to-cyan-400 transition-all duration-300 w-full"></div></div>
                    <div class="text-xs font-black text-gray-400 mb-1">TOTAL: <span id="p1-total" class="text-yellow-400 text-lg drop-shadow-md">0</span></div>
                    <div id="p1-status" class="text-[10px] font-black bg-blue-900/80 px-2 py-0.5 rounded border border-blue-500 mb-2 opacity-0">YOU</div>
                    <div class="flex gap-1 justify-center w-full">
                        <div id="p1-slot-0" class="card-container"></div><div id="p1-slot-1" class="card-container"></div><div id="p1-slot-2" class="card-container"></div>
                    </div>
                </div>
                <div class="text-xl font-black italic text-gray-600 mt-8">VS</div>
                <!-- P2 -->
                <div class="flex flex-col items-center relative w-[42%]">
                    <div class="flex items-center gap-1 mb-1 w-full justify-center">
                        <div id="p2-icon" class="w-6 h-6 rounded-full bg-gray-700 flex items-center justify-center overflow-hidden border border-gray-600"><span class="text-[10px] text-white font-bold p2-icon-text">P2</span></div>
                        <div class="text-[11px] font-bold text-gray-300 truncate max-w-[80px]" id="p2-name">GUEST</div>
                    </div>
                    <div id="p2-hp-box" class="w-full h-4 bg-gray-900 rounded-full border border-gray-600 overflow-hidden mb-1 relative"><div id="p2-hp-bar" class="h-full bg-gradient-to-r from-blue-600 to-cyan-400 transition-all duration-300 w-full"></div></div>
                    <div class="text-xs font-black text-gray-400 mb-1">TOTAL: <span id="p2-total" class="text-yellow-400 text-lg drop-shadow-md">0</span></div>
                    <div id="p2-status" class="text-[10px] font-black bg-red-900/80 px-2 py-0.5 rounded border border-red-500 mb-2 opacity-0">OPPONENT</div>
                    <div class="flex gap-1 justify-center w-full">
                        <div id="p2-slot-0" class="card-container"></div><div id="p2-slot-1" class="card-container"></div><div id="p2-slot-2" class="card-container"></div>
                    </div>
                </div>
            </div>
            
            <!-- リザルト -->
            <div id="result-message" class="absolute inset-0 bg-black/80 flex flex-col items-center justify-center z-[60] hidden opacity-0 transition-opacity duration-300 backdrop-blur-sm">
                <div id="result-text-main" class="text-6xl font-black text-white drop-shadow-[0_0_20px_rgba(0,0,0,1)]"></div>
                <div id="result-text-sub" class="text-xl font-bold text-gray-300 mt-2"></div>
                <button id="btn-restart" class="mt-8 bg-blue-600 hover:bg-blue-500 text-white font-bold py-4 px-10 rounded-full hidden shadow-lg hover:scale-105 transition-transform">もう一度プレイ</button>
                <div id="wait-restart-text" class="mt-8 text-yellow-400 font-bold hidden animate-pulse">ホストの再戦準備待ち...</div>
            </div>

            <!-- 待機ローディング (QRとコピーボタンを選択式に変更) -->
            <div id="waiting-overlay" class="absolute inset-0 bg-black/70 flex flex-col items-center justify-center z-[150] hidden backdrop-blur-md">
                <svg class="animate-spin h-16 w-16 text-blue-500 mb-4 drop-shadow-[0_0_15px_rgba(59,130,246,1)]" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
                <div class="text-xl font-black text-white animate-pulse mb-6 tracking-widest">WAITING FOR OPPONENT...</div>
                
                <!-- 招待コントロール (ホストが対戦相手待ちの時のみ表示されるエリア) -->
                <div id="waiting-invite-controls" class="flex flex-col items-center gap-4 hidden">
                    <div class="flex gap-2">
                        <button id="btn-wait-show-qr" class="bg-gray-700 hover:bg-gray-600 px-4 py-2 rounded-lg text-xs font-bold text-white shadow transition-colors">QRコード表示</button>
                        <button id="btn-wait-copy-link" class="bg-blue-600 hover:bg-blue-500 px-4 py-2 rounded-lg text-xs font-bold text-white shadow transition-colors">リンクをコピー</button>
                    </div>
                    <div id="waiting-qr-container" class="bg-white p-2 rounded hidden flex-col items-center">
                        <div id="qrcode-room" class="mb-1"></div>
                        <div class="text-black text-[10px] font-bold mt-1">招待用QRコード</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 境界線 -->
        <div class="w-full h-1 bg-gray-600 border-t border-gray-500 relative z-50 shrink-0"></div>

        <!-- 下部：コントロール -->
        <div id="control-area" class="h-48 shrink-0 bg-gray-950 flex flex-col relative z-40">
            <div class="flex-1 flex flex-col p-2 relative">
                <div class="flex justify-between items-center mb-1 px-2">
                    <div class="text-[9px] text-gray-400 font-bold">🔥&gt;⚡&gt;💧&gt;🔥 [+3] / 3枚セット</div>
                    <button id="btn-greenback" class="bg-gray-800 text-[#00FF00] border border-green-800 text-[9px] font-bold px-2 py-1 rounded hover:bg-gray-700 transition-colors">🟩 グリーンバック(OBS用)</button>
                </div>
                <!-- 手札 -->
                <div id="hand-ui" class="flex-1 flex flex-col justify-center hidden w-full h-full">
                    <div id="hand-cards" class="flex justify-center gap-2 items-center w-full px-1"></div>
                </div>
            </div>
            <div class="h-14 w-full flex items-center justify-center bg-gray-900 border-t border-gray-800 shrink-0 px-2 relative z-20">
                <button id="btn-confirm" class="w-full max-w-sm bg-gray-800 text-gray-500 font-bold py-3 rounded-lg cursor-not-allowed text-sm transition-all duration-200 tracking-widest" disabled>SELECT 3 CARDS</button>
            </div>
        </div>
    </div>

    <!-- 各種モーダル -->
    <!-- 認証モーダル -->
    <div id="modal-auth" class="absolute inset-0 bg-black/90 flex items-center justify-center z-[200] hidden backdrop-blur-sm px-4">
        <div class="bg-gray-800 p-6 rounded-xl border border-gray-700 w-full max-w-sm flex flex-col gap-4">
            <h2 class="text-xl font-bold text-center text-white">ホスト権限が必要です</h2>
            <p class="text-xs text-gray-400 text-center">この部屋を作成するにはパスワードが必要です。</p>
            <input type="password" id="input-password" class="bg-gray-900 text-white px-3 py-3 rounded text-center outline-none" placeholder="パスワードを入力">
            <div class="flex gap-2 mt-2">
                <button id="btn-auth-cancel" class="flex-1 bg-gray-700 hover:bg-gray-600 py-3 rounded font-bold text-white transition-colors">キャンセル</button>
                <button id="btn-auth-submit" class="flex-1 bg-blue-600 hover:bg-blue-500 py-3 rounded font-bold text-white transition-colors">認証する</button>
            </div>
        </div>
    </div>

    <!-- 管理モーダル -->
    <div id="modal-admin" class="absolute inset-0 bg-black/90 flex items-center justify-center z-[200] hidden backdrop-blur-sm px-4">
        <div class="bg-gray-800 p-6 rounded-xl border border-gray-700 w-full max-w-sm flex flex-col gap-4">
            <h2 class="text-xl font-bold text-center text-yellow-400">⚙️ サブホスト管理</h2>
            <div class="flex items-center justify-between bg-gray-900 p-3 rounded">
                <span class="text-sm font-bold text-white">誰でもホストモード</span>
                <button id="btn-toggle-anyone" class="w-12 h-6 rounded-full bg-red-500 relative transition-colors"><span class="absolute left-1 top-1 w-4 h-4 bg-white rounded-full transition-all"></span></button>
            </div>
            <div class="bg-gray-900 p-3 rounded flex flex-col gap-2">
                <span class="text-sm font-bold text-white">サブホスト パスワード追加</span>
                <div class="flex gap-2">
                    <input type="text" id="input-subpass" class="flex-1 bg-gray-800 text-white px-2 py-1 rounded text-sm" placeholder="新しいパスワード">
                    <button id="btn-add-subpass" class="bg-green-600 hover:bg-green-500 px-3 rounded text-sm font-bold text-white">追加</button>
                </div>
            </div>
            <div class="flex gap-2 mt-2">
                <button id="btn-reset-ranking" class="flex-1 bg-red-700 hover:bg-red-600 py-2 rounded font-bold text-white text-xs transition-colors">ランキングリセット</button>
                <button id="btn-admin-close" class="flex-1 bg-gray-600 hover:bg-gray-500 py-2 rounded font-bold text-white text-xs transition-colors">閉じる</button>
            </div>
        </div>
    </div>

    <!-- ランキングモーダル -->
    <div id="modal-ranking" class="absolute inset-0 bg-black/90 flex flex-col items-center justify-center z-[200] hidden backdrop-blur-sm px-4 py-8">
        <div class="bg-gray-800 p-4 rounded-xl border border-gray-700 w-full max-w-md flex flex-col h-full max-h-[80vh]">
            <h2 class="text-2xl font-black text-center text-yellow-400 mb-4">🏆 RANKING</h2>
            <div class="flex-1 overflow-y-auto pr-2" id="ranking-list">
                <!-- ランキング項目がここに入る -->
                <div class="text-center text-gray-500 py-4 text-sm">読み込み中...</div>
            </div>
            <button id="btn-ranking-close" class="w-full mt-4 bg-gray-700 hover:bg-gray-600 py-3 rounded font-bold text-white transition-colors shrink-0">閉じる</button>
        </div>
    </div>

    <!-- QRモーダル -->
    <div id="modal-qr" class="absolute inset-0 bg-black/90 flex items-center justify-center z-[200] hidden backdrop-blur-sm px-4">
        <div class="bg-gray-800 p-6 rounded-xl border border-gray-700 w-full max-w-sm flex flex-col items-center gap-4">
            <h2 class="text-xl font-bold text-center text-white">アプリを共有</h2>
            <div class="bg-white p-3 rounded" id="qrcode-app"></div>
            <input type="text" id="input-app-url" class="w-full bg-gray-900 text-gray-400 px-2 py-2 rounded text-xs text-center" readonly>
            <button id="btn-copy-url" class="w-full bg-blue-600 hover:bg-blue-500 py-2 rounded font-bold text-white transition-colors">URLをコピー</button>
            <button id="btn-qr-close" class="w-full bg-gray-700 hover:bg-gray-600 py-2 rounded font-bold text-white transition-colors mt-2">閉じる</button>
        </div>
    </div>

    <!-- Firebase & Logic -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, onSnapshot, getDoc, updateDoc, runTransaction } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Global Variables
        const appIdStr = typeof __app_id !== 'undefined' ? __app_id : 'streamer-card-game';
        let firebaseConfig = {
            apiKey: "AIzaSyB0WCtYTz2ychi5K7WaE1iXjN65VpLwWac",
            authDomain: "voice-chat-streamer.firebaseapp.com",
            projectId: "voice-chat-streamer",
            storageBucket: "voice-chat-streamer.firebasestorage.app",
            messagingSenderId: "403894004803",
            appId: "1:403894004803:web:c75b2d63b57f5f4ab978f6"
        };
        if (typeof __firebase_config !== 'undefined' && __firebase_config) {
            try { firebaseConfig = JSON.parse(__firebase_config); } catch (e) {}
        }
        
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const ROOM_COL = 'rooms_v7'; // コレクション名
        let currentUser = null, isHost = false, currentRoomId = null, isAnimating = false;
        let myHand = [], selectedIndices = [];
        const MAX_HP = 50;
        let myPlayerInfo = { name: '', iconData: null };

        // 認証管理
        const MAIN_PASS_HASH = "wlur6vdq"; // tiro3san の難読化
        const shiftEncode = (str) => str.split('').map(c => String.fromCharCode(c.charCodeAt(0) + 3)).join('');
        let isMainHost = false;
        let globalSettings = { anyoneCanHost: false, subPasswords: [] };

        // サウンド
        const SE = {
            btn: new Audio('https://assets.mixkit.co/active_storage/sfx/2568/2568-preview.mp3'),
            select: new Audio('https://assets.mixkit.co/active_storage/sfx/2573/2573-preview.mp3'),
            open: new Audio('https://assets.mixkit.co/active_storage/sfx/2000/2000-preview.mp3'),
            buff: new Audio('https://assets.mixkit.co/active_storage/sfx/2003/2003-preview.mp3'),
            fire: new Audio('https://assets.mixkit.co/active_storage/sfx/2144/2144-preview.mp3'),
            thunder: new Audio('https://assets.mixkit.co/active_storage/sfx/2156/2156-preview.mp3'),
            water: new Audio('https://assets.mixkit.co/active_storage/sfx/2149/2149-preview.mp3'),
            win: new Audio('https://assets.mixkit.co/active_storage/sfx/2001/2001-preview.mp3'),
            lose: new Audio('https://assets.mixkit.co/active_storage/sfx/2002/2002-preview.mp3')
        };
        const playSE = (name) => { try { SE[name].volume = 0.5; SE[name].currentTime = 0; SE[name].play().catch(()=>{}); } catch(e){} };

        const ELEMENTS = [
            { id: 'FIRE', icon: '🔥', color: '#ef4444', shadow: '#f97316' },
            { id: 'THUNDER', icon: '⚡', color: '#eab308', shadow: '#fef08a' },
            { id: 'WATER', icon: '💧', color: '#3b82f6', shadow: '#60a5fa' }
        ];

        // --- STREAMING_CHUNK:Profile & Storage Setup ---
        const savedProfile = localStorage.getItem('elem_clash_profile');
        if(savedProfile) {
            try {
                myPlayerInfo = JSON.parse(savedProfile);
                document.getElementById('input-name').value = myPlayerInfo.name;
                if(myPlayerInfo.iconData) {
                    document.getElementById('icon-preview-img').src = myPlayerInfo.iconData;
                    document.getElementById('icon-preview-img').classList.remove('hidden');
                    document.getElementById('icon-preview-text').classList.add('hidden');
                }
            } catch(e) {}
        }
        const saveProfile = () => {
            myPlayerInfo.name = document.getElementById('input-name').value.trim() || "PLAYER";
            localStorage.setItem('elem_clash_profile', JSON.stringify(myPlayerInfo));
        };

        const ui = {
            battleArea: document.getElementById('battle-area'), btnGreenback: document.getElementById('btn-greenback'),
            lobbyUi: document.getElementById('lobby-ui'), battleField: document.getElementById('battle-field'),
            handUi: document.getElementById('hand-ui'), waitingOverlay: document.getElementById('waiting-overlay'),
            btnCreate: document.getElementById('btn-create'), btnJoin: document.getElementById('btn-join'),
            inputId: document.getElementById('input-room'), inputName: document.getElementById('input-name'),
            inputIcon: document.getElementById('input-icon'), iconPreviewImg: document.getElementById('icon-preview-img'),
            iconPreviewText: document.getElementById('icon-preview-text'), roomIdText: document.getElementById('room-id-text'),
            roomDisplay: document.getElementById('room-display'), handCards: document.getElementById('hand-cards'),
            btnConfirm: document.getElementById('btn-confirm'), btnRestart: document.getElementById('btn-restart'),
            waitRestartText: document.getElementById('wait-restart-text'), p1Total: document.getElementById('p1-total'),
            p2Total: document.getElementById('p2-total'), resultMessage: document.getElementById('result-message'),
            p1Slots: [document.getElementById('p1-slot-0'), document.getElementById('p1-slot-1'), document.getElementById('p1-slot-2')],
            p2Slots: [document.getElementById('p2-slot-0'), document.getElementById('p2-slot-1'), document.getElementById('p2-slot-2')],
            p1HpBar: document.getElementById('p1-hp-bar'), p2HpBar: document.getElementById('p2-hp-bar'),
            p1HpBox: document.getElementById('p1-hp-box'), p2HpBox: document.getElementById('p2-hp-box'),
            modalAuth: document.getElementById('modal-auth'), modalAdmin: document.getElementById('modal-admin'),
            modalRanking: document.getElementById('modal-ranking'), modalQr: document.getElementById('modal-qr')
        };

        const urlParams = new URLSearchParams(window.location.search);

        // --- STREAMING_CHUNK:Canvas Effects System ---
        const canvas = document.getElementById('effect-canvas');
        const ctx = canvas.getContext('2d');
        let activeEffects = [];
        window.addEventListener('resize', () => { canvas.width = canvas.clientWidth; canvas.height = canvas.clientHeight; });
        canvas.width = canvas.clientWidth; canvas.height = canvas.clientHeight;

        function animateEffects(time) {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            for(let i = activeEffects.length - 1; i >= 0; i--) {
                activeEffects[i].update(time); activeEffects[i].draw(ctx);
                if(activeEffects[i].isDead) activeEffects.splice(i, 1);
            }
            requestAnimationFrame(animateEffects);
        }
        requestAnimationFrame(animateEffects);

        class PopUpText {
            constructor(x, y, text, color, scale = 1) { this.x = x; this.y = y; this.text = text; this.color = color; this.scaleBase = scale; this.startTime = performance.now(); this.isDead = false; }
            update(time) { this.p = (time - this.startTime) / 1200; if(this.p >= 1) this.isDead = true; }
            draw(ctx) {
                let a = 1, dy = -30 * this.p, s = this.scaleBase * (this.p < 0.2 ? 0.5 + 2.5*this.p : (this.p > 0.8 ? 1 - (this.p-0.8)*5 : 1));
                if (this.p > 0.8) a = 1 - (this.p - 0.8)*5;
                ctx.save(); ctx.globalAlpha = a; ctx.translate(this.x, this.y + dy); ctx.scale(s, s);
                ctx.font = "900 36px sans-serif"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
                ctx.lineWidth = 5; ctx.strokeStyle = '#000'; ctx.strokeText(this.text, 0, 0);
                ctx.fillStyle = this.color; ctx.shadowColor = this.color; ctx.shadowBlur = 15; ctx.fillText(this.text, 0, 0);
                ctx.restore();
            }
        }
        class FlashBang {
            constructor() { this.startTime = performance.now(); this.isDead = false; }
            update(t) { this.p = (t - this.startTime) / 300; if (this.p >= 1) this.isDead = true; }
            draw(ctx) { ctx.save(); ctx.fillStyle = `rgba(255,255,255,${this.p < 0.5 ? this.p*2 : 1 - (this.p-0.5)*2})`; ctx.fillRect(0,0,canvas.width,canvas.height); ctx.restore(); }
        }
        class Projectile {
            constructor(sx, sy, ex, ey, el, onDone) {
                this.sx = sx; this.sy = sy; this.ex = ex; this.ey = ey; this.el = el; this.onDone = onDone;
                this.st = performance.now(); this.isDead = false; this.ang = Math.atan2(ey-sy, ex-sx);
            }
            update(t) { this.p = (t - this.st) / 400; this.p *= this.p; if(this.p >= 1) { this.p=1; this.isDead=true; this.onDone(); }
                this.x = this.sx + (this.ex-this.sx)*this.p; this.y = this.sy + (this.ey-this.sy)*this.p;
            }
            draw(ctx) {
                ctx.save(); ctx.translate(this.x, this.y); ctx.fillStyle = this.el.color; ctx.shadowColor = this.el.shadow; ctx.shadowBlur = 30;
                if (this.el.id === 'FIRE') { ctx.beginPath(); ctx.arc(0,0,30,0,Math.PI*2); ctx.fill(); }
                else if (this.el.id === 'WATER') { ctx.rotate(this.ang); ctx.beginPath(); ctx.arc(0,0,20,Math.PI/2,Math.PI*1.5); ctx.lineTo(35,0); ctx.closePath(); ctx.fill(); }
                ctx.restore();
            }
        }
        class Lightning {
            constructor(sx, sy, ex, ey, onDone) { this.st = performance.now(); this.isDead = false; this.onDone = onDone;
                this.pts = [{x:sx,y:sy}]; for(let i=1;i<10;i++) this.pts.push({x:sx+(ex-sx)*i/10+(Math.random()-0.5)*60, y:sy+(ey-sy)*i/10+(Math.random()-0.5)*60}); this.pts.push({x:ex,y:ey});
            }
            update(t) { if(t-this.st > 300) { this.isDead = true; this.onDone(); } }
            draw(ctx) {
                let a = 1 - (performance.now()-this.st)/300; ctx.save(); ctx.globalAlpha = a; ctx.beginPath(); ctx.moveTo(this.pts[0].x, this.pts[0].y);
                for(let i=1;i<this.pts.length;i++) ctx.lineTo(this.pts[i].x, this.pts[i].y);
                ctx.strokeStyle='#fff'; ctx.lineWidth=8; ctx.stroke(); ctx.strokeStyle='#fef08a'; ctx.lineWidth=16; ctx.shadowColor='#eab308'; ctx.shadowBlur=30; ctx.stroke(); ctx.restore();
            }
        }
        class Particle {
            constructor(x, y, el) { this.sx = x; this.sy = y; this.el = el; this.st = performance.now(); this.isDead = false;
                let a = Math.random()*Math.PI*2, d = 40+Math.random()*60; this.sz = 5+Math.random()*10;
                if(el.id==='FIRE'){ this.vx=Math.cos(a)*d*0.8; this.vy=-Math.abs(Math.sin(a)*d)-20; this.dur=600;}
                else if(el.id==='WATER'){ this.vx=Math.cos(a)*d*0.8; this.vy=Math.abs(Math.sin(a)*d)+20; this.dur=600;}
                else { this.vx=Math.cos(a)*d*1.5; this.vy=Math.sin(a)*d*1.5; this.dur=300;}
            }
            update(t) { this.p = (t - this.st) / this.dur; if(this.p>=1){this.p=1; this.isDead=true;} this.x=this.sx+this.vx*(this.el.id==='THUNDER'?this.p:1-(1-this.p)*(1-this.p)); this.y=this.sy+this.vy*(this.el.id==='THUNDER'?this.p:1-(1-this.p)*(1-this.p)); }
            draw(ctx) { ctx.save(); ctx.globalAlpha = 1-this.p; ctx.translate(this.x, this.y); ctx.fillStyle=this.el.color; ctx.shadowColor=this.el.shadow; ctx.shadowBlur=10; ctx.beginPath(); ctx.arc(0,0,this.sz,0,Math.PI*2); ctx.fill(); ctx.restore(); }
        }

        // --- STREAMING_CHUNK:Realtime Listener (Core State Machine) ---
        function startListener(id) {
            const ref = doc(db, 'artifacts', appIdStr, 'public', 'data', ROOM_COL, id);
            onSnapshot(ref, async snap => {
                const d = snap.data(); if(!d) return;
                
                // Info Updates
                if(d.p1Info) { document.getElementById('p1-name').textContent = d.p1Info.name; document.getElementById('p1-icon').innerHTML = d.p1Info.iconData ? `<img src="${d.p1Info.iconData}" class="w-full h-full object-cover">` : `<span class="text-[10px] text-white font-bold">${d.p1Info.name.charAt(0)}</span>`; }
                if(d.p2Info) { document.getElementById('p2-name').textContent = d.p2Info.name; document.getElementById('p2-icon').innerHTML = d.p2Info.iconData ? `<img src="${d.p2Info.iconData}" class="w-full h-full object-cover">` : `<span class="text-[10px] text-white font-bold">${d.p2Info.name.charAt(0)}</span>`; }
                
                // Hide initial wait screen when guest joins
                if(isHost && d.guestId && d.phase === 'waiting' && !isAnimating && ui.resultMessage.classList.contains('hidden') && !d.p1Cards && !d.p2Cards) {
                    showWaiting(false);
                }

                // -------------------------------------------------------------------
                // 競合回避: ホスト側で、両方のカードが揃ったかを監視して phase を action に進める
                // (ゲストが最後にセットしたパターンのキャッチアップ用)
                // -------------------------------------------------------------------
                if (isHost && d.p1Cards && d.p2Cards && d.phase === 'waiting' && !isAnimating) {
                    if (!window._isTriggeringAction) {
                        window._isTriggeringAction = true;
                        updateDoc(ref, { phase: 'action' }).then(() => {
                            window._isTriggeringAction = false;
                        }).catch(() => { window._isTriggeringAction = false; });
                    }
                }

                if(!isAnimating) {
                    ui.p1HpBar.style.width = `${(d.p1Hp/MAX_HP)*100}%`; ui.p2HpBar.style.width = `${(d.p2Hp/MAX_HP)*100}%`;
                    
                    // Reset UI for next turn (triggered when phase returns to waiting)
                    if (d.phase === 'waiting' && !ui.resultMessage.classList.contains('hidden')) {
                        ui.resultMessage.classList.add('hidden', 'opacity-0'); ui.btnRestart.classList.add('hidden'); ui.waitRestartText.classList.add('hidden');
                        for(let i=0;i<3;i++){ ui.p1Slots[i].innerHTML=''; ui.p2Slots[i].innerHTML=''; }
                        ui.p1Total.textContent="0"; ui.p2Total.textContent="0";
                        drawHand(); switchView('hand'); return;
                    }
                    if (d.p1Cards) for(let i=0;i<3;i++) if(!ui.p1Slots[i].innerHTML.includes('card-inner')) ui.p1Slots[i].innerHTML = `<div class="card-inner"><div class="card-back flex justify-center items-center"><span class="text-gray-500 opacity-50 text-[10px] font-bold rotate-[-45deg] tracking-widest">SET</span></div></div>`;
                    if (d.p2Cards) for(let i=0;i<3;i++) if(!ui.p2Slots[i].innerHTML.includes('card-inner')) ui.p2Slots[i].innerHTML = `<div class="card-inner"><div class="card-back flex justify-center items-center"><span class="text-gray-500 opacity-50 text-[10px] font-bold rotate-[-45deg] tracking-widest">SET</span></div></div>`;
                }

                // Trigger Action Phase Animation
                if(d.p1Cards && d.p2Cards && d.phase === 'action' && !isAnimating) {
                    isAnimating = true; showWaiting(false);
                    runBattle(d.p1Cards, d.p2Cards, d.p1Hp, d.p2Hp).then(async () => {
                        isAnimating = false;
                        if(d.p1Hp <= 0 || d.p2Hp <= 0) { 
                            if(isHost) {
                                await updateRanking(d.p1Hp > 0, d.guestId, d.p2Info);
                                await updateDoc(ref, { phase: 'result' }); 
                            }
                            return; 
                        }
                        
                        // 次のターンへ
                        if(isHost) {
                            await updateDoc(ref, { p1Cards: null, p2Cards: null, phase: 'waiting' });
                        }
                        // ローカルUIリセット
                        for(let i=0;i<3;i++){ ui.p1Slots[i].innerHTML=''; ui.p2Slots[i].innerHTML=''; } 
                        ui.p1Total.textContent="0"; ui.p2Total.textContent="0";
                        drawHand(); 
                        switchView('hand');
                    });
                }
                
                // Show Result Phase
                if(d.phase === 'result' && !isAnimating && ui.resultMessage.classList.contains('hidden')) {
                    ui.resultMessage.classList.remove('hidden');
                    setTimeout(() => {
                        ui.resultMessage.classList.remove('opacity-0');
                        let win = isHost ? d.p1Hp > 0 : d.p2Hp > 0;
                        playSE(win ? 'win' : 'lose');
                        document.getElementById('result-text-main').textContent = win ? "WIN!" : "LOSE...";
                        document.getElementById('result-text-main').className = win ? "text-6xl font-black text-yellow-400 drop-shadow-[0_0_20px_#facc15]" : "text-6xl font-black text-blue-400 drop-shadow-[0_0_20px_#60a5fa]";
                        if (isHost) ui.btnRestart.classList.remove('hidden'); else ui.waitRestartText.classList.remove('hidden');
                    }, 100);
                }
            }, (error) => console.error(error));
        }
        
        async function updateRanking(hostWon, guestId, guestInfo) {
            try {
                await runTransaction(db, async (t) => {
                    const winRef = doc(db, 'artifacts', appIdStr, 'public', 'data', 'global', 'ranking');
                    const snap = await t.get(winRef);
                    let players = snap.exists() ? snap.data().players || {} : {};
                    
                    if(!players[currentUser.uid]) players[currentUser.uid] = { name: myPlayerInfo.name, icon: myPlayerInfo.iconData, matches: 0, wins: 0 };
                    players[currentUser.uid].matches++;
                    if(hostWon) players[currentUser.uid].wins++;
                    players[currentUser.uid].name = myPlayerInfo.name;
                    players[currentUser.uid].icon = myPlayerInfo.iconData;

                    if(guestId && guestInfo) {
                        if(!players[guestId]) players[guestId] = { name: guestInfo.name, icon: guestInfo.iconData, matches: 0, wins: 0 };
                        players[guestId].matches++;
                        if(!hostWon) players[guestId].wins++;
                        players[guestId].name = guestInfo.name;
                        players[guestId].icon = guestInfo.iconData;
                    }
                    t.set(winRef, { players }, { merge: true });
                });
            } catch(e) { console.error("Ranking update failed", e); }
        }

        // --- STREAMING_CHUNK:Card & Battle Mechanics ---
        function drawHand() { myHand = [rndCard(), rndCard(), rndCard(), rndCard(), rndCard()]; selectedIndices = []; renderHand(); }
        function renderHand() {
            ui.handCards.innerHTML = '';
            myHand.forEach((c, i) => {
                const el = ELEMENTS.find(e => e.id === c.element); const d = document.createElement('div');
                d.className = `hand-card element-${c.element}`;
                let idx = selectedIndices.indexOf(i);
                d.innerHTML = `<div class="text-2xl leading-none mb-1">${el.icon}</div><div class="text-3xl font-black text-gray-900 leading-none">${c.power}</div>`;
                if(idx !== -1) { 
                    d.classList.add('selected'); 
                    d.innerHTML += `<div class="absolute -top-2 -right-2 bg-red-600 text-white font-black rounded-full w-6 h-6 flex items-center justify-center text-xs shadow-lg border-2 border-white z-10">${idx + 1}</div>`; 
                }
                d.onclick = () => { 
                    playSE('select');
                    if(idx !== -1) selectedIndices.splice(idx,1); else if(selectedIndices.length<3) selectedIndices.push(i); renderHand(); 
                };
                ui.handCards.appendChild(d);
            });
            if(selectedIndices.length === 3) { ui.btnConfirm.disabled = false; ui.btnConfirm.className = "w-full max-w-sm bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 rounded-lg shadow-[0_0_15px_rgba(59,130,246,0.8)] transition-all"; ui.btnConfirm.textContent = "CONFIRM 3 CARDS"; }
            else { ui.btnConfirm.disabled = true; ui.btnConfirm.className = "w-full max-w-sm bg-gray-800 text-gray-500 font-bold py-3 rounded-lg cursor-not-allowed"; ui.btnConfirm.textContent = `SELECT CARDS (${selectedIndices.length}/3)`; }
        }

        ui.btnConfirm.addEventListener('click', async () => {
            playSE('btn');
            // 連打防止のため disabled を追加チェック
            if(selectedIndices.length !== 3 || isAnimating || ui.btnConfirm.disabled) return;
            ui.btnConfirm.disabled = true;
            const sCards = selectedIndices.map(i => myHand[i]);
            
            for(let i=0;i<3;i++) (isHost?ui.p1Slots:ui.p2Slots)[i].innerHTML = `<div class="card-inner"><div class="card-back flex justify-center items-center"><span class="text-gray-500 opacity-50 text-[10px] font-bold rotate-[-45deg] tracking-widest">SET</span></div></div>`;
            showWaiting(true, false); 
            ui.btnConfirm.textContent = "SET COMPLETED";
            
            const ref = doc(db, 'artifacts', appIdStr, 'public', 'data', ROOM_COL, currentRoomId);
            
            if (isHost) {
                // ホストが最後に押した場合、すぐにフェーズをアクションへ移行させる
                const snap = await getDoc(ref);
                const d = snap.data();
                if (d.p2Cards) {
                    await updateDoc(ref, { p1Cards: sCards, phase: 'action' });
                } else {
                    await updateDoc(ref, { p1Cards: sCards });
                }
            } else {
                // ゲストは自分のカードをセットするだけ
                await updateDoc(ref, { p2Cards: sCards });
            }
        });

        ui.btnRestart.addEventListener('click', async () => {
            playSE('btn');
            if (!isHost) return; ui.btnRestart.classList.add('hidden');
            await updateDoc(doc(db, 'artifacts', appIdStr, 'public', 'data', ROOM_COL, currentRoomId), { p1Hp: MAX_HP, p2Hp: MAX_HP, p1Cards: null, p2Cards: null, phase: 'waiting' });
        });

        async function runBattle(c1A, c2A, hp1, hp2) {
            let p1Tot = 0, p2Tot = 0, m1=c1A[0], m2=c2A[0];
            const mk = c => { 
                const e=ELEMENTS.find(x=>x.id===c.element); 
                return `<div class="card-inner"><div class="card-back flex justify-center items-center"><span class="text-gray-500 opacity-50 text-[10px] font-bold rotate-[-45deg] tracking-widest">SET</span></div><div class="card-front element-${c.element}"><div class="text-xl mb-1">${e.icon}</div><div class="text-2xl font-black text-gray-900 power-val">${c.power}</div></div></div>`; 
            };
            for(let i=0;i<3;i++){ ui.p1Slots[i].innerHTML=mk(c1A[i]); ui.p2Slots[i].innerHTML=mk(c2A[i]); }
            ui.p1Slots[0].offsetWidth; await sleep(300);

            // Open cards and apply buffs
            for(let i=0; i<3; i++) {
                playSE('open');
                ui.p1Slots[i].querySelector('.card-inner').classList.add('is-flipped'); ui.p2Slots[i].querySelector('.card-inner').classList.add('is-flipped'); await sleep(500);
                
                let adv = (c1A[i].element==='FIRE'&&c2A[i].element==='THUNDER')||(c1A[i].element==='THUNDER'&&c2A[i].element==='WATER')||(c1A[i].element==='WATER'&&c2A[i].element==='FIRE')?1:(c1A[i].element===c2A[i].element?0:-1);
                let p1=c1A[i].power, p2=c2A[i].power;
                
                const buff = async (sl, pw, el) => { 
                    playSE('buff');
                    const f=sl.querySelector('.card-front'); const ed=ELEMENTS.find(e=>e.id===el); f.style.color=ed.color; f.classList.add('glow-buff'); const r=sl.getBoundingClientRect(), c=canvas.getBoundingClientRect(); activeEffects.push(new PopUpText(r.left-c.left+r.width/2, r.top-c.top-10, '+3', ed.color, 0.7)); setTimeout(()=>{f.querySelector('.power-val').textContent=pw;f.querySelector('.power-val').style.color=ed.color;},200); await sleep(600); 
                };
                
                if (adv===1) { p1+=3; await buff(ui.p1Slots[i], p1, c1A[i].element); } else if (adv===-1) { p2+=3; await buff(ui.p2Slots[i], p2, c2A[i].element); }
                
                p1Tot+=p1; p2Tot+=p2; 
                if(p1>m1.power) m1={element:c1A[i].element,power:p1}; 
                if(p2>m2.power) m2={element:c2A[i].element,power:p2};
                
                ui.p1Total.textContent=p1Tot; ui.p2Total.textContent=p2Tot; await sleep(300);
            }
            await sleep(500);

            // Execute Attack
            const atk = (sId, eId, el) => new Promise(res => {
                const s = document.getElementById(sId).getBoundingClientRect(), e = document.getElementById(eId).getBoundingClientRect(), c = canvas.getBoundingClientRect();
                const sx=s.left+s.width/2-c.left, sy=s.top+s.height/2-c.top, ex=e.left+e.width/2-c.left, ey=e.top+e.height/2-c.top;
                const ed=ELEMENTS.find(x=>x.id===el); activeEffects.push(new FlashBang());
                
                if(el==='THUNDER') playSE('thunder');
                else if(el==='FIRE') playSE('fire');
                else playSE('water');

                const onHit = () => { document.body.classList.add('earthquake'); setTimeout(()=>document.body.classList.remove('earthquake'), 400); for(let i=0;i<30;i++) activeEffects.push(new Particle(ex, ey, ed)); res(); };
                if(el==='THUNDER') activeEffects.push(new Lightning(sx,sy,ex,ey,onHit)); else activeEffects.push(new Projectile(sx,sy,ex,ey,ed,onHit));
            });

            if (p1Tot !== p2Tot) {
                let p1Win = p1Tot > p2Tot; let diff = Math.abs(p1Tot - p2Tot);
                await atk(p1Win?'p1-slot-1':'p2-slot-1', p1Win?'p2-slot-1':'p1-slot-1', p1Win?m1.element:m2.element);
                const hb = document.getElementById(p1Win?'p2-hp-box':'p1-hp-box'); hb.classList.add('shake'); setTimeout(()=>hb.classList.remove('shake'), 400);
                const r=hb.getBoundingClientRect(), c=canvas.getBoundingClientRect(); activeEffects.push(new PopUpText(r.left-c.left+r.width/2, r.top-c.top-20, `-${diff}`, '#ef4444', 1.5));
                if(p1Win) hp2=Math.max(0,hp2-diff); else hp1=Math.max(0,hp1-diff);
            } else { 
                const c=canvas.getBoundingClientRect(); activeEffects.push(new PopUpText(c.width/2, c.height/2, 'DRAW!', '#9ca3af', 1.5)); 
            }

            ui.p1HpBar.style.width=`${(hp1/MAX_HP)*100}%`; ui.p2HpBar.style.width=`${(hp2/MAX_HP)*100}%`;
            if (isHost) await updateDoc(doc(db, 'artifacts', appIdStr, 'public', 'data', ROOM_COL, currentRoomId), { p1Hp: hp1, p2Hp: hp2 });
            await sleep(1500);
        }

        initAuth();
    </script>
</body>
</html>

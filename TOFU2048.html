<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TOFU2048</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;900&family=Nunito:wght@700;900&display=swap" rel="stylesheet">
    
    <style>
        body {
            background-color: #fff0f5;
            background-image: radial-gradient(#ffc0cb 2px, transparent 2px);
            background-size: 30px 30px;
            font-family: 'M PLUS Rounded 1c', sans-serif;
            overflow-x: hidden;
            overflow-y: auto;
            color: #785a5a;
        }
        
        .font-cute {
            font-family: 'Nunito', 'M PLUS Rounded 1c', sans-serif;
        }

        .cute-panel {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 4px solid #ffe4e1;
            box-shadow: 0 8px 20px rgba(255, 182, 193, 0.3);
            border-radius: 20px;
        }

        .game-container {
            width: min(95vw, 420px);
            margin: 0 auto;
        }

        .board {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: repeat(4, 1fr);
            gap: 10px;
            aspect-ratio: 1 / 1;
            position: relative;
            padding: 10px;
            border-radius: 20px;
            background-color: #ffd6e0;
            border: 6px solid #ffb6c1;
            box-shadow: inset 0 4px 10px rgba(200, 100, 120, 0.2), 0 8px 15px rgba(255, 182, 193, 0.4);
        }

        .grid-cell {
            background-color: rgba(255, 255, 255, 0.5);
            border-radius: 14px;
            box-shadow: inset 0 3px 6px rgba(0,0,0,0.05);
        }

        .tile-container {
            position: absolute;
            top: 10px; left: 10px; right: 10px; bottom: 10px;
            pointer-events: none;
            z-index: 10;
        }

        .hammer-mode .tile-container {
            pointer-events: auto;
        }
        .hammer-mode .tile {
            cursor: pointer;
            animation: shake 0.5s infinite;
        }
        
        @keyframes shake {
            0% { transform: rotate(0deg); }
            25% { transform: rotate(-3deg); }
            50% { transform: rotate(0deg); }
            75% { transform: rotate(3deg); }
            100% { transform: rotate(0deg); }
        }

        .tile {
            position: absolute;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 14px;
            font-weight: 900;
            font-size: 2rem;
            font-family: 'Nunito', sans-serif;
            transition: transform 0.15s ease-in-out, top 0.15s ease-in-out, left 0.15s ease-in-out;
            width: calc((100% - 30px) / 4);
            height: calc((100% - 30px) / 4);
            user-select: none;
            box-shadow: 0 4px 0 rgba(0,0,0,0.1), 0 6px 10px rgba(0,0,0,0.1);
        }
        .tile:active {
            transform: translateY(3px);
            box-shadow: 0 1px 0 rgba(0,0,0,0.1), 0 3px 4px rgba(0,0,0,0.1);
        }

        @media (max-width: 500px) {
            .tile { font-size: 1.5rem; }
        }

        /* マカロンカラーのスタイル */
        .tile-2 { background: #fff0f5; color: #8b6b6b; border: 2px solid #ffe4e1; }
        .tile-4 { background: #ffe4e1; color: #8b6b6b; border: 2px solid #ffc0cb; }
        .tile-8 { background: #ffdac1; color: #785a5a; border: 2px solid #ffb6b9; }
        .tile-16 { background: #ffb7b2; color: #fff; text-shadow: 1px 1px 2px rgba(0,0,0,0.1); }
        .tile-32 { background: #e2f0cb; color: #6b8e23; border: 2px solid #c5e1a5; }
        .tile-64 { background: #b5ead7; color: #3e8e41; border: 2px solid #81c784; }
        .tile-128 { background: #c7ceea; color: #5c6bc0; border: 2px solid #9fa8da; font-size: 1.6rem; }
        .tile-256 { background: #f3b0c3; color: #fff; border: 2px solid #f06292; font-size: 1.6rem; }
        .tile-512 { background: #f6d186; color: #fff; border: 2px solid #ffca28; font-size: 1.6rem; }
        .tile-1024 { background: #a2e1db; color: #00838f; border: 2px solid #80deea; font-size: 1.2rem; }
        .tile-2048 { 
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%);
            color: #fff; font-size: 1.2rem; 
            border: 2px solid #ff758c;
            box-shadow: 0 0 15px rgba(255, 117, 140, 0.5), inset 0 0 8px rgba(255,255,255,0.8); 
        }
        .tile-super { 
            background: linear-gradient(135deg, #a18cd1 0%, #fbc2eb 100%); 
            animation: gradient-shift 3s ease infinite;
            color: #fff; font-size: 1.2rem; 
            border: 2px solid #ce93d8;
            box-shadow: 0 0 20px rgba(251, 194, 235, 0.6); 
        }

        @keyframes gradient-shift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        @keyframes bounceIn {
            0% { transform: scale(0); opacity: 0; }
            50% { transform: scale(1.2); }
            70% { transform: scale(0.9); }
            100% { transform: scale(1); opacity: 1; }
        }
        .tile-new { animation: bounceIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }

        @keyframes jelly {
            0% { transform: scale3d(1, 1, 1); }
            30% { transform: scale3d(1.25, 0.75, 1); }
            40% { transform: scale3d(0.75, 1.25, 1); }
            50% { transform: scale3d(1.15, 0.85, 1); }
            65% { transform: scale3d(0.95, 1.05, 1); }
            75% { transform: scale3d(1.05, 0.95, 1); }
            100% { transform: scale3d(1, 1, 1); }
        }
        .tile-merged { animation: jelly 0.5s ease-out forwards; }

        .btn-cute {
            background: linear-gradient(to bottom, #ff9a9e, #ff758c);
            color: white;
            border-radius: 9999px;
            padding: 8px 20px;
            font-weight: 900;
            box-shadow: 0 5px 0 #d84b63, 0 8px 10px rgba(255, 117, 140, 0.3);
            transition: all 0.1s;
            border: 2px solid white;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .btn-cute:hover:not(:disabled) {
            transform: translateY(2px);
            box-shadow: 0 3px 0 #d84b63, 0 5px 8px rgba(255, 117, 140, 0.3);
        }
        .btn-cute:active:not(:disabled) {
            transform: translateY(5px);
            box-shadow: 0 0px 0 #d84b63, 0 2px 3px rgba(255, 117, 140, 0.3);
        }
        .btn-cute:disabled {
            background: #d1d5db;
            box-shadow: 0 5px 0 #9ca3af;
            color: #6b7280;
            cursor: not-allowed;
            border-color: #f3f4f6;
        }

        .btn-item {
            background: linear-gradient(to bottom, #fbc2eb, #a18cd1);
            box-shadow: 0 5px 0 #856aab, 0 8px 10px rgba(161, 140, 209, 0.3);
        }
        .btn-item:hover:not(:disabled) {
            transform: translateY(2px);
            box-shadow: 0 3px 0 #856aab, 0 5px 8px rgba(161, 140, 209, 0.3);
        }
        .btn-item:active:not(:disabled) {
            transform: translateY(5px);
            box-shadow: 0 0px 0 #856aab, 0 2px 3px rgba(161, 140, 209, 0.3);
        }

        .board { touch-action: none; }

        .overlay-mask {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(5px);
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            z-index: 50;
        }
        .overlay-mask.active {
            opacity: 1;
            pointer-events: auto;
        }

        #toast-container {
            position: fixed;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 100;
            display: flex;
            flex-direction: column;
            gap: 8px;
            pointer-events: none;
        }
        .toast {
            background: white;
            border: 3px solid #ffb6c1;
            color: #785a5a;
            padding: 10px 20px;
            border-radius: 9999px;
            box-shadow: 0 4px 12px rgba(255, 182, 193, 0.4);
            font-weight: 900;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.9rem;
            animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards, fadeOut 0.3s ease-in 2.5s forwards;
        }
        .toast::before { content: '✨'; }
        .toast.success { border-color: #a2e1db; }
        .toast.error { border-color: #ff9a9e; }
        .toast.reward { 
            border-color: #f6d186; 
            background: #fffdf5;
            color: #d4a017;
        }
        .toast.reward::before { content: '🎁'; }

        @keyframes coinDropAndSpin {
            0% { transform: translateY(0px) scale(0) rotateY(0deg); opacity: 0; }
            15% { transform: translateY(-40px) scale(1.3) rotateY(180deg); opacity: 1; }
            40% { transform: translateY(20px) scale(1.3) rotateY(360deg); }
            80% { transform: translateY(200px) scale(1) rotateY(720deg); opacity: 1; }
            100% { transform: translateY(300px) scale(0.5) rotateY(1080deg); opacity: 0; }
        }
        .falling-coin {
            position: fixed;
            top: 25%;
            z-index: 1000;
            pointer-events: none;
            width: 24px !important; 
            height: 24px !important;
            line-height: 20px !important;
            font-size: 12px !important;
            animation: coinDropAndSpin 1.2s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
            box-shadow: 0 3px 10px rgba(255, 215, 0, 0.6), 0 0 8px rgba(255,255,255,0.8) !important;
        }

        @keyframes popIn {
            from { transform: translateY(-20px) scale(0.8); opacity: 0; }
            to { transform: translateY(0) scale(1); opacity: 1; }
        }
        @keyframes fadeOut {
            from { opacity: 1; }
            to { opacity: 0; }
        }

        .coin-icon {
            display: inline-block;
            background: #f6d186;
            border: 2px solid #e5b85c;
            border-radius: 50%;
            width: 18px; height: 18px;
            text-align: center;
            line-height: 14px;
            color: white;
            font-size: 10px;
            font-weight: bold;
            box-shadow: 0 2px 4px rgba(246, 209, 134, 0.5);
        }
    </style>
</head>

    <!-- Firebase Scripts -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, GoogleAuthProvider, signInWithPopup, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, getDoc, setDoc, updateDoc, increment, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = { 
            apiKey: "AIzaSyB0WCtYTz2ychi5K7WaE1iXjN65VpLwWac", 
            authDomain: "voice-chat-streamer.firebaseapp.com", 
            projectId: "voice-chat-streamer", 
            storageBucket: "voice-chat-streamer.firebasestorage.app", 
            messagingSenderId: "403894004803", 
            appId: "1:403894004803:web:c75b2d63b57f5f4ab978f6" 
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const APP_ID = 'streamer-card-game';
        
        // --- 🎶 ハーモニーを意識した効果音マネージャー 🎶 ---
        const SoundManager = {
            initialized: false,
            synths: {},
            bgmAudio: null,
            async init() {
                if(this.initialized) return;
                await Tone.start();
                
                // 小文字のパスに変更
                this.bgmAudio = new Audio('/audio/2048.mp3');
                this.bgmAudio.loop = true;
                this.bgmAudio.volume = 0.25; 
                
                // 1. 移動音 (まろやかなサイン波のエレピ風)
                this.synths.move = new Tone.Synth({
                    oscillator: { type: 'sine' },
                    envelope: { attack: 0.01, decay: 0.2, sustain: 0, release: 0.2 }
                }).toDestination();
                this.synths.move.volume.value = -12;

                // 2. 合体音 (綺麗なメジャーコードを奏でるPolySynth)
                this.synths.merge = new Tone.PolySynth(Tone.Synth, {
                    oscillator: { type: 'triangle' },
                    envelope: { attack: 0.02, decay: 0.3, sustain: 0.1, release: 0.5 }
                }).toDestination();
                this.synths.merge.volume.value = -10;

                // 3. ごほうび音 (広がりを持たせたアルペジオ用)
                this.synths.reward = new Tone.PolySynth(Tone.Synth, {
                    oscillator: { type: 'sine' },
                    envelope: { attack: 0.05, decay: 0.3, sustain: 0.2, release: 1.5 }
                }).toDestination();
                this.synths.reward.volume.value = -8;

                // 4. ハンマー音 (キランッ✨という透明感のある高いサイン波)
                this.synths.hammer = new Tone.Synth({
                    oscillator: { type: 'sine' },
                    envelope: { attack: 0.005, decay: 0.1, sustain: 0, release: 0.1 }
                }).toDestination();
                this.synths.hammer.volume.value = -8;

                // 5. コイン音 (オルゴールのような高音)
                this.synths.coin = new Tone.PolySynth(Tone.Synth, {
                    oscillator: { type: 'sine' },
                    envelope: { attack: 0.01, decay: 0.1, sustain: 0, release: 0.5 }
                }).toDestination();
                this.synths.coin.volume.value = -12;

                this.initialized = true;
            },
            
            // BGMの邪魔をしない「Cメジャーペンタトニック(C, D, E, G, A)」を使用
            playMove() {
                if(!this.initialized) return;
                const notes = ["C4", "D4", "E4", "G4", "A4"];
                const note = notes[Math.floor(Math.random() * notes.length)];
                this.synths.move.triggerAttackRelease(note, "16n");
            },
            playMerge() {
                if(!this.initialized) return;
                // BGMに溶け込む綺麗な和音のバリエーション
                const chords = [
                    ["C5", "E5", "G5"], // Cメジャー
                    ["F5", "A5", "C6"], // Fメジャー
                    ["G5", "B5", "D6"]  // Gメジャー
                ];
                const chord = chords[Math.floor(Math.random() * chords.length)];
                this.synths.merge.triggerAttackRelease(chord, "8n");
            },
            playReward() {
                if(!this.initialized) return;
                const now = Tone.now();
                // 祝福感のあるハープ風アルペジオ
                this.synths.reward.triggerAttackRelease(["C5", "E5", "G5", "B5"], "4n", now);
                this.synths.reward.triggerAttackRelease(["E5", "G5", "B5", "D6"], "4n", now + 0.15);
                this.synths.reward.triggerAttackRelease(["G5", "B5", "D6", "F#6"], "2n", now + 0.3);
            },
            playHammer() {
                if(!this.initialized) return;
                // 透明感のある高いキラン！という音
                this.synths.hammer.triggerAttackRelease("C6", "32n");
            },
            playClick() {
                if(!this.initialized) return;
                this.synths.move.triggerAttackRelease("G5", "32n");
            },
            playCoinShower() {
                if(!this.initialized) return;
                // キラキラした高音のペンタトニック
                const notes = ["C6", "D6", "E6", "G6", "A6", "C7"];
                const note = notes[Math.floor(Math.random() * notes.length)];
                this.synths.coin.triggerAttackRelease(note, "16n");
            },
            playBGM() {
                if(this.bgmAudio) {
                    this.bgmAudio.play().catch(e => console.log("BGMの再生がスキップされました"));
                }
            }
        };

        const EcoSystem = {
            user: null,
            userData: null,
            unsub: null,
            
            init() {
                this.setupUI();
                onAuthStateChanged(auth, async (user) => {
                    if (user) {
                        this.user = user;
                        await this.fetchOrCreateUserData(user);
                        this.startRealtimeListener(user.uid);
                        document.getElementById('auth-btn').textContent = 'Logout';
                    } else {
                        this.user = null;
                        this.userData = null;
                        if(this.unsub) this.unsub();
                        document.getElementById('auth-btn').textContent = 'Login';
                        signInAnonymously(auth).catch(err => console.error(err));
                    }
                });
            },

            setupUI() {
                document.getElementById('auth-btn').addEventListener('click', async () => {
                    await SoundManager.init();
                    SoundManager.playClick();
                    if (this.user && !this.user.isAnonymous) {
                        signOut(auth);
                    } else {
                        const provider = new GoogleAuthProvider();
                        signInWithPopup(auth, provider).catch(err => {
                            showToast('ログインエラー: ' + err.message, 'error');
                        });
                    }
                });
            },

            async fetchOrCreateUserData(user) {
                const userRef = doc(db, 'artifacts', APP_ID, 'public', 'data', 'accounts', user.uid);
                const docSnap = await getDoc(userRef);
                const today = new Date().toDateString();
                
                if (docSnap.exists()) {
                    let data = docSnap.data();
                    if (data.lastPlayDate !== today) {
                        await updateDoc(userRef, { freePlays: 3, lastPlayDate: today });
                    }
                } else {
                    const newName = user.isAnonymous ? "Guest User" : (user.displayName || "DORA User");
                    await setDoc(userRef, {
                        name: newName, coins: 0, stamps: 0, deckIds: [], cardCount: 0,
                        freePlays: 3, lastPlayDate: today
                    });
                }
            },

            startRealtimeListener(uid) {
                const userRef = doc(db, 'artifacts', APP_ID, 'public', 'data', 'accounts', uid);
                this.unsub = onSnapshot(userRef, (docSnap) => {
                    if (docSnap.exists()) {
                        this.userData = docSnap.data();
                        this.updateUI();
                        updateStartScreenInfo();
                    }
                });
            },

            updateUI() {
                if(!this.userData) return;
                const name = this.userData.name || "Unknown";
                const coins = this.userData.coins || 0;
                
                document.getElementById('user-name').textContent = name;
                document.getElementById('user-name-mobile').textContent = name;
                document.getElementById('user-coins').textContent = coins;
                document.getElementById('user-coins-mobile').textContent = coins;
                document.getElementById('free-play-status').textContent = `Free Plays: ${this.userData.freePlays || 0}/3`;
            },

            async payForPlay() {
                if(!this.user || !this.userData) return false;
                const userRef = doc(db, 'artifacts', APP_ID, 'public', 'data', 'accounts', this.user.uid);
                
                if (this.userData.freePlays > 0) {
                    await updateDoc(userRef, { freePlays: increment(-1) });
                    return true;
                } else if (this.userData.coins >= 10) {
                    await updateDoc(userRef, { coins: increment(-10) });
                    return true;
                }
                return false;
            },

            async payForItem(cost) {
                if(!this.user || !this.userData) return false;
                if (this.userData.coins >= cost) {
                    const userRef = doc(db, 'artifacts', APP_ID, 'public', 'data', 'accounts', this.user.uid);
                    await updateDoc(userRef, { coins: increment(-cost) });
                    return true;
                }
                return false;
            },

            async rewardCoin(amount) {
                if(!this.user) return;
                const userRef = doc(db, 'artifacts', APP_ID, 'public', 'data', 'accounts', this.user.uid);
                await updateDoc(userRef, { coins: increment(amount) });
                showToast(`やったね！ +${amount} Coin 獲得！`, 'reward');
                triggerCoinShower(amount);
            }
        };

        window.showToast = function(message, type = 'info') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.textContent = message;
            container.appendChild(toast);
            setTimeout(() => { if(toast.parentNode) toast.remove(); }, 2800);
        }

        window.triggerCoinShower = function(amount) {
            const container = document.body;
            const count = amount >= 100 ? 30 : amount; 
            
            for (let i = 0; i < count; i++) {
                setTimeout(() => {
                    const coin = document.createElement('div');
                    coin.className = 'falling-coin coin-icon';
                    coin.textContent = 'C';
                    const startX = window.innerWidth / 2 + (Math.random() - 0.5) * 200;
                    coin.style.left = `${startX}px`;
                    container.appendChild(coin);
                    
                    if (i % 2 === 0) SoundManager.playCoinShower();
                    setTimeout(() => coin.remove(), 1200);
                }, i * 100); 
            }
        }

        class GameManager {
            constructor() {
                this.size = 4;
                this.grid = [];
                this.score = 0;
                this.bestScore = localStorage.getItem('dora2048best_cute') || 0;
                
                this.isPlaying = false;
                this.sessionMaxTile = 0;
                this.hammerUsed = false;
                this.hammerModeActive = false;
                
                this.tileContainer = document.getElementById('tile-container');
                this.scoreEl = document.getElementById('score');
                this.bestScoreEl = document.getElementById('best-score');
                this.menuOverlay = document.getElementById('menu-overlay');
                
                this.btnHammer = document.getElementById('btn-hammer');
                this.btnStart = document.getElementById('btn-start-game');
                this.btnRestart = document.getElementById('btn-restart');

                this.bestScoreEl.textContent = this.bestScore;
                
                this.setupInput();
                this.setupButtons();
            }

            setupButtons() {
                this.btnStart.addEventListener('click', async () => {
                    await SoundManager.init();
                    SoundManager.playClick();
                    SoundManager.playBGM();
                    this.btnStart.disabled = true;
                    const success = await EcoSystem.payForPlay();
                    if (success) {
                        this.startGame();
                        showToast('ゲームスタート！がんばってね🎀', 'success');
                    } else {
                        showToast('Coinが足りないみたい…', 'error');
                        this.btnStart.disabled = false;
                    }
                });

                this.btnRestart.addEventListener('click', async () => {
                    await SoundManager.init();
                    SoundManager.playClick();
                    if(this.isPlaying && !confirm("今のゲームをはじめからやり直す？(使ったCoinは戻らないよ)")) return;
                    this.showMenu("もういちど？");
                });

                this.btnHammer.addEventListener('click', async () => {
                    await SoundManager.init();
                    SoundManager.playClick();
                    if (this.hammerUsed || this.hammerModeActive) return;
                    
                    if (EcoSystem.userData && EcoSystem.userData.coins < 10) {
                        showToast('Coinが足りないみたい…', 'error');
                        return;
                    }

                    this.btnHammer.disabled = true;
                    const success = await EcoSystem.payForItem(10);
                    if (success) {
                        this.hammerModeActive = true;
                        this.hammerUsed = true;
                        document.getElementById('board').classList.add('hammer-mode');
                        showToast('ポンッ！と消したいタイルをタップしてね！', 'info');
                    } else {
                        this.btnHammer.disabled = false;
                    }
                });
            }

            showMenu(title) {
                this.isPlaying = false;
                document.getElementById('overlay-title').textContent = title;
                this.menuOverlay.classList.add('active');
                updateStartScreenInfo();
            }

            startGame() {
                this.grid = Array(this.size).fill(null).map(() => Array(this.size).fill(null));
                this.score = 0;
                this.sessionMaxTile = 0;
                this.hammerUsed = false;
                this.hammerModeActive = false;
                this.isPlaying = true;
                
                this.updateScore(0);
                this.menuOverlay.classList.remove('active');
                document.getElementById('board').classList.remove('hammer-mode');
                this.updateHammerButton();
                this.tileContainer.innerHTML = '';
                
                this.addRandomTile();
                this.addRandomTile();
                
                this.updateSessionMax();
                this.render();
            }

            updateHammerButton() {
                if (!this.isPlaying || this.hammerUsed) {
                    this.btnHammer.disabled = true;
                } else {
                    this.btnHammer.disabled = false;
                }
            }

            getAvailableCells() {
                const cells = [];
                for (let r = 0; r < this.size; r++) {
                    for (let c = 0; c < this.size; c++) {
                        if (!this.grid[r][c]) cells.push({r, c});
                    }
                }
                return cells;
            }

            addRandomTile() {
                const cells = this.getAvailableCells();
                if (cells.length === 0) return;
                
                const randomCell = cells[Math.floor(Math.random() * cells.length)];
                const value = Math.random() < 0.9 ? 2 : 4;
                
                this.grid[randomCell.r][randomCell.c] = {
                    value: value, isNew: true, isMerged: false,
                    id: Math.random().toString(36).substr(2, 9)
                };
            }

            updateScore(addition) {
                this.score += addition;
                this.scoreEl.textContent = this.score;
                if (this.score > this.bestScore) {
                    this.bestScore = this.score;
                    this.bestScoreEl.textContent = this.bestScore;
                    localStorage.setItem('dora2048best_cute', this.bestScore);
                }
            }

            checkReward(mergedValue) {
                if (mergedValue > this.sessionMaxTile) {
                    this.sessionMaxTile = mergedValue;
                    SoundManager.playReward();
                    
                    let rewardAmount = 1;
                    if (mergedValue >= 2048) {
                        rewardAmount = 100;
                    } else if (mergedValue >= 512) {
                        rewardAmount = 6;
                    } else if (mergedValue >= 64) {
                        rewardAmount = 3;
                    }

                    EcoSystem.rewardCoin(rewardAmount);
                }
            }

            updateSessionMax() {
                let max = 0;
                for (let r = 0; r < this.size; r++) {
                    for (let c = 0; c < this.size; c++) {
                        if (this.grid[r][c] && this.grid[r][c].value > max) {
                            max = this.grid[r][c].value;
                        }
                    }
                }
                this.sessionMaxTile = max;
            }

            move(direction) {
                if (!this.isPlaying || this.hammerModeActive) return;

                let moved = false;
                let scoreAddition = 0;
                let frameMaxMergedValue = 0;
                let isMergedAction = false;
                
                const vector = this.getVector(direction);
                const traversals = this.buildTraversals(vector);
                
                this.grid.forEach(row => row.forEach(cell => {
                    if (cell) {
                        cell.isNew = false;
                        cell.isMerged = false;
                    }
                }));

                traversals.x.forEach(x => {
                    traversals.y.forEach(y => {
                        const cell = {r: y, c: x};
                        const tile = this.grid[y][x];

                        if (tile) {
                            const positions = this.findFarthestPosition(cell, vector);
                            const next = this.grid[positions.next.r]?.[positions.next.c];

                            if (next && next.value === tile.value && !next.isMerged) {
                                const newValue = tile.value * 2;
                                this.grid[positions.next.r][positions.next.c] = {
                                    value: newValue, isMerged: true, id: tile.id 
                                };
                                this.grid[y][x] = null;
                                scoreAddition += newValue;
                                moved = true;
                                isMergedAction = true;
                                
                                if (newValue > frameMaxMergedValue) frameMaxMergedValue = newValue;

                            } else if (positions.farthest.r !== y || positions.farthest.c !== x) {
                                this.grid[positions.farthest.r][positions.farthest.c] = tile;
                                this.grid[y][x] = null;
                                moved = true;
                            }
                        }
                    });
                });

                if (moved) {
                    if (isMergedAction) {
                        SoundManager.playMerge();
                    } else {
                        SoundManager.playMove();
                    }
                    
                    this.addRandomTile();
                    this.updateScore(scoreAddition);
                    
                    if (frameMaxMergedValue > 0) {
                        this.checkReward(frameMaxMergedValue);
                    }
                    
                    this.render();
                    
                    if (!this.movesAvailable()) {
                        this.isPlaying = false;
                        setTimeout(() => this.showMenu("おつかれさま！"), 1000);
                    }
                }
            }

            getVector(direction) {
                const map = { 0: { x: 0, y: -1 }, 1: { x: 1, y: 0 }, 2: { x: 0, y: 1 }, 3: { x: -1, y: 0 } };
                return map[direction];
            }
            buildTraversals(vector) {
                const traversals = { x: [], y: [] };
                for (let pos = 0; pos < this.size; pos++) { traversals.x.push(pos); traversals.y.push(pos); }
                if (vector.x === 1) traversals.x.reverse();
                if (vector.y === 1) traversals.y.reverse();
                return traversals;
            }
            findFarthestPosition(cell, vector) {
                let previous;
                do {
                    previous = cell;
                    cell = { r: previous.r + vector.y, c: previous.c + vector.x };
                } while (this.withinBounds(cell) && !this.grid[cell.r][cell.c]);
                return { farthest: previous, next: cell };
            }
            withinBounds(position) {
                return position.r >= 0 && position.r < this.size && position.c >= 0 && position.c < this.size;
            }
            movesAvailable() {
                if (this.getAvailableCells().length > 0) return true;
                for (let r = 0; r < this.size; r++) {
                    for (let c = 0; c < this.size; c++) {
                        const tile = this.grid[r][c];
                        for (let d = 0; d < 4; d++) {
                            const vector = this.getVector(d);
                            const nextR = r + vector.y;
                            const nextC = c + vector.x;
                            if (this.withinBounds({r: nextR, c: nextC})) {
                                if (this.grid[nextR][nextC].value === tile.value) return true;
                            }
                        }
                    }
                }
                return false;
            }

            handleHammerTap(r, c) {
                if (!this.hammerModeActive) return;
                
                if (this.grid[r][c]) {
                    SoundManager.playHammer();
                    this.grid[r][c] = null; 
                    this.hammerModeActive = false;
                    document.getElementById('board').classList.remove('hammer-mode');
                    this.updateHammerButton();
                    showToast('キラン✨と消したよ！', 'success');
                    this.render();
                    
                    if (!this.movesAvailable()) {
                        this.isPlaying = false;
                        setTimeout(() => this.showMenu("おつかれさま！"), 1000);
                    }
                }
            }

            render() {
                this.tileContainer.innerHTML = '';

                for (let r = 0; r < this.size; r++) {
                    for (let c = 0; c < this.size; c++) {
                        const tileData = this.grid[r][c];
                        if (tileData) {
                            const el = document.createElement('div');
                            let colorClass = tileData.value <= 2048 ? `tile-${tileData.value}` : 'tile-super';
                            el.className = `tile ${colorClass}`;
                            el.textContent = tileData.value;
                            
                            const percent = (100 / this.size);
                            const gapAdjust = 10;
                            const calcLeft = `calc(${c * percent}% + ${c * gapAdjust / 3}px)`;
                            const calcTop = `calc(${r * percent}% + ${r * gapAdjust / 3}px)`;
                            
                            el.style.left = calcLeft;
                            el.style.top = calcTop;

                            if (tileData.isNew) el.classList.add('tile-new');
                            if (tileData.isMerged) el.classList.add('tile-merged');

                            el.onclick = () => {
                                if (this.hammerModeActive) this.handleHammerTap(r, c);
                            };

                            this.tileContainer.appendChild(el);
                        }
                    }
                }
            }

            setupInput() {
                document.addEventListener('keydown', async (e) => {
                    await SoundManager.init();
                    if (this.hammerModeActive) return;
                    const map = { 'ArrowUp': 0, 'w': 0, 'ArrowRight': 1, 'd': 1, 'ArrowDown': 2, 's': 2, 'ArrowLeft': 3, 'a': 3 };
                    if (map[e.key] !== undefined) {
                        e.preventDefault();
                        this.move(map[e.key]);
                    }
                });

                let touchStartX, touchStartY;
                const boardEl = document.getElementById('board');

                boardEl.addEventListener('touchstart', async (e) => {
                    await SoundManager.init();
                    if (this.hammerModeActive) return;
                    touchStartX = e.touches[0].clientX;
                    touchStartY = e.touches[0].clientY;
                    if(e.target === boardEl || e.target.classList.contains('grid-cell')) {
                        e.preventDefault();
                    }
                }, {passive: false});

                boardEl.addEventListener('touchmove', (e) => {
                    if (!this.hammerModeActive && (e.target === boardEl || e.target.classList.contains('grid-cell') || e.target.closest('.tile-container'))) {
                        e.preventDefault(); 
                    }
                }, {passive: false});

                boardEl.addEventListener('touchend', (e) => {
                    if (this.hammerModeActive || !touchStartX || !touchStartY) return;
                    
                    const touchEndX = e.changedTouches[0].clientX;
                    const touchEndY = e.changedTouches[0].clientY;
                    
                    const dx = touchEndX - touchStartX;
                    const dy = touchEndY - touchStartY;
                    
                    if (Math.max(Math.abs(dx), Math.abs(dy)) > 30) {
                        if (Math.abs(dx) > Math.abs(dy)) this.move(dx > 0 ? 1 : 3);
                        else this.move(dy > 0 ? 2 : 0);
                    }
                    
                    touchStartX = null;
                    touchStartY = null;
                });
            }
        }

        let game;
        
        function updateStartScreenInfo() {
            if(!EcoSystem.userData) return;
            const costDisplay = document.getElementById('cost-display');
            const startBtn = document.getElementById('btn-start-game');
            
            if (EcoSystem.userData.freePlays > 0) {
                costDisplay.textContent = "1 Free Play";
                costDisplay.className = "font-black text-xl text-emerald-400 font-cute";
                startBtn.disabled = false;
            } else {
                costDisplay.textContent = "10 Coin";
                costDisplay.className = "font-black text-xl text-amber-500 font-cute";
                if (EcoSystem.userData.coins < 10) {
                    costDisplay.textContent += " (たりないよ)";
                    costDisplay.className = "font-black text-xl text-rose-400 font-cute";
                    startBtn.disabled = true;
                } else {
                    startBtn.disabled = false;
                }
            }
        }

        window.onload = () => {
            EcoSystem.init();
            game = new GameManager();
        };
    </script>

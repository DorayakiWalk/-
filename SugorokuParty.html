<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sugoroku Party DX</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --board-bg: #064e3b;
            --path-color: rgba(255, 255, 255, 0.4);
        }
        body {
            font-family: 'M PLUS Rounded 1c', sans-serif;
            background-color: #111827;
            color: #f3f4f6;
            user-select: none;
            overflow: hidden;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }
        
        .board-container {
            position: relative;
            width: 100%;
            height: 100%;
            overflow-y: auto;
            overflow-x: hidden;
            scroll-behavior: smooth;
            background: radial-gradient(circle at center, #047857 0%, var(--board-bg) 100%);
            /* Checkered pattern overlay */
            background-image: repeating-linear-gradient(45deg, rgba(0,0,0,0.05) 25%, transparent 25%, transparent 75%, rgba(0,0,0,0.05) 75%, rgba(0,0,0,0.05)), repeating-linear-gradient(45deg, rgba(0,0,0,0.05) 25%, transparent 25%, transparent 75%, rgba(0,0,0,0.05) 75%, rgba(0,0,0,0.05));
            background-position: 0 0, 20px 20px;
            background-size: 40px 40px;
        }
        
        .board-container::-webkit-scrollbar { display: none; }
        .board-container { -ms-overflow-style: none; scrollbar-width: none; }
        
        .square {
            position: absolute;
            width: 64px;
            height: 64px;
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 6px 0 rgba(0,0,0,0.2), inset 0 -4px 0 rgba(0,0,0,0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            font-weight: 900;
            color: #1f2937;
            z-index: 10;
            transform: translate(-50%, -50%);
            transition: transform 0.2s;
        }
        .square::after {
            content: ''; position: absolute; inset: 0; border-radius: 16px; box-shadow: inset 0 4px 6px rgba(255,255,255,0.5); pointer-events: none;
        }
        .square.normal { border: 3px solid #9ca3af; }
        .square.item { background: #fef08a; border: 3px solid #eab308; }
        .square.rocket { background: #bfdbfe; border: 3px solid #3b82f6; }
        .square.start { background: #bbf7d0; border: 3px solid #22c55e; }
        .square.goal { background: #fecdd3; border: 3px solid #e11d48; }

        .player-token {
            position: absolute;
            width: 56px;
            height: 56px;
            transform: translate(-50%, -70%);
            z-index: 20;
            transition: left 0.4s cubic-bezier(0.34, 1.56, 0.64, 1), top 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            filter: drop-shadow(0 6px 4px rgba(0,0,0,0.4));
            will-change: left, top, transform;
        }

        @keyframes iris-in {
            0% { clip-path: circle(0% at 50% 50%); }
            100% { clip-path: circle(150% at 50% 50%); }
        }
        @keyframes iris-out {
            0% { clip-path: circle(150% at 50% 50%); }
            100% { clip-path: circle(0% at 50% 50%); }
        }
        .anim-iris-in { animation: iris-in 0.8s cubic-bezier(0.25, 1, 0.5, 1) forwards; }
        .anim-iris-out { animation: iris-out 0.8s cubic-bezier(0.25, 1, 0.5, 1) forwards; }

        @keyframes jump {
            0% { transform: translate(-50%, -70%); }
            50% { transform: translate(-50%, -200%) scale(1.2) rotate(10deg); filter: drop-shadow(0 20px 10px rgba(0,0,0,0.3)); }
            100% { transform: translate(-50%, -70%); }
        }
        .anim-jump { animation: jump 0.8s cubic-bezier(0.25, 1, 0.5, 1); z-index: 30; }

        @keyframes shake {
            0%, 100% { margin-left: 0; }
            20%, 60% { margin-left: -8px; transform: translate(-50%, -70%) rotate(-5deg); }
            40%, 80% { margin-left: 8px; transform: translate(-50%, -70%) rotate(5deg); }
        }
        .anim-shake { animation: shake 0.5s ease-in-out; }
        
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-5px); }
        }
        .anim-float { animation: float 2s infinite ease-in-out; }

        @keyframes pop {
            0% { transform: scale(0.8); opacity: 0; }
            50% { transform: scale(1.1); opacity: 1; }
            100% { transform: scale(1); opacity: 1; }
        }
        .anim-pop { animation: pop 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }

        .dice-btn {
            background: linear-gradient(135deg, #ef4444, #b91c1c);
            box-shadow: 0 8px 0 #7f1d1d, 0 15px 15px rgba(0,0,0,0.4), inset 0 4px 4px rgba(255,255,255,0.3);
            transition: transform 0.1s, box-shadow 0.1s;
        }
        .dice-btn:active:not(:disabled) {
            transform: translateY(8px);
            box-shadow: 0 0 0 #7f1d1d, 0 5px 5px rgba(0,0,0,0.4), inset 0 2px 2px rgba(255,255,255,0.3);
        }
        .dice-btn:disabled {
            background: linear-gradient(135deg, #4b5563, #374151);
            box-shadow: 0 8px 0 #1f2937;
            cursor: not-allowed;
            transform: none;
            opacity: 0.8;
        }

        .minigame-ui { display: none; }
        .minigame-ui.active { display: flex; animation: pop 0.4s ease-out forwards; }
        
        .log-window {
            mask-image: linear-gradient(to bottom, transparent, black 10%, black 90%, transparent);
            -webkit-mask-image: linear-gradient(to bottom, transparent, black 20%, black 100%);
        }
    </style>
</head>
<body>
    <div id="app" class="relative w-full h-[100dvh] max-w-[500px] mx-auto bg-gray-900 shadow-2xl overflow-hidden text-sm sm:text-base">
        
        <div id="game-screen" class="absolute inset-0 hidden">
            <!-- Board Canvas -->
            <div id="board-container" class="board-container">
                <canvas id="path-canvas" class="absolute top-0 left-0 pointer-events-none z-0"></canvas>
                <div id="squares-layer" class="absolute top-0 left-0 w-full h-full pointer-events-none"></div>
                <div id="players-layer" class="absolute top-0 left-0 w-full h-full pointer-events-none"></div>
            </div>

            <!-- Leaderboard (Top Left) -->
            <div id="leaderboard" class="absolute top-4 left-4 z-30 bg-black/60 backdrop-blur-sm rounded-xl p-2 border border-gray-600 shadow-lg pointer-events-none flex flex-col gap-1 w-36">
                <!-- Injected dynamically -->
            </div>

            <!-- Action Buttons (Top Right) -->
            <div class="absolute top-4 right-4 z-30 flex flex-col gap-2">
                <button id="btn-center" class="bg-blue-500/90 backdrop-blur hover:bg-blue-400 text-white font-bold py-2 px-3 rounded-full shadow-[0_4px_0_#1d4ed8] active:translate-y-1 active:shadow-none transition border-2 border-blue-300 text-xs sm:text-sm">
                    🎯 自機へ
                </button>
            </div>

            <!-- Logs (Bottom Left) -->
            <div class="absolute bottom-[160px] left-2 w-48 h-32 z-20 pointer-events-none overflow-hidden log-window flex flex-col justify-end pb-2">
                <div id="log-container" class="flex flex-col gap-1 w-full">
                    <!-- Logs injected here -->
                </div>
            </div>

            <!-- Controls (Bottom Center) -->
            <div class="absolute bottom-0 left-0 w-full p-4 pb-6 bg-gradient-to-t from-black via-black/80 to-transparent z-30 flex flex-col items-center pointer-events-none">
                
                <!-- HUD: Items & Debuffs -->
                <div id="hud-info" class="w-full flex justify-between items-end mb-4 pointer-events-auto px-2">
                    <button id="btn-bag" class="relative bg-amber-500 border-2 border-amber-200 text-white p-3 rounded-2xl shadow-[0_4px_0_#b45309] active:translate-y-1 active:shadow-none transition anim-float">
                        <span class="text-xl mr-1">🎒</span> カバン
                        <span id="bag-count" class="absolute -top-3 -right-3 bg-red-600 text-white text-xs font-bold rounded-full w-7 h-7 flex items-center justify-center border-2 border-white shadow-md">0</span>
                    </button>
                    <div id="debuff-indicator" class="hidden bg-purple-600/90 backdrop-blur text-white px-4 py-2 rounded-full text-sm font-bold border-2 border-purple-300 animate-pulse shadow-lg flex items-center gap-2">
                        <span class="text-xl">🍌</span> 効果中
                    </div>
                </div>

                <!-- Dice -->
                <div class="relative pointer-events-auto flex flex-col items-center">
                    <div id="cooldown-bar-bg" class="w-48 h-4 bg-gray-800 rounded-full mb-3 overflow-hidden border-2 border-gray-600 hidden shadow-inner">
                        <div id="cooldown-bar" class="h-full bg-gradient-to-r from-yellow-400 to-yellow-200 w-full origin-left transition-transform duration-100 ease-linear"></div>
                    </div>
                    <button id="btn-dice" class="dice-btn w-24 h-24 sm:w-28 sm:h-28 rounded-3xl flex items-center justify-center text-6xl text-white font-black border-4 border-red-300/50">
                        🎲
                    </button>
                </div>
            </div>
        </div>

        <div id="lobby-screen" class="absolute inset-0 bg-gray-900 z-50 flex flex-col items-center justify-center p-6 bg-[url('data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSI0MCIgaGVpZ2h0PSI0MCI+PGNpcmNsZSBjeD0iMjAiIGN5PSIyMCIgcj0iMiIgZmlsbD0icmdiYSgyNTUsMjU1LDI1NSwwLjEpIi8+PC9zdmc+')]">
            <div class="text-center mb-8 anim-pop">
                <h1 class="text-5xl sm:text-6xl text-transparent bg-clip-text bg-gradient-to-br from-yellow-300 to-orange-500 font-black drop-shadow-[0_4px_10px_rgba(234,179,8,0.5)] italic tracking-wider">SUGOROKU<br>PARTY!</h1>
                <p class="text-yellow-200 font-bold tracking-widest mt-2 bg-black/50 inline-block px-4 py-1 rounded-full text-sm">STREAMER EDITION</p>
            </div>
            
            <div class="bg-gray-800/90 backdrop-blur p-6 rounded-3xl w-full max-w-sm border-4 border-gray-600 shadow-[0_10px_30px_rgba(0,0,0,0.5)] flex flex-col items-center">
                <div class="mb-5 w-full">
                    <label class="block text-gray-300 text-sm font-bold mb-2">なまえ</label>
                    <input type="text" id="input-name" value="Player1" maxlength="10" class="w-full bg-gray-900 text-white rounded-xl p-3 text-center text-xl font-bold border-2 border-gray-600 focus:outline-none focus:border-yellow-400 transition">
                </div>
                
                <div class="mb-5 w-full">
                    <label class="block text-gray-300 text-sm font-bold mb-2">アバター</label>
                    <div class="flex justify-between gap-2">
                        <button class="avatar-select flex-1 py-3 bg-gray-700 rounded-xl border-4 border-yellow-400 text-2xl transition hover:bg-gray-600" data-shape="circle">⚪</button>
                        <button class="avatar-select flex-1 py-3 bg-gray-700 rounded-xl border-4 border-transparent text-2xl transition hover:bg-gray-600" data-shape="cat">🐱</button>
                        <button class="avatar-select flex-1 py-3 bg-gray-700 rounded-xl border-4 border-transparent text-2xl transition hover:bg-gray-600" data-shape="rabbit">🐰</button>
                        <button class="avatar-select flex-1 py-3 bg-gray-700 rounded-xl border-4 border-transparent text-2xl transition hover:bg-gray-600" data-shape="jizo">🗿</button>
                    </div>
                </div>

                <div class="mb-6 w-full flex space-x-4">
                    <div class="flex-1">
                        <label class="block text-gray-300 text-sm font-bold mb-2">からだ色</label>
                        <input type="color" id="input-color-body" value="#3b82f6" class="w-full h-12 rounded-xl cursor-pointer bg-transparent border-0 p-0">
                    </div>
                    <div class="flex-1">
                        <label class="block text-gray-300 text-sm font-bold mb-2">てあし色</label>
                        <input type="color" id="input-color-ext" value="#1d4ed8" class="w-full h-12 rounded-xl cursor-pointer bg-transparent border-0 p-0">
                    </div>
                </div>

                <div class="mb-6 relative">
                    <div class="absolute inset-0 bg-blue-500 blur-xl opacity-20 rounded-full"></div>
                    <img id="avatar-preview" src="" alt="preview" class="relative w-24 h-24 filter drop-shadow-xl anim-float">
                </div>

                <button id="btn-ready" class="w-full bg-gradient-to-b from-green-400 to-green-600 hover:from-green-300 hover:to-green-500 text-white text-2xl font-black py-4 rounded-2xl shadow-[0_6px_0_#166534,0_10px_20px_rgba(0,0,0,0.3)] active:translate-y-2 active:shadow-[0_0_0_#166534] transition border-2 border-green-300">
                    GAME START!
                </button>
                <p id="lobby-status" class="text-xs text-gray-400 mt-4 text-center font-bold">ネットワーク接続確認中...</p>
            </div>
        </div>

        <div id="minigame-screen" class="absolute inset-0 bg-gray-900/95 backdrop-blur-sm z-40 hidden flex-col items-center justify-center p-4">
            
            <!-- VS Header -->
            <div id="mg-header" class="text-center mb-10 w-full max-w-sm anim-pop">
                <h2 class="text-4xl text-transparent bg-clip-text bg-gradient-to-r from-red-400 to-yellow-400 font-black drop-shadow-md mb-4 italic">MINIGAME BATTLE!</h2>
                <div class="flex items-center justify-between bg-black/50 p-4 rounded-3xl border-2 border-gray-600 shadow-xl">
                    <div class="flex flex-col items-center w-1/3">
                        <img id="mg-p1-img" src="" class="w-16 h-16 mb-2 drop-shadow-md">
                        <span id="mg-p1-name" class="text-blue-400 font-bold truncate w-full text-center">P1</span>
                    </div>
                    <div class="text-red-500 text-4xl font-black italic w-1/3 text-center">VS</div>
                    <div class="flex flex-col items-center w-1/3">
                        <img id="mg-p2-img" src="" class="w-16 h-16 mb-2 drop-shadow-md">
                        <span id="mg-p2-name" class="text-green-400 font-bold truncate w-full text-center">P2</span>
                    </div>
                </div>
            </div>

            <!-- Overlays for Countdown and Result -->
            <div id="mg-countdown" class="absolute inset-0 flex items-center justify-center z-50 hidden">
                <span id="mg-countdown-text" class="text-9xl text-white font-black drop-shadow-[0_10px_30px_rgba(255,255,255,0.8)]">3</span>
            </div>

            <div id="mg-result-overlay" class="absolute inset-0 flex flex-col items-center justify-center bg-black/80 backdrop-blur z-50 hidden">
                <span id="mg-result-text" class="text-7xl font-black mb-4 drop-shadow-[0_0_30px_rgba(255,255,255,0.5)] transform scale-150 transition-transform duration-500"></span>
                <div class="bg-gray-800 border-2 border-gray-600 rounded-2xl p-4 text-center anim-pop" style="animation-delay: 0.5s;">
                    <span id="mg-result-sub" class="text-2xl text-white font-bold"></span>
                </div>
            </div>

            <!-- Minigames UI -->
            <div id="mg-mash" class="minigame-ui flex-col items-center w-full max-w-sm">
                <div class="bg-gray-800/80 rounded-2xl p-4 mb-6 text-center border-2 border-gray-600 w-full">
                    <p class="text-lg text-gray-200 font-bold">5秒間ボタンを超連打しろ！</p>
                    <p class="text-5xl mt-2 text-yellow-400 font-mono font-black">⏱ <span id="mg-mash-time">5.0</span></p>
                </div>
                <button id="btn-mg-mash" class="w-48 h-48 rounded-full bg-gradient-to-b from-red-500 to-red-700 text-white text-4xl font-black shadow-[0_12px_0_#7f1d1d,0_10px_20px_rgba(0,0,0,0.5)] active:translate-y-3 active:shadow-[0_0_0_#7f1d1d] border-4 border-red-300 flex flex-col items-center justify-center transition-transform">
                    連打!!<br><span id="mg-mash-score" class="text-3xl text-yellow-200 mt-2">0</span>
                </button>
            </div>

            <div id="mg-gauge" class="minigame-ui flex-col items-center w-full max-w-sm">
                <div class="bg-gray-800/80 rounded-2xl p-4 mb-8 text-center border-2 border-gray-600 w-full">
                    <p class="text-lg text-gray-200 font-bold mb-4">MAX(100)を狙って止めろ！</p>
                    <div class="w-full h-12 bg-gray-900 rounded-full border-4 border-gray-600 relative overflow-hidden">
                        <div id="mg-gauge-bar" class="absolute top-0 left-0 h-full bg-gradient-to-r from-green-400 via-yellow-400 to-red-500 w-[50%]"></div>
                        <div class="absolute top-0 left-[98%] w-1 h-full bg-white z-10 shadow-[0_0_10px_white]"></div>
                    </div>
                </div>
                <p id="mg-gauge-val" class="text-6xl font-black mb-6 text-white drop-shadow-lg hidden">0</p>
                <button id="btn-mg-gauge" class="w-full py-5 bg-blue-600 hover:bg-blue-500 text-white text-3xl font-black rounded-2xl shadow-[0_8px_0_#1e3a8a] active:translate-y-2 active:shadow-[0_0_0_#1e3a8a] border-2 border-blue-400">STOP!</button>
            </div>

            <div id="mg-roulette" class="minigame-ui flex-col items-center w-full max-w-sm">
                <div class="bg-gray-800/80 rounded-2xl p-4 mb-8 text-center border-2 border-gray-600 w-full">
                    <p class="text-lg text-gray-200 font-bold mb-4">大きい数字を出せ！</p>
                    <div class="w-40 h-40 mx-auto bg-white rounded-3xl flex items-center justify-center text-7xl text-gray-900 font-black border-8 border-yellow-400 shadow-inner">
                        <span id="mg-roulette-num">??</span>
                    </div>
                </div>
                <button id="btn-mg-roulette" class="w-full py-5 bg-blue-600 hover:bg-blue-500 text-white text-3xl font-black rounded-2xl shadow-[0_8px_0_#1e3a8a] active:translate-y-2 active:shadow-[0_0_0_#1e3a8a] border-2 border-blue-400">STOP!</button>
            </div>

            <div id="mg-rps" class="minigame-ui flex-col items-center w-full max-w-sm">
                <div class="bg-gray-800/80 rounded-2xl p-4 mb-8 text-center border-2 border-gray-600 w-full">
                    <p class="text-lg text-gray-200 font-bold">時間内に手を選べ！</p>
                    <p class="text-5xl mt-2 text-yellow-400 font-mono font-black">⏱ <span id="mg-rps-time">3.0</span></p>
                </div>
                <div class="flex space-x-4 w-full justify-center">
                    <button class="btn-mg-rps flex-1 aspect-square bg-gradient-to-b from-gray-600 to-gray-800 text-6xl rounded-3xl border-4 border-gray-400 shadow-[0_8px_0_#374151] active:translate-y-2 active:shadow-none transition" data-hand="0">✊</button>
                    <button class="btn-mg-rps flex-1 aspect-square bg-gradient-to-b from-gray-600 to-gray-800 text-6xl rounded-3xl border-4 border-gray-400 shadow-[0_8px_0_#374151] active:translate-y-2 active:shadow-none transition" data-hand="1">✌️</button>
                    <button class="btn-mg-rps flex-1 aspect-square bg-gradient-to-b from-gray-600 to-gray-800 text-6xl rounded-3xl border-4 border-gray-400 shadow-[0_8px_0_#374151] active:translate-y-2 active:shadow-none transition" data-hand="2">✋</button>
                </div>
            </div>

            <div id="mg-just10" class="minigame-ui flex-col items-center w-full max-w-sm">
                <div class="bg-gray-800/80 rounded-2xl p-4 mb-8 text-center border-2 border-gray-600 w-full">
                    <p class="text-lg text-gray-200 font-bold mb-2">10秒ピッタリで止めろ！</p>
                    <p class="text-sm text-gray-400 mb-4">(途中でタイマーが隠れるぞ)</p>
                    <div class="bg-black py-4 rounded-xl border border-gray-700">
                        <p class="text-6xl font-mono font-black text-white tracking-widest"><span id="mg-just10-time">0.00</span></p>
                    </div>
                </div>
                <button id="btn-mg-just10" class="w-full py-5 bg-green-500 hover:bg-green-400 text-white text-3xl font-black rounded-2xl shadow-[0_8px_0_#166534] active:translate-y-2 active:shadow-[0_0_0_#166534] border-2 border-green-300">START!</button>
            </div>
        </div>

        <!-- Iris Transition -->
        <div id="iris-overlay" class="absolute inset-0 bg-black pointer-events-none z-[60] hidden clip-path-circle-0"></div>

        <!-- Item Bag Modal -->
        <div id="modal-items" class="absolute inset-0 bg-black/80 backdrop-blur-sm z-50 hidden flex-col items-center justify-center p-4">
            <div class="bg-gray-800 w-full max-w-sm p-6 rounded-3xl border-4 border-amber-500 shadow-2xl anim-pop">
                <div class="flex items-center justify-between mb-6 border-b-2 border-gray-600 pb-2">
                    <h3 class="text-2xl font-black text-white flex items-center"><span class="text-3xl mr-2">🎒</span> カバン</h3>
                    <button id="btn-close-items" class="text-gray-400 hover:text-white text-2xl font-bold bg-gray-700 w-8 h-8 rounded-full flex items-center justify-center leading-none">&times;</button>
                </div>
                <div id="item-list" class="flex flex-col space-y-3 max-h-72 overflow-y-auto pr-2 scrollbar-hide">
                    <!-- Items injected here -->
                </div>
                <div id="item-empty" class="text-gray-400 text-center py-8 font-bold flex flex-col items-center hidden">
                    <span class="text-4xl mb-2 opacity-50">💨</span>
                    アイテムを持っていません
                </div>
            </div>
        </div>

        <!-- Target Selection Modal -->
        <div id="modal-target" class="absolute inset-0 bg-black/80 backdrop-blur-sm z-50 hidden flex-col items-center justify-center p-4">
            <div class="bg-gray-800 w-full max-w-sm p-6 rounded-3xl border-4 border-blue-500 shadow-2xl anim-pop">
                <h3 class="text-2xl font-black text-white mb-6 text-center">だれに使う？</h3>
                <div id="target-list" class="flex flex-col space-y-3">
                    <!-- Targets injected here -->
                </div>
                <button id="btn-cancel-target" class="mt-6 w-full py-3 bg-gray-600 hover:bg-gray-500 rounded-xl text-white font-bold active:translate-y-1 shadow-[0_4px_0_#374151] active:shadow-none border border-gray-400">キャンセル</button>
            </div>
        </div>

    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        
        // Settings & Constants
        const BOARD_SIZE = 40;
        const COLS = 5;
        const CELL_SIZE = 64;
        const SPACING = 24;
        const BOARD_WIDTH = 500;
        
        const itemTypes = [
            { id: 'shell', icon: '🐢', name: 'カメのこうら', desc: '相手を2マス戻す' },

        let synth;
        async function setupAudio() {
            if (audioInit) return;
            await Tone.start();
            synth = new Tone.PolySynth(Tone.Synth, {
                oscillator: { type: 'triangle' },
                envelope: { attack: 0.02, decay: 0.1, sustain: 0.2, release: 0.5 }
            }).toDestination();
            synth.volume.value = -8;
            audioInit = true;
        }

        function playSound(type) {
            if (!synth) return;
            try {
                const now = Tone.now();
                switch(type) {
                    case 'move': synth.triggerAttackRelease("G5", "32n", now); break;
                    case 'dice': synth.triggerAttackRelease("C6", "64n", now); break;
                    case 'dice-res': synth.triggerAttackRelease(["C5", "E5", "G5"], "16n", now); break;
                    case 'rocket': 
                        synth.triggerAttackRelease("C4", "16n", now);
                        synth.triggerAttackRelease("G4", "8n", now + 0.1);
                        synth.triggerAttackRelease("C5", "4n", now + 0.2);
                        break;
                    case 'item-get': synth.triggerAttackRelease(["E5", "G5", "C6"], "8n", now); break;
                    case 'item-use': synth.triggerAttackRelease("C4", "8n", now); synth.triggerAttackRelease("F3", "4n", now + 0.1); break;
                    case 'win': synth.triggerAttackRelease(["C5", "E5", "G5", "C6"], "2n", now); break;
                    case 'lose': synth.triggerAttackRelease(["C4", "Eb4", "Gb4"], "2n", now); break;
                    case 'count': synth.triggerAttackRelease("G5", "16n", now); break;
                    case 'start': synth.triggerAttackRelease("C6", "4n", now); break;
                    case 'hit': synth.triggerAttackRelease("C4", "32n", now); break;
                }
            } catch(e) {}
        }

        function addLog(msg, type = 'normal') {
            const el = document.createElement('div');
            el.className = `text-xs sm:text-sm font-bold bg-black/70 backdrop-blur px-2 py-1 rounded-md w-fit max-w-full break-words shadow-sm border-l-4 transition-all duration-300 opacity-0 transform translate-x-4`;
            
            if (type === 'system') el.classList.add('border-blue-500', 'text-blue-200');
            else if (type === 'action') el.classList.add('border-yellow-500', 'text-yellow-200');
            else if (type === 'danger') el.classList.add('border-red-500', 'text-red-200');
            else el.classList.add('border-gray-500', 'text-gray-200');

            el.textContent = msg;
            els.logCont.appendChild(el);
            
            // Animate in
            requestAnimationFrame(() => {
                el.classList.remove('opacity-0', 'translate-x-4');
            });

            // Keep only last 5 logs
            if (els.logCont.children.length > 5) {
                const old = els.logCont.firstChild;
                old.classList.add('opacity-0', '-translate-y-4');
                setTimeout(() => old.remove(), 300);
            }
        }

        function drawAvatar(shape, bColor, eColor) {
            const canvas = document.createElement('canvas');
            canvas.width = 80; canvas.height = 80;
            const ctx = canvas.getContext('2d');
            ctx.lineJoin = 'round';
            
            // Shadow
            ctx.fillStyle = 'rgba(0,0,0,0.2)';
            ctx.beginPath(); ctx.ellipse(40, 70, 20, 6, 0, 0, Math.PI*2); ctx.fill();

            // 1. Back Layer (Ears, Limbs)
            ctx.fillStyle = eColor;
            ctx.strokeStyle = 'rgba(0,0,0,0.1)'; ctx.lineWidth = 2;
            if (shape === 'cat') {
                ctx.beginPath(); ctx.moveTo(20, 30); ctx.lineTo(12, 10); ctx.lineTo(32, 22); ctx.fill(); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(60, 30); ctx.lineTo(68, 10); ctx.lineTo(48, 22); ctx.fill(); ctx.stroke();
            } else if (shape === 'rabbit') {
                ctx.beginPath(); ctx.ellipse(26, 20, 8, 24, -0.2, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
                ctx.beginPath(); ctx.ellipse(54, 20, 8, 24, 0.2, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
            }
            // Feet (All except jizo)
            if (shape !== 'jizo') {
                ctx.beginPath(); ctx.arc(26, 64, 10, 0, Math.PI*2); ctx.fill(); ctx.stroke();
                ctx.beginPath(); ctx.arc(54, 64, 10, 0, Math.PI*2); ctx.fill(); ctx.stroke();
            }

            // 2. Body Layer
            ctx.fillStyle = bColor;
            if (shape === 'jizo') {
                ctx.beginPath(); ctx.moveTo(40, 36); ctx.lineTo(20, 70); ctx.lineTo(60, 70); ctx.fill(); ctx.stroke();
                ctx.beginPath(); ctx.arc(40, 40, 18, 0, Math.PI*2); ctx.fill(); ctx.stroke();
            } else {
                ctx.beginPath(); ctx.arc(40, 46, 24, 0, Math.PI*2); ctx.fill(); ctx.stroke();
            }

            // 3. Front Layer (Face, Details)
            ctx.fillStyle = '#111';
            if (shape === 'jizo') {
                // Kasa (Hat)
                ctx.fillStyle = '#b45309';
                ctx.beginPath(); ctx.moveTo(40, 16); ctx.lineTo(10, 32); ctx.lineTo(70, 32); ctx.fill();
                ctx.strokeStyle = '#78350f'; ctx.lineWidth=3; ctx.stroke();
                // Eyes
                ctx.fillStyle = '#111';
                ctx.beginPath(); ctx.arc(34, 40, 2, 0, Math.PI*2); ctx.fill();
                ctx.beginPath(); ctx.arc(46, 40, 2, 0, Math.PI*2); ctx.fill();
            } else {
                // Eyes
                ctx.beginPath(); ctx.arc(32, 42, 3, 0, Math.PI*2); ctx.fill();
                ctx.beginPath(); ctx.arc(48, 42, 3, 0, Math.PI*2); ctx.fill();
                // Blush
                ctx.fillStyle = 'rgba(255, 100, 100, 0.5)';
                ctx.beginPath(); ctx.arc(24, 46, 4, 0, Math.PI*2); ctx.fill();
                ctx.beginPath(); ctx.arc(56, 46, 4, 0, Math.PI*2); ctx.fill();
            }
            
            return canvas.toDataURL();
        }

        function createBoard() {
            const rows = Math.ceil(BOARD_SIZE / COLS);
            const contentHeight = rows * (CELL_SIZE + SPACING) + 120; // Padding
            state.startY = contentHeight - 80;
            
            els.sqLayer.style.height = `${contentHeight}px`;
            els.pLayer.style.height = `${contentHeight}px`;
            els.pathCv.height = contentHeight;
            els.pathCv.width = BOARD_WIDTH;

            const actualW = els.boardCont.clientWidth || BOARD_WIDTH;
            const xOff = (actualW - (COLS * CELL_SIZE + (COLS - 1) * SPACING)) / 2 + CELL_SIZE / 2;

            els.sqLayer.innerHTML = '';
            state.squares = [];

            for (let i = 0; i < BOARD_SIZE; i++) {
                const r = Math.floor(i / COLS);
                const c = r % 2 === 0 ? i % COLS : (COLS - 1) - (i % COLS); // Z-pattern
                
                const x = xOff + c * (CELL_SIZE + SPACING);
                const y = state.startY - r * (CELL_SIZE + SPACING);
                
                let type = 'normal', content = i;
                if (i === 0) { type = 'start'; content = 'GO'; }
                else if (i === BOARD_SIZE - 1) { type = 'goal'; content = 'GOAL'; }
                else if (i % 7 === 0) { type = 'item'; content = '🎁'; }
                else if (i % 11 === 0) { type = 'rocket'; content = '🚀'; }
                
                state.squares.push({ x, y, type });

                const sqEl = document.createElement('div');
                sqEl.className = `square ${type}`;
                sqEl.style.left = `${x}px`;
                sqEl.style.top = `${y}px`;
                
                let inner = content;
                if(type==='start' || type==='goal') inner = `<span class="text-lg">${content}</span>`;
                else if(type==='normal') inner = `<span class="text-xl opacity-30">${content}</span>`;
                sqEl.innerHTML = inner;
                els.sqLayer.appendChild(sqEl);
            }

            // Draw Path
            const ctx = els.pathCv.getContext('2d');
            ctx.clearRect(0, 0, els.pathCv.width, els.pathCv.height);
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.4)';
            ctx.lineWidth = 14;
            ctx.lineJoin = 'round';
            ctx.lineCap = 'round';
            ctx.setLineDash([20, 20]);
            
            ctx.beginPath();
            state.squares.forEach((sq, i) => {
                if (i === 0) ctx.moveTo(sq.x, sq.y);
                else ctx.lineTo(sq.x, sq.y);
            });
            ctx.stroke();
        }

        function updateAllPlayerDOMs() {
            Object.keys(state.players).forEach(id => {
                let el = document.getElementById(id);
                const p = state.players[id];
                if (!el) {
                    el = document.createElement('img');
                    el.id = id;
                    el.className = 'player-token';
                    el.src = drawAvatar(p.shape, p.colorB, p.colorE);
                    els.pLayer.appendChild(el);
                }
                
                const sq = state.squares[p.pos];
                if (sq) {
                    // Calculate offset to prevent stacking
                    let samePos = Object.values(state.players).filter(op => op.pos === p.pos);
                    let idx = samePos.findIndex(op => op === p);
                    let ox = 0, oy = 0;
                    if (samePos.length > 1) {
                        const angle = (Math.PI * 2 / samePos.length) * idx;
                        const radius = 10;
                        ox = Math.cos(angle) * radius;
                        oy = Math.sin(angle) * radius;
                    }

                    el.style.left = `${sq.x + ox}px`;
                    el.style.top = `${sq.y + oy}px`;
                    
                    // Face direction (right on even rows, left on odd)
                    const row = Math.floor(p.pos / COLS);
                    const scaleX = row % 2 !== 0 ? -1 : 1;
                    el.style.transform = `translate(-50%, -70%) scaleX(${scaleX})`;
                }
            });
            updateLeaderboard();
        }

        function centerCamOn(posIdx) {
            const sq = state.squares[Math.min(posIdx, BOARD_SIZE-1)];
            if (!sq) return;
            const target = sq.y - els.boardCont.clientHeight / 2;
            els.boardCont.scrollTo({ top: target, behavior: 'smooth' });
        }

            else els.debuffInd.classList.add('hidden');

        function updateLeaderboard() {
            els.leaderboard.innerHTML = '';
            const sorted = Object.entries(state.players).sort((a, b) => b[1].pos - a[1].pos);
            sorted.forEach(([id, p], i) => {
                const isMe = id === state.myId;

                row.innerHTML = `

                `;

        async function rollDice(playerId) {
            const p = state.players[playerId];
            if (!p || p.moving || battle.active) return;
            p.moving = true;

            const isMe = playerId === state.myId;
            let roll = Math.floor(Math.random() * 6) + 1;

            if (isMe) {
                isRolling = true;
                els.btnDice.disabled = true;
                els.cdBarBg.classList.add('hidden');
                
                // Dice Animation
                const faces = ['⚀','⚁','⚂','⚃','⚄','⚅'];
                for (let i = 0; i < 12; i++) {
                    els.btnDice.innerHTML = faces[Math.floor(Math.random() * 6)];
                    playSound('dice');
                    await sleep(60);
                }
                
                if (p.debuff === 'banana') {
                    roll = Math.ceil(roll / 2);
                    addLog('バナナ効果で出目が半減！', 'danger');
                    p.debuff = null;
                    updateHUD();
                }
                
                playSound('dice-res');
                els.btnDice.innerHTML = `<span class="text-yellow-300 drop-shadow-md">${roll}</span>`;
                els.btnDice.classList.add('anim-pop');
                addLog(`${p.name} が ${roll} を出した！`);
                await sleep(600);
                els.btnDice.classList.remove('anim-pop');
            } else {
                // CPU handling
                if (p.debuff === 'banana') { roll = Math.ceil(roll / 2); p.debuff = null; }
                addLog(`${p.name} が ${roll} を進む`);
            }

            // Move step by step
            for (let i = 0; i < roll; i++) {
                if (p.pos >= BOARD_SIZE - 1) break;
                p.pos++;
                updateAllPlayerDOMs();
                if (isMe) {
                    playSound('move');
                    centerCamOn(p.pos);
                }
                await sleep(250);
            }

            // Square Effects
            const sq = state.squares[p.pos];
            if (p.pos >= BOARD_SIZE - 1) {
                p.pos = BOARD_SIZE - 1;
                updateAllPlayerDOMs();
                if(isMe) {
                    addLog('🎉 ゴール到達！！', 'action');
                    playSound('win');
                } else {
                    addLog(`🏁 ${p.name}がゴール！`);
                }
            } else {
                if (sq.type === 'item') {
                    const item = itemTypes[Math.floor(Math.random() * itemTypes.length)];
                    p.items.push(item.id);
                    if (isMe) {
                        playSound('item-get');
                        addLog(`${item.name} をゲット！`, 'action');
                        updateHUD();
                    } else {
                        addLog(`${p.name} がアイテム獲得`);
                    }
                } else if (sq.type === 'rocket') {
                    if (isMe) playSound('rocket');
                    addLog(`🚀 ${p.name} がロケットで飛ぶ！`);
                    const el = document.getElementById(playerId);
                    el.classList.add('anim-jump');
                    await sleep(400);
                    p.pos = Math.min(BOARD_SIZE - 1, p.pos + 3);
                    updateAllPlayerDOMs();
                    if(isMe) centerCamOn(p.pos);
                    await sleep(400);
                    el.classList.remove('anim-jump');
                }
            }

            p.moving = false;

            // Check Battle Collision
            if (p.pos > 0 && p.pos < BOARD_SIZE - 1) {
                const collisions = Object.keys(state.players).filter(id => id !== playerId && state.players[id].pos === p.pos);
                if (collisions.length > 0) {
                    const targetId = collisions[0];
                    // Trigger battle ONLY if player is involved (skip CPU vs CPU for pacing)
                    if (playerId === state.myId || targetId === state.myId) {
                        await startBattle(playerId, targetId);
                    } else {
                        addLog(`⚔️ ${p.name} と ${state.players[targetId].name} がすれ違った`);
                    }
                }
            }

            // Reset CD for self
            if (isMe) {
                els.btnDice.innerHTML = '🎲';
                myCooldown = Math.random() * 2000 + 3000;
                isRolling = false;
                els.cdBarBg.classList.remove('hidden');
            } else {
                p.cooldown = Math.random() * 3000 + 4000;
            }
        }

        function applyItem(itemId, targetId, userName) {
            const t = state.players[targetId];
            if (!t) return;
            const item = itemTypes.find(i=>i.id === itemId);
            addLog(`💥 ${userName} が ${t.name} に ${item.name} を使用！`, 'danger');
            
            playSound('item-use');
            const el = document.getElementById(targetId);
            
            if (itemId === 'shell') {
                if(el) {
                    el.classList.add('anim-shake');
                    setTimeout(()=>el.classList.remove('anim-shake'), 500);
                }
                t.pos = Math.max(0, t.pos - 2);
                updateAllPlayerDOMs();
                if(targetId === state.myId) centerCamOn(t.pos);
            } else if (itemId === 'banana') {
                t.debuff = 'banana';
                if(targetId === state.myId) updateHUD();
            } else if (itemId === 'clock') {
                if (targetId === state.myId) {
                    myCooldown += 10000;
                    els.cdBarBg.classList.remove('hidden');
                } else {
                    t.cooldown += 10000;
                }
            }
        }

        function openTargetMenu() {
            const list = document.getElementById('target-list');
            list.innerHTML = '';
            
            Object.entries(state.players).forEach(([id, p]) => {
                if (id === state.myId || p.pos === 0 || p.pos >= BOARD_SIZE-1) return; // Cant target self, start, or goal
                const btn = document.createElement('button');
                btn.className = 'w-full bg-blue-600 hover:bg-blue-500 text-white font-black text-lg py-3 rounded-2xl active:translate-y-1 transition flex items-center px-4 border-2 border-blue-400 shadow-[0_4px_0_#1e3a8a] active:shadow-none mb-3';
                btn.innerHTML = `<img src="${drawAvatar(p.shape, p.colorB, p.colorE)}" class="w-10 h-10 mr-4 bg-black/30 rounded-full border border-white/50"> ${p.name}`;
                btn.onclick = () => {
                    const itemId = state.players[state.myId].items.splice(selectedItemIdx, 1)[0];
                    applyItem(itemId, id, state.players[state.myId].name);
                    updateHUD();
                    modalTarget.classList.add('hidden'); modalTarget.classList.remove('flex');
                };
                list.appendChild(btn);
            });
            modalTarget.classList.remove('hidden'); modalTarget.classList.add('flex');
        }

        document.getElementById('btn-cancel-target').onclick = () => {
            modalTarget.classList.add('hidden'); modalTarget.classList.remove('flex');
            els.btnBag.click(); // go back
        };

        async function doIris(dir) {
            els.iris.classList.remove('hidden', 'anim-iris-in', 'anim-iris-out');
            els.iris.classList.add(dir === 'in' ? 'anim-iris-in' : 'anim-iris-out');
            await sleep(800);
            if (dir === 'in') els.iris.classList.add('hidden');
        }

        async function startBattle(p1Id, p2Id) {
            battle.active = true;
            battle.p1Id = p1Id;
            battle.p2Id = p2Id;
            
            const p1 = state.players[p1Id];
            const p2 = state.players[p2Id];
            addLog(`⚔️ BATTLE: ${p1.name} vs ${p2.name} !!`, 'danger');
            playSound('item-get'); // Alert sound
            
            await doIris('out');
            
            document.getElementById('game-screen').classList.add('hidden');
            const mgScreen = document.getElementById('minigame-screen');
            mgScreen.classList.remove('hidden'); mgScreen.classList.add('flex');
            
            document.getElementById('mg-p1-name').textContent = p1.name;
            document.getElementById('mg-p1-img').src = drawAvatar(p1.shape, p1.colorB, p1.colorE);
            document.getElementById('mg-p2-name').textContent = p2.name;
            document.getElementById('mg-p2-img').src = drawAvatar(p2.shape, p2.colorB, p2.colorE);
            
            const typeInfo = mgTypes[Math.floor(Math.random() * mgTypes.length)];
            battle.type = typeInfo.id;
            
            document.querySelectorAll('.minigame-ui').forEach(el => el.classList.remove('active'));
            document.getElementById(`mg-${battle.type}`).classList.add('active');
            
            await doIris('in');
            
            // Countdown
            battle.phase = 'count';
            const cdEl = document.getElementById('mg-countdown');
            const cdText = document.getElementById('mg-countdown-text');
            cdEl.classList.remove('hidden');
            for (let i = 3; i > 0; i--) {
                cdText.textContent = i;
                cdText.classList.add('anim-pop');
                playSound('count');
                await sleep(800);
                cdText.classList.remove('anim-pop');
                await sleep(200);
            }
            cdText.textContent = "START!";
            cdText.classList.add('anim-pop');
            playSound('start');
            await sleep(800);
            cdEl.classList.add('hidden');
            
            // Play Phase Setup
            battle.phase = 'play';
            battle.p1Score = 0;
            battle.p2Score = 0;
            
            // Generate CPU scores instantly
            const cpuSkill = Math.random();
            if (battle.type === 'mash') {
                battle.timer = 5.0;
                document.getElementById('mg-mash-score').textContent = '0';
                battle.p2Score = Math.floor(20 + cpuSkill * 30); // 20-50 clicks
            } else if (battle.type === 'gauge') {
                battle.timer = 0; 
                document.getElementById('mg-gauge-val').classList.add('hidden');
                battle.p2Score = Math.floor(75 + cpuSkill * 25); // 75-100
            } else if (battle.type === 'roulette') {
                battle.p2Score = Math.floor(10 + cpuSkill * 90); // 10-100
            } else if (battle.type === 'rps') {
                battle.timer = 3.0;
                battle.p2Score = Math.floor(Math.random() * 3);
            } else if (battle.type === 'just10') {
                battle.timer = 0;
                battle.p1Score = null; // null means running
                battle.p2Score = 9.0 + cpuSkill * 2.0; // 9.0 - 11.0
                document.getElementById('mg-just10-time').textContent = '0.00';
            }

            // If it's CPU vs CPU (shouldn't happen with early return, but just in case)
            if (p1Id !== state.myId && p2Id !== state.myId) {
                 await sleep(2000);
                 battle.p1Score = battle.p2Score + (Math.random() > 0.5 ? 1 : -1);
                 endMinigame();
            }
        }

        // Minigame Interactions
        document.getElementById('btn-mg-mash').addEventListener('touchstart', e => { e.preventDefault(); handleMgAction(); });
        document.getElementById('btn-mg-mash').addEventListener('mousedown', handleMgAction);
        document.getElementById('btn-mg-gauge').addEventListener('click', handleMgAction);
        document.getElementById('btn-mg-roulette').addEventListener('click', handleMgAction);
        document.querySelectorAll('.btn-mg-rps').forEach(b => b.addEventListener('click', e => {
            if (battle.phase !== 'play' || battle.type !== 'rps') return;
            battle.p1Score = parseInt(e.target.dataset.hand);
            endMinigame();
        }));
        document.getElementById('btn-mg-just10').addEventListener('click', handleMgAction);

        function handleMgAction() {
            if (battle.phase !== 'play') return;
            // Map actions to the correct player slot (am I P1 or P2?)
            const isP1 = battle.p1Id === state.myId;
            const updateScore = (val) => { if(isP1) battle.p1Score = val; else battle.p2Score = val; };
            const getScore = () => isP1 ? battle.p1Score : battle.p2Score;

            if (battle.type === 'mash') {
                updateScore(getScore() + 1);
                document.getElementById('mg-mash-score').textContent = getScore();
                playSound('hit');
            } else if (battle.type === 'gauge') {
                const val = Math.floor(Math.abs(Math.sin(battle.timer * 4)) * 100);
                updateScore(val);
                document.getElementById('mg-gauge-bar').style.width = `${val}%`;
                const vEl = document.getElementById('mg-gauge-val');
                vEl.textContent = val; vEl.classList.remove('hidden'); vEl.classList.add('anim-pop');
                endMinigame();
            } else if (battle.type === 'roulette') {
                updateScore(parseInt(document.getElementById('mg-roulette-num').textContent));
                endMinigame();
            } else if (battle.type === 'just10') {
                if (getScore() === null) {
                    updateScore(0); // Mark started
                    const btn = document.getElementById('btn-mg-just10');
                    btn.textContent = 'STOP!';
                    btn.className = btn.className.replace('bg-green-500', 'bg-red-600').replace('hover:bg-green-400', 'hover:bg-red-500').replace('border-green-300', 'border-red-400');
                } else {
                    updateScore(battle.timer);
                    endMinigame();
                }
            }
        }

        // Minigame Loop Update
        function updateMinigameLoop(dtSec) {
            if (battle.phase !== 'play') return;
            
            const isP1 = battle.p1Id === state.myId;
            const getScore = () => isP1 ? battle.p1Score : battle.p2Score;
            const updateScore = (val) => { if(isP1) battle.p1Score = val; else battle.p2Score = val; };

            if (battle.type === 'mash') {
                battle.timer -= dtSec;
                document.getElementById('mg-mash-time').textContent = Math.max(0, battle.timer).toFixed(1);
                if (battle.timer <= 0) endMinigame();
            } else if (battle.type === 'gauge') {
                battle.timer += dtSec;
                const v = Math.abs(Math.sin(battle.timer * 4)) * 100;
                document.getElementById('mg-gauge-bar').style.width = `${v}%`;
            } else if (battle.type === 'roulette') {
                document.getElementById('mg-roulette-num').textContent = Math.floor(Math.random() * 99) + 1;
            } else if (battle.type === 'rps') {
                battle.timer -= dtSec;
                document.getElementById('mg-rps-time').textContent = Math.max(0, battle.timer).toFixed(1);
                if (battle.timer <= 0) { updateScore(-1); endMinigame(); } // Timeout
            } else if (battle.type === 'just10') {
                if (getScore() !== null) { // Started
                    battle.timer += dtSec;
                    const el = document.getElementById('mg-just10-time');
                    if (battle.timer < 3) el.textContent = battle.timer.toFixed(2);
                    else el.textContent = '?.??';
                }
            }
        }

        async function endMinigame() {
            battle.phase = 'end';
            
            const isP1 = battle.p1Id === state.myId;
            const myS = isP1 ? battle.p1Score : battle.p2Score;
            const enS = isP1 ? battle.p2Score : battle.p1Score;
            
            let win = false;
            let sub = '';

            if (battle.type === 'mash' || battle.type === 'gauge' || battle.type === 'roulette') {
                win = myS >= enS;
                sub = `${myS} vs ${enS}`;
            } else if (battle.type === 'rps') {
                if (myS === -1) win = false;
                else {
                    const h = ['✊', '✌️', '✋'];
                    sub = `${h[myS]} vs ${h[enS]}`;
                    if (myS === enS) win = true; // Tie goes to player for fun
                    else if ((myS===0 && enS===1) || (myS===1 && enS===2) || (myS===2 && enS===0)) win = true;
                }
            } else if (battle.type === 'just10') {
                const myDiff = Math.abs(10 - myS);
                const enDiff = Math.abs(10 - enS);
                win = myDiff <= enDiff;
                sub = `${myS.toFixed(2)}s vs ${enS.toFixed(2)}s`;
                document.getElementById('mg-just10-time').textContent = myS.toFixed(2);
                
                const btn = document.getElementById('btn-mg-just10');
                btn.textContent = 'START!';
                btn.className = btn.className.replace('bg-red-600', 'bg-green-500').replace('hover:bg-red-500', 'hover:bg-green-400').replace('border-red-400', 'border-green-300');
            }

            const resOverlay = document.getElementById('mg-result-overlay');
            const resText = document.getElementById('mg-result-text');
            document.getElementById('mg-result-sub').textContent = sub;
            
            resOverlay.classList.remove('hidden');
            
            if (win) {
                resText.textContent = "YOU WIN!!";
                resText.className = "text-7xl font-black mb-4 text-transparent bg-clip-text bg-gradient-to-b from-yellow-300 to-yellow-600 drop-shadow-[0_0_30px_rgba(234,179,8,0.8)] transform scale-100 transition-transform duration-500";
                playSound('win');
            } else {
                resText.textContent = "LOSE...";
                resText.className = "text-7xl font-black mb-4 text-transparent bg-clip-text bg-gradient-to-b from-blue-300 to-blue-600 drop-shadow-[0_0_30px_rgba(59,130,246,0.8)] transform scale-100 transition-transform duration-500";
                playSound('lose');
            }
            
            await sleep(3500);
            resOverlay.classList.add('hidden');
            
            // Return
            await doIris('out');
            document.getElementById('minigame-screen').classList.add('hidden');
            document.getElementById('minigame-screen').classList.remove('flex');
            document.getElementById('game-screen').classList.remove('hidden');
            await doIris('in');
            
            // Penalty
            const loserId = win ? (isP1 ? battle.p2Id : battle.p1Id) : state.myId;
            const loserP = state.players[loserId];
            
            addLog(`💢 ${loserP.name} は敗北ペナルティで2マス後退！`, 'danger');
            
            const loserEl = document.getElementById(loserId);
            if (loserEl) {
                loserEl.classList.add('anim-shake');
                await sleep(600);
                loserP.pos = Math.max(0, loserP.pos - 2);
                updateAllPlayerDOMs();
                if(loserId === state.myId) centerCamOn(loserP.pos);
                loserEl.classList.remove('anim-shake');
            }
            
            battle.active = false;
        }

        function gameLoop(time) {
            const dt = time - lastTime;
            lastTime = time;

            if (state.status === 'playing') {
                // Self Cooldown
                if (myCooldown > 0 && !isRolling && !battle.active) {
                    myCooldown -= dt;
                    els.btnDice.disabled = true;
                    const pct = Math.max(0, myCooldown / MAX_COOLDOWN) * 100;
                    els.cdBar.style.width = `${pct}%`;
                    if (myCooldown <= 0) {
                        myCooldown = 0;
                        els.btnDice.disabled = false;
                        els.cdBarBg.classList.add('hidden');
                        els.btnDice.classList.add('anim-pop'); // Notify ready
                        setTimeout(()=>els.btnDice.classList.remove('anim-pop'), 400);
                    }
                }

                // CPU Logic
                if (state.mode === 'offline' && !battle.active) {
                    ['cpu1', 'cpu2', 'cpu3'].forEach(id => {
                        const cpu = state.players[id];
                        if (cpu && !cpu.moving && cpu.pos < BOARD_SIZE - 1) {
                            if (cpu.cooldown > 0) {
                                cpu.cooldown -= dt;
                            } else {
                                // Action time
                                if (cpu.items.length > 0 && Math.random() < 0.25) {
                                    const item = cpu.items.shift();
                                    // Target random valid player
                                    const targets = Object.keys(state.players).filter(tid => tid !== id && state.players[tid].pos > 0 && state.players[tid].pos < BOARD_SIZE-1);
                                    if(targets.length > 0) {
                                        const t = targets[Math.floor(Math.random() * targets.length)];
                                        applyItem(item, t, cpu.name);
                                    }
                                }
                                rollDice(id);
                            }
                        }
                    });
                }
            }

            if (battle.active) {
                updateMinigameLoop(dt / 1000);
            }

            requestAnimationFrame(gameLoop);
        }

        function updatePreview() {
            els.btnReady.style.pointerEvents = 'none'; // Prevent spam
            document.getElementById('avatar-preview').src = drawAvatar(formShape, formBody, formExt);
            els.btnReady.style.pointerEvents = 'auto';
        }

        document.querySelectorAll('.avatar-select').forEach(btn => {
            btn.addEventListener('click', e => {
                document.querySelectorAll('.avatar-select').forEach(b => b.classList.replace('border-yellow-400', 'border-transparent'));
                e.currentTarget.classList.replace('border-transparent', 'border-yellow-400');
                formShape = e.currentTarget.dataset.shape;
                updatePreview();
            });
        });

        document.getElementById('input-color-body').addEventListener('input', e => { formBody = e.target.value; updatePreview(); });
        document.getElementById('input-color-ext').addEventListener('input', e => { formExt = e.target.value; updatePreview(); });

        els.btnDice.addEventListener('click', () => rollDice(state.myId));
        els.btnCenter.addEventListener('click', () => centerCamOn(state.players[state.myId].pos));

        const elsBtnReady = document.getElementById('btn-ready');
        els.btnReady = elsBtnReady;
        
        elsBtnReady.addEventListener('click', async () => {
            await setupAudio();
            const name = document.getElementById('input-name').value.trim() || 'Player';
            
            // Register self
            state.players[state.myId] = {
                name: name, shape: formShape, colorB: formBody, colorE: formExt,
                pos: 0, cooldown: 0, items: [], debuff: null, moving: false
            };

            // Transition
            document.getElementById('lobby-screen').classList.add('hidden');
            document.getElementById('game-screen').classList.remove('hidden');
            state.status = 'playing';
            
            createBoard();
            updateAllPlayerDOMs();
            
            setTimeout(() => centerCamOn(0), 100);
            addLog('ゲーム開始！', 'system');
            
            lastTime = performance.now();
            requestAnimationFrame(gameLoop);
        });

        async function initNetwork() {
            try {
                // Dummy config will fail purposefully to trigger offline mode gracefully
                const app = initializeApp({ apiKey: "dummy", projectId: "dummy" });
                const auth = getAuth(app);
                const timeout = new Promise((_, r) => setTimeout(() => r(new Error('timeout')), 1500));
                await Promise.race([signInAnonymously(auth), timeout]);
            } catch (e) {
                document.getElementById('lobby-status').textContent = 'オフラインモードで起動しました';
                document.getElementById('lobby-status').classList.replace('text-gray-400', 'text-yellow-400');
                
                state.mode = 'offline';
                // Add CPU rivals to make it a 4-player game
                state.players['cpu1'] = { name: 'CPU ネコ', shape: 'cat', colorB: '#ef4444', colorE: '#991b1b', pos: 0, cooldown: 2000, items: [], debuff: null, moving: false };
                state.players['cpu2'] = { name: 'CPU ウサギ', shape: 'rabbit', colorB: '#f472b6', colorE: '#be185d', pos: 0, cooldown: 4000, items: [], debuff: null, moving: false };
                state.players['cpu3'] = { name: 'CPU ジゾウ', shape: 'jizo', colorB: '#9ca3af', colorE: '#4b5563', pos: 0, cooldown: 6000, items: [], debuff: null, moving: false };
            }
        }

        // Boot
        updatePreview();
        initNetwork();

    </script>
</body>
</html>

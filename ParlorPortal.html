<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DORA-PARLOR ポータル</title>
    <style>
        /* 画面全体に隙間なくiframeをフィットさせる設定 */
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            background-color: #000;
            overflow: hidden;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            margin: 0;
            padding: 0;
            display: block;
        }
    </style>
</head>
<body>

    <!-- 初期状態ではホールアプリを読み込みます -->
    <iframe id="appFrame" src="PachinkoParlor.html" allow="autoplay"></iframe>

 <script>
    const frame = document.getElementById('appFrame'); // もしIDが違う場合は適宜合わせてください

    window.addEventListener('message', (event) => {
        if (!event.data || typeof event.data !== 'object') return;

        const { type, machineId } = event.data;
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;

        // 1. ホールから台へ着席するとき
        if (type === 'SIT_DOWN') {
            if (AudioContextClass) {
                const audioCtx = new AudioContextClass();
                audioCtx.resume().then(() => {
                    console.log('[Portal] 台着席時のオーディオ解放成功');
                    const targetSkin = machineId ? machineId : 'default';
                    frame.src = `PachinkoMachine.html?machine=${targetSkin}`;
                }).catch(err => {
                    frame.src = `PachinkoMachine.html?machine=${machineId || 'default'}`;
                });
            } else {
                frame.src = `PachinkoMachine.html?machine=${machineId || 'default'}`;
            }
        }

        // 2. 台からホールに戻るとき 【★ここを修正】
        if (type === 'RETURN_HALL') {
            console.log('[Portal] ホールへ戻る処理を開始します');
            
            if (AudioContextClass) {
                // ホールに戻る「クリックの瞬間」の権利を使って、親画面側で再度オーディオを解放
                const audioCtx = new AudioContextClass();
                audioCtx.resume().then(() => {
                    console.log('[Portal] ホール帰還時のオーディオ解放成功');
                    frame.src = 'PachinkoParlor.html';
                }).catch(err => {
                    console.error('[Portal] 解放失敗、そのまま戻ります:', err);
                    frame.src = 'PachinkoParlor.html';
                });
            } else {
                frame.src = 'PachinkoParlor.html';
            }
        }

            // 3. ポータルトップや大金庫など外部ページへ抜けるとき
            if (type === 'NAVIGATE_TOP' && url) {
                window.top.location.href = url;
            }
        });
    </script>
</body>
</html>

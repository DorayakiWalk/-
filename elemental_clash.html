<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Elemental Clash - Streamer Card Game</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* 基本設定 */
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; touch-action: manipulation; }
        
        /* 3Dカードフリップ */
        .card-container {
            perspective: 1000px;
            width: 80px;
            height: 110px;
        }
        .card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            text-align: center;
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            transform-style: preserve-3d;
        }
        .card-inner.is-flipped {
            transform: rotateY(180deg);
        }
        .card-front, .card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            -webkit-backface-visibility: hidden;
            backface-visibility: hidden;
            border-radius: 0.5rem;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        .card-back {
            background: linear-gradient(135deg, #1f2937, #111827);
            border: 2px solid #4b5563;
        }
        .card-front {
            transform: rotateY(180deg);
            background: #ffffff;
            color: #000;
        }
        
        /* 手札用カード */
        .hand-card {
            width: 70px; height: 100px;
            background: white; border-radius: 0.5rem;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .hand-card.selected {
            transform: translateY(-10px) scale(1.1);
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.5);
        }

        /* 属性別スタイル */
        .element-FIRE { border: 4px solid #ef4444; }
        .element-THUNDER { border: 4px solid #eab308; }
        .element-WATER { border: 4px solid #3b82f6; }

        /* 発光アニメーション(DOMのカード枠用) */
        @keyframes glowBuff {
            0% { box-shadow: 0 0 10px currentColor; }
            50% { box-shadow: 0 0 40px 15px currentColor; transform: scale(1.05); }
            100% { box-shadow: 0 0 10px currentColor; transform: scale(1); }
        }
        .glow-buff { animation: glowBuff 1s ease-in-out; }

        /* 揺れアニメーション */
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-5px) rotate(-2deg); }
            40%, 80% { transform: translateX(5px) rotate(2deg); }
        }
        .shake { animation: shake 0.4s; border-color: red !important; }

        /* 全体レイアウト */
        .app-container {
            height: 100dvh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background-color: #111827;
        }
    </style>
</head>

        // --------------------------------------------------------
        // Canvas エフェクトシステム
        // --------------------------------------------------------
        const canvas = document.getElementById('effect-canvas');
        const ctx = canvas.getContext('2d');
        let activeEffects = [];

        function resizeCanvas() {
            canvas.width = canvas.clientWidth;
            canvas.height = canvas.clientHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        function animateEffects(time) {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            for(let i = activeEffects.length - 1; i >= 0; i--) {
                const effect = activeEffects[i];
                effect.update(time);
                effect.draw(ctx);
                if(effect.isDead) activeEffects.splice(i, 1);
            }
            requestAnimationFrame(animateEffects);
        }
        requestAnimationFrame(animateEffects);

        // クラス定義
        class PopUpText {
            constructor(x, y, text, color) {
                this.x = x; this.y = y; this.text = text; this.color = color;
                this.startTime = performance.now();
                this.duration = 1500;
                this.isDead = false;
                this.progress = 0;
            }
            update(time) {
                let p = (time - this.startTime) / this.duration;
                if(p >= 1) this.isDead = true;
                this.progress = p;
            }
            draw(ctx) {
                let alpha = 1, dy = 0, scale = 1;
                if (this.progress < 0.2) {
                    let t = this.progress / 0.2;
                    alpha = t; dy = -20 * t; scale = 0.5 + 1.0 * t;
                } else if (this.progress < 0.8) {
                    let t = (this.progress - 0.2) / 0.6;
                    dy = -20 - 10 * t; scale = 1.5 - 0.5 * t;
                } else {
                    let t = (this.progress - 0.8) / 0.2;
                    alpha = 1 - t; dy = -30 - 10 * t; scale = 1;
                }
                ctx.save();
                ctx.globalAlpha = alpha;
                ctx.translate(this.x, this.y + dy);
                ctx.scale(scale, scale);
                ctx.font = "900 32px 'Segoe UI', Tahoma, sans-serif";
                ctx.textAlign = "center";
                ctx.textBaseline = "middle";
                ctx.lineWidth = 4;
                ctx.strokeStyle = '#000';
                ctx.strokeText(this.text, 0, 0);
                ctx.shadowColor = this.color;
                ctx.shadowBlur = 20;
                ctx.fillStyle = this.color;
                ctx.fillText(this.text, 0, 0);
                ctx.restore();
            }
        }

        class Projectile {
            constructor(sx, sy, ex, ey, elData, diff, onComplete) {
                this.sx = sx; this.sy = sy; this.ex = ex; this.ey = ey;
                this.elData = elData; this.onComplete = onComplete;
                this.duration = 400; this.startTime = performance.now();
                this.size = diff >= 6 ? 40 : (diff >= 3 ? 30 : 20);
                this.isDead = false;
                this.angle = Math.atan2(ey - sy, ex - sx);
            }
            update(time) {
                let p = (time - this.startTime) / this.duration;
                p = p * p; // ease-in 加速
                if(p >= 1) { p = 1; this.isDead = true; this.onComplete(); }
                this.x = this.sx + (this.ex - this.sx) * p;
                this.y = this.sy + (this.ey - this.sy) * p;
            }
            draw(ctx) {
                ctx.save();
                ctx.translate(this.x, this.y);
                if (this.elData.id === 'FIRE') {
                    ctx.shadowColor = this.elData.shadow; ctx.shadowBlur = this.size;
                    ctx.fillStyle = this.elData.color;
                    ctx.beginPath(); ctx.arc(0, 0, this.size/2, 0, Math.PI*2); ctx.fill();
                } else if (this.elData.id === 'WATER') {
                    ctx.rotate(this.angle - Math.PI/2);
                    ctx.shadowColor = this.elData.shadow; ctx.shadowBlur = this.size * 0.7;
                    ctx.fillStyle = this.elData.color;
                    ctx.beginPath();
                    let r = this.size / 2;
                    ctx.arc(0, r/2, r, 0, Math.PI);
                    ctx.lineTo(0, -r*1.5);
                    ctx.closePath();
                    ctx.fill();
                } else if (this.elData.id === 'THUNDER') {
                    ctx.rotate(this.angle);
                    ctx.shadowColor = this.elData.shadow; ctx.shadowBlur = 10;
                    ctx.fillStyle = this.elData.color;
                    let s = this.size;
                    ctx.beginPath();
                    ctx.moveTo(-s/2, 0); ctx.lineTo(0, s/3); ctx.lineTo(-s/6, 0); ctx.lineTo(s/2, -s/3);
                    ctx.closePath();
                    ctx.fill();
                }
                ctx.restore();
            }
        }

        class Particle {
            constructor(x, y, elData, diff) {
                this.sx = x; this.sy = y; this.elData = elData;
                const distMult = diff >= 6 ? 3.0 : (diff >= 3 ? 1.5 : 1);
                const dist = (40 + Math.random()*30) * distMult;
                const angle = Math.random() * Math.PI * 2;
                this.size = 6 + Math.random()*6;
                
                if (elData.id === 'FIRE') {
                    this.vx = Math.cos(angle) * dist * 0.8;
                    this.vy = -Math.abs(Math.sin(angle) * dist) - (10 * distMult); // 常に上へ
                    this.duration = 400 + Math.random()*200;
                } else if (elData.id === 'WATER') {
                    this.vx = Math.cos(angle) * dist * 0.6;
                    this.vy = Math.abs(Math.sin(angle) * dist) + (10 * distMult); // 常に下へ
                    this.duration = 400 + Math.random()*200;
                } else {
                    this.vx = Math.cos(angle) * dist * 1.2;
                    this.vy = Math.sin(angle) * dist * 1.2;
                    this.duration = 200 + Math.random()*100;
                }
                
                this.startTime = performance.now();
                this.isDead = false;
                this.rot = Math.random() * Math.PI * 2;
                this.rotSpeed = (Math.random() - 0.5) * 10;
            }
            update(time) {
                let p = (time - this.startTime) / this.duration;
                let pEase = this.elData.id === 'THUNDER' ? p : 1 - (1 - p) * (1 - p); // 雷は線形
                if(p >= 1) { this.isDead = true; pEase = 1; }
                this.x = this.sx + this.vx * pEase;
                this.y = this.sy + this.vy * pEase;
                this.alpha = 1 - p;
                this.scale = 1 - pEase;
            }
            draw(ctx) {
                ctx.save();
                ctx.globalAlpha = this.alpha;
                ctx.translate(this.x, this.y);
                ctx.scale(this.scale, this.scale);
                ctx.fillStyle = this.elData.color;
                
                if(this.elData.id === 'THUNDER') {
                    ctx.rotate(this.rot + this.rotSpeed * (1-this.alpha));
                    ctx.fillRect(-this.size/2, -this.size/2, this.size, this.size);
                } else {
                    ctx.beginPath(); ctx.arc(0,0,this.size/2,0,Math.PI*2); ctx.fill();
                }
                ctx.restore();
            }
        }

        class DamageOrb {
            constructor(sx, sy, ex, ey, onComplete) {
                this.sx = sx; this.sy = sy; this.ex = ex; this.ey = ey;
                this.onComplete = onComplete;
                this.duration = 600;
                this.startTime = performance.now();
                this.isDead = false;
            }
            update(time) {
                let p = (time - this.startTime) / this.duration;
                let pEase = 1 - Math.pow(1 - p, 3); // ふんわり
                if(p >= 1) { pEase = 1; this.isDead = true; this.onComplete(); }
                this.x = this.sx + (this.ex - this.sx) * pEase;
                this.y = this.sy + (this.ey - this.sy) * pEase;
            }
            draw(ctx) {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.shadowColor = '#fffaaa'; ctx.shadowBlur = 15;
                ctx.fillStyle = '#fff';
                ctx.beginPath(); ctx.arc(0,0,7,0,Math.PI*2); ctx.fill();
                ctx.restore();
            }
        }

        // --------------------------------------------------------
        // Firebase 認証・ルームロジック
        // --------------------------------------------------------
        async function initAuth() {
            try { 
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    await signInAnonymously(auth); 
                }
            } catch (error) { console.error("Auth failed:", error); }
        }
        onAuthStateChanged(auth, (user) => { if (user) currentUser = user; });

        const sleep = ms => new Promise(r => setTimeout(r, ms));
        const generateRoomId = () => Math.floor(1000 + Math.random() * 9000).toString();
        const getRandomCard = () => {
            const el = ELEMENTS[Math.floor(Math.random() * ELEMENTS.length)];
            return { element: el.id, power: Math.floor(Math.random() * 9) + 1 };
        };

        function resizeImage(file) {
            return new Promise(resolve => {
                const reader = new FileReader();
                reader.onload = e => {
                    const img = new Image();
                    img.onload = () => {
                        const c = document.createElement('canvas');
                        let w = img.width, h = img.height;
                        if(w>h) { if(w>100) { h*=100/w; w=100; } } else { if(h>100) { w*=100/h; h=100; } }
                        c.width = w; c.height = h;
                        c.getContext('2d').drawImage(img, 0, 0, w, h);
                        resolve(c.toDataURL('image/jpeg', 0.7));
                    };
                    img.src = e.target.result;
                };
                reader.readAsDataURL(file);
            });
        }

        ui.inputIcon.addEventListener('change', async e => {
            if (e.target.files[0]) {
                myPlayerInfo.iconData = await resizeImage(e.target.files[0]);
                ui.iconPreviewImg.src = myPlayerInfo.iconData;
                ui.iconPreviewImg.classList.remove('hidden');
                ui.iconPreviewText.classList.add('hidden');
            }
        });
        ui.inputName.addEventListener('input', e => {
            if(!myPlayerInfo.iconData) {
                const n = e.target.value.trim();
                ui.iconPreviewText.textContent = n ? n.charAt(0).toUpperCase() : '?';
            }
        });

        ui.btnGreenback.addEventListener('click', () => {
            ui.battleArea.classList.toggle('bg-gray-800');
            ui.battleArea.classList.toggle('bg-[#00FF00]');
        });

        function switchView(view) {
            ui.lobbyUi.classList.add('hidden');
            ui.battleField.classList.add('hidden');
            ui.handUi.classList.add('hidden');
            ui.waitingUi.classList.add('hidden');
            if(view === 'lobby') ui.lobbyUi.classList.remove('hidden');
            else if (view === 'hand') { ui.battleField.classList.remove('hidden'); ui.handUi.classList.remove('hidden'); }
            else if (view === 'waiting') { ui.battleField.classList.remove('hidden'); ui.waitingUi.classList.remove('hidden'); }
        }

        function preparePlayerInfo() {
            myPlayerInfo.name = ui.inputName.value.trim() || "PLAYER";
        }

        function updateProfile(pNum, info) {
            const nameEl = pNum === 1 ? ui.p1Name : ui.p2Name;
            const container = document.getElementById(`p${pNum}-icon`);
            if (info) {
                nameEl.textContent = info.name;
                container.innerHTML = info.iconData 
                    ? `<img src="${info.iconData}" class="w-full h-full object-cover">`
                    : `<span class="text-[10px] font-bold text-white">${info.name.charAt(0).toUpperCase()}</span>`;
            }
        }

        ui.btnCreate.addEventListener('click', async () => {
            if(!currentUser) return;
            preparePlayerInfo();
            const roomId = generateRoomId();
            isHost = true; currentRoomId = roomId;
            ui.roomIdText.textContent = roomId;
            ui.roomDisplay.classList.remove('hidden');

            const ref = doc(db, 'artifacts', appIdStr, 'public', 'data', 'rooms', roomId);
            await setDoc(ref, { hostId: currentUser.uid, guestId: null, p1Info: myPlayerInfo, p2Info: null, p1Hp: MAX_HP, p2Hp: MAX_HP, p1Card: null, p2Card: null, phase: 'waiting' });
            
            document.getElementById('p1-status').textContent = "YOU";
            document.getElementById('p2-status').textContent = "OPPONENT";
            document.getElementById('p1-status').classList.remove('opacity-0');
            document.getElementById('p2-status').classList.remove('opacity-0');

            startRoomListener(roomId);
            drawInitialHand();
            switchView('waiting');
        });

        ui.btnJoin.addEventListener('click', async () => {
            if(!currentUser) return;
            const roomId = ui.inputId.value.trim();
            if(!roomId) return;
            preparePlayerInfo();

            const ref = doc(db, 'artifacts', appIdStr, 'public', 'data', 'rooms', roomId);
            const snap = await getDoc(ref);
            
            if(snap.exists() && !snap.data().guestId) {
                isHost = false; currentRoomId = roomId;
                ui.roomIdText.textContent = roomId;
                ui.roomDisplay.classList.remove('hidden');
                
                document.getElementById('p1-status').textContent = "OPPONENT";
                document.getElementById('p2-status').textContent = "YOU";
                document.getElementById('p1-status').classList.remove('opacity-0');
                document.getElementById('p2-status').classList.remove('opacity-0');

                await updateDoc(ref, { guestId: currentUser.uid, p2Info: myPlayerInfo });
                startRoomListener(roomId);
                drawInitialHand();
                switchView('hand');
            } else alert("ルームが見つからないか満員です");
        });

        function startRoomListener(roomId) {
            const ref = doc(db, 'artifacts', appIdStr, 'public', 'data', 'rooms', roomId);
            onSnapshot(ref, async snap => {
                const data = snap.data();
                if(!data) return;

                if(data.p1Info) updateProfile(1, data.p1Info);
                if(data.p2Info) updateProfile(2, data.p2Info);

                if(isHost && data.guestId && data.phase === 'waiting' && !isAnimating && ui.handUi.classList.contains('hidden')) {
                    switchView('hand');
                }

                if(!isAnimating) {
                    updateHpUI(data.p1Hp, data.p2Hp);
                    if (data.p1Card && !ui.p1Slot.innerHTML.includes('card-inner')) ui.p1Slot.innerHTML = createHiddenCard();
                    if (data.p2Card && !ui.p2Slot.innerHTML.includes('card-inner')) ui.p2Slot.innerHTML = createHiddenCard();
                }

                if(data.p1Card && data.p2Card && data.phase === 'action' && !isAnimating) {
                    isAnimating = true;
                    switchView('waiting');
                    await runBattle(data.p1Card, data.p2Card, data.p1Hp, data.p2Hp);
                    isAnimating = false;
                    
                    if(data.p1Hp <= 0 || data.p2Hp <= 0) {
                        showResult(data.p1Hp, data.p2Hp); return;
                    }

                    if(isHost) await updateDoc(ref, { p1Card: null, p2Card: null, phase: 'waiting' });
                    
                    ui.p1Slot.innerHTML = ''; ui.p2Slot.innerHTML = '';
                    switchView('hand');
                }
            });
        }

        function drawInitialHand() { myHand = [getRandomCard(), getRandomCard(), getRandomCard()]; renderHand(); }

        function renderHand() {
            ui.handCards.innerHTML = ''; selectedCardIndex = null; updateBtn();
            myHand.forEach((card, i) => {
                const el = ELEMENTS.find(e => e.id === card.element);
                const div = document.createElement('div');
                div.className = `hand-card element-${card.element}`;
                div.innerHTML = `<div class="text-2xl mb-1">${el.icon}</div><div class="text-3xl font-black text-gray-800">${card.power}</div>`;
                div.onclick = () => {
                    document.querySelectorAll('.hand-card').forEach(c => c.classList.remove('selected'));
                    div.classList.add('selected'); selectedCardIndex = i; updateBtn();
                };
                ui.handCards.appendChild(div);
            });
        }

        function updateBtn() {
            if(selectedCardIndex !== null) {
                ui.btnConfirm.disabled = false;
                ui.btnConfirm.className = "w-full max-w-sm bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 rounded-lg shadow-[0_0_15px_rgba(59,130,246,0.5)] cursor-pointer text-sm tracking-widest border border-blue-400";
                ui.btnConfirm.textContent = "CONFIRM SET";
            } else {
                ui.btnConfirm.disabled = true;
                ui.btnConfirm.className = "w-full max-w-sm bg-gray-800 text-gray-500 font-bold py-3 rounded-lg shadow-inner cursor-not-allowed transition-all duration-200 text-sm border border-gray-700 tracking-widest";
                ui.btnConfirm.textContent = "SELECT A CARD";
            }
        }

        ui.btnConfirm.addEventListener('click', async () => {
            if(selectedCardIndex === null || isAnimating) return;
            const card = myHand[selectedCardIndex];
            myHand[selectedCardIndex] = getRandomCard();
            
            if(isHost) ui.p1Slot.innerHTML = createHiddenCard();
            else ui.p2Slot.innerHTML = createHiddenCard();

            switchView('waiting');
            ui.btnConfirm.textContent = "SET COMPLETED";
            
            const ref = doc(db, 'artifacts', appIdStr, 'public', 'data', 'rooms', currentRoomId);
            await updateDoc(ref, isHost ? { p1Card: card } : { p2Card: card });
            const snap = await getDoc(ref);
            if(snap.data().p1Card && snap.data().p2Card) await updateDoc(ref, { phase: 'action' });
        });

        function createHiddenCard() {
            return `<div class="card-inner"><div class="card-back flex items-center justify-center"><div class="text-gray-600 font-bold text-xs opacity-50 tracking-widest rotate-[-45deg]">SET</div></div></div>`;
        }

        function createCard(c) {
            const el = ELEMENTS.find(e => e.id === c.element);
            return `<div class="card-inner"><div class="card-back flex items-center justify-center"><div class="text-gray-600 font-bold text-xs opacity-50 tracking-widest rotate-[-45deg]">SET</div></div><div class="card-front element-${c.element}"><div class="text-2xl mb-1">${el.icon}</div><div class="text-4xl font-black text-gray-800 power-val leading-none">${c.power}</div></div></div>`;
        }

        async function runBattle(c1, c2, hp1, hp2) {
            ui.p1Slot.innerHTML = createCard(c1); ui.p2Slot.innerHTML = createCard(c2);
            ui.p1Slot.offsetWidth; 
            await sleep(500);
            
            ui.p1Slot.querySelector('.card-inner').classList.add('is-flipped');
            ui.p2Slot.querySelector('.card-inner').classList.add('is-flipped');
            await sleep(1000);

            let adv = (c1.element==='FIRE'&&c2.element==='THUNDER')||(c1.element==='THUNDER'&&c2.element==='WATER')||(c1.element==='WATER'&&c2.element==='FIRE') ? 1 : 
                      (c1.element===c2.element ? 0 : -1);
            let p1 = c1.power, p2 = c2.power;

            if (adv === 1) { p1+=3; await playBuff('p1-slot', p1, c1.element); }
            else if (adv === -1) { p2+=3; await playBuff('p2-slot', p2, c2.element); }
            await sleep(800);

            let nhp1 = hp1, nhp2 = hp2;
            if (p1 > p2) {
                await playAttack('p1-slot', 'p2-slot', c1.element, p1-p2);
                await playOrb('p2-slot', 'p2-hp-box');
                nhp2 = Math.max(0, hp2 - p1);
                ui.p2HpBox.classList.add('shake'); setTimeout(() => ui.p2HpBox.classList.remove('shake'), 400);
            } else if (p2 > p1) {
                await playAttack('p2-slot', 'p1-slot', c2.element, p2-p1);
                await playOrb('p1-slot', 'p1-hp-box');
                nhp1 = Math.max(0, hp1 - p2);
                ui.p1HpBox.classList.add('shake'); setTimeout(() => ui.p1HpBox.classList.remove('shake'), 400);
            }

            updateHpUI(nhp1, nhp2);
            if (isHost) await updateDoc(doc(db, 'artifacts', appIdStr, 'public', 'data', 'rooms', currentRoomId), { p1Hp: nhp1, p2Hp: nhp2 });
            await sleep(1500);
        }

        async function playBuff(id, pwr, el) {
            const slot = document.getElementById(id);
            const front = slot.querySelector('.card-front');
            const elData = ELEMENTS.find(e => e.id === el);
            
            front.style.color = elData.color; front.classList.add('glow-buff');
            
            const rect = slot.getBoundingClientRect(), cRect = canvas.getBoundingClientRect();
            
            activeEffects.push(new PopUpText(
                rect.left - cRect.left + rect.width/2,
                rect.top - cRect.top,
                '+3', elData.color
            ));
            
            setTimeout(() => {
                slot.querySelector('.power-val').textContent = pwr;
                slot.querySelector('.power-val').style.color = elData.color;
            }, 500);
            await sleep(1500);
        }

        function playAttack(sId, eId, el, diff) {
            return new Promise(resolve => {
                const s = document.getElementById(sId).getBoundingClientRect();
                const e = document.getElementById(eId).getBoundingClientRect();
                const c = canvas.getBoundingClientRect();
                const sx = s.left+s.width/2-c.left, sy = s.top+s.height/2-c.top;
                const ex = e.left+e.width/2-c.left, ey = e.top+e.height/2-c.top;
                const elData = ELEMENTS.find(e => e.id === el);
                
                activeEffects.push(new Projectile(sx, sy, ex, ey, elData, diff, () => {
                    let cnt = diff >= 6 ? 20 : (diff >= 3 ? 12 : 8);
                    for(let i=0; i<cnt; i++) {
                        activeEffects.push(new Particle(ex, ey, elData, diff));
                    }
                    const endEl = document.getElementById(eId);
                    endEl.querySelector('.card-front').classList.add('shake');
                    setTimeout(() => endEl.querySelector('.card-front').classList.remove('shake'), 400);
                    resolve();
                }));
            });
        }

        function playOrb(sId, eId) {
            return new Promise(resolve => {
                const s = document.getElementById(sId).getBoundingClientRect();
                const e = document.getElementById(eId).getBoundingClientRect();
                const c = canvas.getBoundingClientRect();
                const sx = s.left+s.width/2-c.left, sy = s.top+s.height/2-c.top;
                const ex = e.left+e.width/2-c.left, ey = e.top+e.height/2-c.top;
                
                activeEffects.push(new DamageOrb(sx, sy, ex, ey, () => resolve()));
            });
        }

        function updateHpUI(hp1, hp2) {
            const p1 = Math.max(0, (hp1 / MAX_HP) * 100), p2 = Math.max(0, (hp2 / MAX_HP) * 100);
            ui.p1HpBar.style.width = `${p1}%`; ui.p2HpBar.style.width = `${p2}%`;
            ui.p1HpText.textContent = Math.max(0, hp1); ui.p2HpText.textContent = Math.max(0, hp2);
            [ui.p1HpBar, ui.p2HpBar].forEach((b, i) => {
                const pt = i === 0 ? p1 : p2;
                b.className = pt > 50 ? "transition-all duration-500 w-full h-full bg-gradient-to-r from-green-600 to-green-400" :
                             pt > 20 ? "transition-all duration-500 w-full h-full bg-gradient-to-r from-yellow-600 to-yellow-400" :
                                       "transition-all duration-500 w-full h-full bg-gradient-to-r from-red-600 to-red-400 animate-pulse";
            });
        }

        function showResult(hp1, hp2) {
            const msg = document.getElementById('result-message'), m = document.getElementById('result-text-main'), s = document.getElementById('result-text-sub');
            msg.classList.remove('hidden');
            let isWin = isHost ? hp1 > 0 : hp2 > 0;
            setTimeout(() => {
                msg.classList.remove('opacity-0');
                if(isWin) { m.textContent = "WIN!"; m.className = "text-5xl font-black text-yellow-400 drop-shadow-[0_0_20px_rgba(250,204,21,0.8)]"; s.textContent = "見事な勝利！"; } 
                else { m.textContent = "LOSE..."; m.className = "text-5xl font-black text-blue-400 drop-shadow-[0_0_20px_rgba(96,165,250,0.8)]"; s.textContent = "残念..."; }
            }, 100);
        }

        initAuth();
    </script>
</body>
</html>

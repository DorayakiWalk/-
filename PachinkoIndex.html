<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DORA-PARLOR ポータル</title>
    <style>
        /* 画面全体に隙間なくiframeをフィットさせる設定 */
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            background-color: #000;
            overflow: hidden;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            margin: 0;
            padding: 0;
            display: block;
        }
    </style>
</head>
<body>

    <!-- 初期状態ではホールアプリを読み込みます -->
    <iframe id="appFrame" src="PachinkoParlor.html" allow="autoplay"></iframe>

    <script>
        const frame = document.getElementById('appFrame');

        // 子画面（ホールやプレイ台）からの画面遷移メッセージを監視
        window.addEventListener('message', (event) => {
            // セキュリティ対策：身元不明のメッセージは無視
            if (!event.data || typeof event.data !== 'object') return;

            const { type, machineId, url } = event.data;

            // 1. ホールから「台に着席した」合図を受け取ったとき
            if (type === 'SIT_DOWN') {
                // 【最重要】ユーザーのタップイベント直後に、親画面でAudioContextを強制解放
                const AudioContextClass = window.AudioContext || window.webkitAudioContext;
                if (AudioContextClass) {
                    const audioCtx = new AudioContextClass();
                    audioCtx.resume().then(() => {
                        console.log('[MainFrame] ユーザー操作によりオーディオ空間を解放しました。');
                        
                        // クエリパラメータ付きのURLを構築してプレイ台へ遷移（例: ?machine=default）
                        const targetSkin = machineId ? machineId : 'default';
                        frame.src = `PachinkoMachine.html?machine=${targetSkin}`;
                    }).catch(err => {
                        console.error('[MainFrame] オーディオ解放に失敗:', err);
                        // 失敗した場合も遷移自体は実行
                        frame.src = `PachinkoMachine.html?machine=${machineId || 'default'}`;
                    });
                } else {
                    frame.src = `PachinkoMachine.html?machine=${machineId || 'default'}`;
                }
            }

            // 2. プレイ台から「ホールに戻る」合図を受け取ったとき
            if (type === 'RETURN_HALL') {
                console.log('[MainFrame] ホールに戻ります。');
                frame.src = 'PachinkoParlor.html';
            }
        });
    </script>
</body>
</html>
